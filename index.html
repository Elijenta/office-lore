/* ---------- NICKNAMES: helpers ---------- */
/* "Bijgedragen door" (createdByUserId) — NIET "over wie". Nicknames
   gaan over collega's op kantoor (personRealName, vrije tekst). */
function getUserNicknames(userId){
  return APP_DATA.nicknames.filter(n => n.createdByUserId === userId);
}

function nicknamePopularity(n){
  return n.votes.funny.length + n.votes.accurate.length + n.votes.savage.length + n.votes.legendary.length + n.votes.doubt.length;
}

function getLegendaryScore(n){ return n.votes.legendary.length; }
function getDoubtScore(n){ return n.votes.doubt.length; }

/* Een nickname is "Legendary" zodra alle 3 users hem Legendary hebben
   gegeven -- puur afgeleid, niets opgeslagen, verdwijnt vanzelf zodra
   iemand die stem intrekt (zelfde filosofie als getPoemOfTheMonth). */
function isLegendaryNickname(n){
  return APP_DATA.users.length > 0 && APP_DATA.users.every(u => n.votes.legendary.includes(u.id));
}

/* Alle groepen van nicknames die exact dezelfde "personRealName"
   delen — dit is PUUR visuele groepering bij het renderen, er wordt
   nergens een person-/colleague-record voor aangemaakt of bewaard.
   Alles hieronder wordt live herberekend uit APP_DATA.nicknames. */
function getNicknameRealNameGroups(list, compareFn){
  const source = list || APP_DATA.nicknames;
  const compare = compareFn || ((a, b) => (nicknamePopularity(b) - nicknamePopularity(a)) || (b.xp - a.xp));
  const order = [];
  const map = {};
  source.forEach(n => {
    const key = (n.personRealName || '').trim() || 'Onbekend';
    if (!map[key]){ map[key] = []; order.push(key); }
    map[key].push(n);
  });
  return order.map(name => {
    const items = [...map[name]].sort(compare);
    const totalXp = items.reduce((sum, n) => sum + n.xp, 0);
    const businessUnit = items.find(n => n.businessUnit)?.businessUnit || null;
    return { name, nicknames: items, count: items.length, totalXp, topNickname: items[0], businessUnit };
  });
}

/* Alle unieke "personRealName"-waarden die al ooit gebruikt zijn,
   over nicknames/quotes/anekdotes/counters heen — puur om als
   suggesties (datalist) te tonen in formulieren, geen opgeslagen
   entiteit. */
function getKnownRealNames(){
  const names = new Set();
  APP_DATA.nicknames.forEach(n => n.personRealName && names.add(n.personRealName));
  APP_DATA.quotes.forEach(q => q.personRealName && names.add(q.personRealName));
  APP_DATA.anecdotes.forEach(a => a.personRealName && names.add(a.personRealName));
  APP_DATA.counters.forEach(c => c.personRealName && names.add(c.personRealName));
  return [...names].sort((a, b) => a.localeCompare(b));
}

/* Unieke Business Units die al gebruikt zijn op nicknames, voor het
   filter-dropdown op de Nicknames-tab. */
function getKnownNicknameBusinessUnits(){
  const units = new Set();
  APP_DATA.nicknames.forEach(n => n.businessUnit && units.add(n.businessUnit));
  return [...units].sort((a, b) => a.localeCompare(b));
}

/* Past NICKNAME_FILTER_STATE (zoekterm + 3 filters) toe op
   APP_DATA.nicknames. Zoekterm matcht op nickname-tekst, echte naam
   en business unit. */
function getFilteredNicknames(){
  const q = NICKNAME_FILTER_STATE.search.trim().toLowerCase();
  return APP_DATA.nicknames.filter(n => {
    if (q){
      const haystack = `${n.text} ${n.personRealName || ''} ${n.businessUnit || ''}`.toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    if (NICKNAME_FILTER_STATE.businessUnit && n.businessUnit !== NICKNAME_FILTER_STATE.businessUnit) return false;
    if (NICKNAME_FILTER_STATE.createdBy && n.createdByUserId !== NICKNAME_FILTER_STATE.createdBy) return false;
    if (NICKNAME_FILTER_STATE.level && getNicknameLevelInfo(n.xp).level.label !== NICKNAME_FILTER_STATE.level) return false;
    return true;
  });
}

/* De kaarten-grid van de Nicknames-tab: gefilterd + visueel
   gegroepeerd op exacte "personRealName"-match. Los gehouden van de
   rest van de pagina (filter bar) zodat alleen dit stuk opnieuw
   gerenderd moet worden bij elke toetsaanslag in de zoekbalk — de
   zoekbalk zelf verliest daardoor nooit focus. */
function renderNicknamesResultsHtml(){
  const filtered = getFilteredNicknames();
  if (!filtered.length){
    return emptyState(APP_DATA.nicknames.length
      ? 'Geen nicknames gevonden voor deze zoekopdracht/filters.'
      : 'Nog geen nicknames. Klik op "+ Nieuwe nickname" om te beginnen.');
  }

  if (NICKNAME_VIEW_STATE.mode === 'compact'){
    const compare = getNicknameSortCompare();
    const sorted = [...filtered].sort(compare);
    return `<div class="row-list">${sorted.map(n => renderNicknameCompactRow(n)).join('')}</div>`;
  }

  const isDefaultSort = NICKNAME_SORT_STATE.sortBy === 'default';
  const compare = isDefaultSort ? undefined : getNicknameSortCompare();
  const groups = getNicknameRealNameGroups(filtered, compare);
  const sortedGroups = isDefaultSort
    ? groups.sort((a, b) => b.totalXp - a.totalXp)
    : groups.sort((a, b) => compare(a.topNickname, b.topNickname));
  return sortedGroups.map(g => `
    <div class="nickname-group">
      <div class="nickname-group-header">
        <span class="nickname-group-title">${escapeHtml(g.name.toUpperCase())}</span>
        <span class="count-chip">${g.count}</span>
        <div class="nickname-group-line"></div>
      </div>
      <div class="grid cols-wide-lg">
        ${g.nicknames.map(n => renderNicknameCard(n)).join('')}
      </div>
    </div>
  `).join('');
}

function getNicknameLevelInfo(xp){
  const idx = NICKNAME_LEVELS.findIndex(l => xp >= l.min && xp <= l.max);
  const level = NICKNAME_LEVELS[idx === -1 ? NICKNAME_LEVELS.length - 1 : idx];
  const next = NICKNAME_LEVELS[NICKNAME_LEVELS.indexOf(level) + 1] || null;
  if (!next){
    return { level, next: null, progressPct: 100, xpToNext: 0 };
  }
  const span = next.min - level.min;
  const progressed = xp - level.min;
  const progressPct = Math.max(0, Math.min(100, Math.round((progressed / span) * 100)));
  return { level, next, progressPct, xpToNext: next.min - xp };
}

function formatDateTime(iso){

function getStartOfWeekISO(){
  const now = new Date();
  const day = now.getDay(); // 0 = zondag
  const diffToMonday = day === 0 ? 6 : day - 1;
  const monday = new Date(now);
  monday.setDate(now.getDate() - diffToMonday);
  return monday.toISOString().slice(0, 10);
}

    s.entries.filter(e => e.beerId === beerId).forEach(e => entries.push({ ...e, sessionId: s.id, sessionDate: s.date }));
  });
  APP_DATA.standaloneBeerEntries.filter(e => e.beerId === beerId).forEach(e => entries.push({ ...e, sessionId: null }));

/* Hoogste score = hoogste gemiddelde score die iemand aan dit bier gaf. */
function getBeerHighestScorer(beerId){

/* Stem casten/verplaatsen/intrekken: klik nogmaals op dezelfde persoon
   om de stem in te trekken; klik op iemand anders om de stem te
   verplaatsen (max 1 stem per gebruiker per sessie, nooit op jezelf). */
async function castPerfectPourVote(sessionId, toUserId){
  const session = APP_DATA.beerSessions.find(s => s.id === sessionId);
  if (!session) return;
  const fromUserId = STATE.activeUser;
  if (fromUserId === toUserId) return; // niet op jezelf stemmen
  if (!session.participantIds.includes(fromUserId) || !session.participantIds.includes(toUserId)) return;

  const existing = session.perfectPourVotes.find(v => v.fromUserId === fromUserId);
  if (existing && existing.toUserId === toUserId){
    await sb.from('perfect_pours').delete().eq('id', existing.id);
  } else {
    // delete-then-insert (not update) so the XP trigger fires correctly for the new recipient
    if (existing) await sb.from('perfect_pours').delete().eq('id', existing.id);
    await sb.from('perfect_pours').insert({ session_id: sessionId, given_by_user_id: fromUserId, received_by_user_id: toUserId });
  }
  await refreshAppData();
  renderPage();
}

/* Aantal beoordelingen (= score-registraties) die userId gaf. */
function getBeerRatingsGivenCount(userId){
  return getAllBeerEntries().filter(e => e.userId === userId && typeof e.score === 'number').length;
}

/* Aantal verschillende bieren die userId ooit probeerde. */
function getBeerUniqueTriedCount(userId){
  return new Set(getAllBeerEntries().filter(e => e.userId === userId).map(e => e.beerId)).size;
}

/* Meest herhaalde bier van userId: hoogste cumulatieve hoeveelheid
   van precies 1 bier, over alle sessies heen ("Most Loyal Drinker"). */
function getUserBeerLoyalty(userId){
  const totals = {};
  getAllBeerEntries().filter(e => e.userId === userId).forEach(e => {
    totals[e.beerId] = (totals[e.beerId] || 0) + (e.quantity || 0);
  });
  let best = null;
  Object.entries(totals).forEach(([beerId, qty]) => {
    if (!best || qty > best.qty) best = { beerId, qty };
  });
  if (!best) return null;
  const beer = APP_DATA.beers.find(b => b.id === best.beerId);
  return beer ? { beer, quantity: best.qty } : null;
}

/* Favoriete bier van userId: hoogste gemiddelde score die die
   gebruiker aan een bier gaf (tie-break: meest gedronken). */
function getUserFavoriteBeer(userId){
  const entries = getAllBeerEntries().filter(e => e.userId === userId && typeof e.score === 'number');
  if (!entries.length) return null;
  const byBeer = {};
  entries.forEach(e => {
    byBeer[e.beerId] = byBeer[e.beerId] || { scores: [], qty: 0 };
    byBeer[e.beerId].scores.push(e.score);
    byBeer[e.beerId].qty += (e.quantity || 0);
  });
  let best = null;
  Object.entries(byBeer).forEach(([beerId, v]) => {
    const avg = Math.round((v.scores.reduce((s, x) => s + x, 0) / v.scores.length) * 10) / 10;
    if (!best || avg > best.avg || (avg === best.avg && v.qty > best.qty)) {
      best = { beerId, avg, qty: v.qty };
    }
  });
  const beer = APP_DATA.beers.find(b => b.id === best.beerId);
  return beer ? { beer, avgScore: best.avg, quantity: best.qty } : null;
}

/* Bier met de hoogste ('high') of laagste ('low') gemiddelde score
   over alle drinkers heen (enkel bieren met minstens 1 score). */
function getExtremeRatedBeer(direction){
  let best = null;
  APP_DATA.beers.forEach(b => {
    const avg = getBeerAverageScore(b.id);
    if (avg === null) return;
    if (!best || (direction === 'high' ? avg > best.avg : avg < best.avg)) best = { beer: b, avg };
  });
  return best;
}

/* Bier met de hoogste totale gedronken hoeveelheid ("Most Consumed Beer"). */
function getMostConsumedBeer(){
  let best = null;
  APP_DATA.beers.forEach(b => {
    const qty = getBeerTotalQuantity(b.id);
    if (qty <= 0) return;
    if (!best || qty > best.qty) best = { beer: b, qty };
  });
  return best;
}

/* Per-user gemiddelde score voor één bier -- voor de uitgebreide beer

function getBeerRatingsPerUser(beerId){

    (scoresByUser[e.userId] = scoresByUser[e.userId] || []).push(e.score);

/* ---- Last Call: puur client-side afgeleide, reverse-chronologische
   mix van recente beer-activiteit. Zelfde filosofie als
   getRecentBattleActivity() (nergens een echte activity feed-tabel --
   dit is een "spotlight"-lijst, geen opgeslagen feed). Geen fake
   events: een categorie zonder recente data levert gewoon niets. ---- */
function getTaproomLastCallItems(limit = 7){
  const items = [];

  getAllBeerEntries().forEach(e => {
    const beer = APP_DATA.beers.find(b => b.id === e.beerId);
    const user = findUser(e.userId);
    if (!beer || !user || !e.sessionDate) return;
    if (typeof e.score === 'number'){
      items.push({ at: e.sessionDate, icon: '🍺', text: `${user.displayName} rated ${beer.name} ${e.score}/10` });
    }
    if (e.firstTime){
      items.push({ at: e.sessionDate, icon: '⭐', text: `${user.displayName} tried ${beer.name} for the first time` });
    }
  });

  APP_DATA.beerSessions.forEach(s => {
    const totalPours = s.perfectPourVotes.length;
    if (totalPours){
      const byUser = {};
      s.perfectPourVotes.forEach(v => { byUser[v.toUserId] = (byUser[v.toUserId] || 0) + 1; });
      Object.entries(byUser).forEach(([userId, count]) => {
        const user = findUser(userId);
        if (!user) return;
        const total = getTotalPerfectPoursReceived(userId);
        items.push({ at: s.date, icon: '🏆', text: `${user.displayName} achieved their ${ordinal(total)} Perfect Pour` });
      });
    }
    if (s.date && s.location){
      items.push({ at: s.date, icon: '🍻', text: `Beer Session completed at ${s.location}` });
    }
  });

  return items
    .filter(i => i.at)
    .sort((a, b) => String(b.at).localeCompare(String(a.at)))
    .slice(0, limit);
}

function ordinal(n){
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/* Grappige, datagedreven opmerkingen — enkel getoond als het patroon
   er echt is. Elke functie geeft null (niets te melden) of een tekst. */
function getSuspiciousQuotes(){
  const pairs = {};
  getAllBeerEntries().forEach(e => {
    if (typeof e.score !== 'number') return;
    const key = `${e.userId}__${e.beerId}`;
    pairs[key] = pairs[key] || { userId: e.userId, beerId: e.beerId, scores: [], qty: 0 };
    pairs[key].scores.push(e.score);
    pairs[key].qty += (e.quantity || 0);
  });
  const quotes = [];
  Object.values(pairs).forEach(p => {
    const avg = Math.round((p.scores.reduce((s, v) => s + v, 0) / p.scores.length) * 10) / 10;
    if (avg <= 7 && p.qty >= 8){
      const beer = APP_DATA.beers.find(b => b.id === p.beerId);
      if (!beer) return;
      quotes.push(`${resolveUserLabel(p.userId)} geeft ${escapeHtml(beer.name)} ${avg}/10 maar heeft er al ${p.qty}× van gedronken. Suspicious. 🕵️`);
    }
  });
  return quotes;
}

function getBeerSnobNote(rows){
  if (rows.length < 2) return null;
  const mildest = rows[rows.length - 1];
  const snob = rows[0];
  if (snob.value === null || mildest.value === null) return null;
  const diff = Math.round((mildest.value - snob.value) * 10) / 10;
  if (diff < 2) return null;
  return `${escapeHtml(snob.user.displayName)} ligt duidelijk moeilijker te plezieren dan de rest — ${diff} punten strenger dan de mildste beoordelaar.`;
}

function getEasyDrinkerNote(rows){
  if (!rows.length || rows[0].value === null) return null;
  if (rows[0].value < 8.5) return null;
  return `${escapeHtml(rows[0].user.displayName)} geeft bijna alles een dikke voldoende.`;
}

function getNeverAgainNote(entry){
  if (!entry || entry.avg > 5) return null;
  return `Wordt hier duidelijk niet snel nog eens besteld.`;
}

function getCrowdFavouriteNote(entry){
  if (!entry || entry.avg < 8.5) return null;
  return `Unaniem enthousiasme in de Beer Club! 🎉`;
}

function getMostLoyalNote(rows){

  return `Bijna een abonnement op ${escapeHtml(rows[0].loyalty.beer.name)}.`;

function getMostConsumedNote(best){
  if (!best) return null;
  const others = APP_DATA.beers.filter(b => b.id !== best.beer.id).map(b => getBeerTotalQuantity(b.id));
  const secondBest = others.length ? Math.max(...others) : 0;
  if (secondBest === 0 || best.qty < secondBest * 2) return null;
  return `Torenhoog boven de rest van de Beer Database.`;
}

/* ---------- BEER XP: los systeem, gekoppeld aan de 3 vaste
   gebruikers (niet aan Lore XP/Lore Score). Alles hier wordt puur
   berekend uit APP_DATA.beers/beerSessions — geen losse teller. ---------- */
const BEER_XP_RULES = {
  perDrink: 1,          // elk gedronken bier (× aantal)
  newBeerTried: 3,       // een nieuw/uniek bier proberen (firstTime)
  ratingGiven: 2,        // een rating/review geven (elke registratie heeft een score)
  ownBeerAdopted: 5,      // eigen toegevoegd bier dat door >=2 gebruikers geprobeerd wordt
  perfectPour: 3,         // elke ontvangen Perfect Pour-stem (zie getTotalPerfectPoursReceived)
};

const BEER_LEVELS = [
  { min: 0,   max: 19,       label: 'The Novice',       icon: '🌰' },
  { min: 20,  max: 49,       label: 'Brother of Beer',  icon: '🍺' },
  { min: 50,  max: 99,       label: 'Abbey Disciple',   icon: '⛪' },
  { min: 100, max: 199,      label: 'Beer Monk',        icon: '🧎' },
  { min: 200, max: 349,      label: 'Grand Brewer',     icon: '🍻' },
  { min: 350, max: 499,      label: 'Abt Master',       icon: '🎖️' },
  { min: 500, max: Infinity, label: 'Abt Elite',        icon: '👑' },
];

function getBeerLevelInfo(xp){
  const idx = BEER_LEVELS.findIndex(l => xp >= l.min && xp <= l.max);
  const level = BEER_LEVELS[idx === -1 ? BEER_LEVELS.length - 1 : idx];
  const next = BEER_LEVELS[BEER_LEVELS.indexOf(level) + 1] || null;
  if (!next) return { level, next: null, progressPct: 100, xpToNext: 0 };
  const span = next.min - level.min;
  const progressPct = Math.max(0, Math.min(100, Math.round(((xp - level.min) / span) * 100)));
  return { level, next, progressPct, xpToNext: next.min - xp };
}

function computeBeerXp(userId){
  let xp = 0;
  getAllBeerEntries().forEach(e => {
    if (e.userId !== userId) return;
    xp += (e.quantity || 0) * BEER_XP_RULES.perDrink;
    if (e.firstTime) xp += BEER_XP_RULES.newBeerTried;
    if (typeof e.score === 'number' && e.score > 0) xp += BEER_XP_RULES.ratingGiven;
  });
  xp += getTotalPerfectPoursReceived(userId) * BEER_XP_RULES.perfectPour;
  APP_DATA.beers.forEach(b => {
    if (b.addedBy !== userId) return;
    const drinkers = new Set(getBeerEntries(b.id).map(e => e.userId));
    if (drinkers.size >= 2) xp += BEER_XP_RULES.ownBeerAdopted;
  });
  return xp;
}

function getBeerUserStats(userId){
  const entries = getAllBeerEntries().filter(e => e.userId === userId);
  const totalQuantity = entries.reduce((sum, e) => sum + (e.quantity || 0), 0);
  const uniqueBeers = new Set(entries.map(e => e.beerId)).size;
  const scored = entries.filter(e => typeof e.score === 'number');
  const avgRating = scored.length ? Math.round((scored.reduce((s, e) => s + e.score, 0) / scored.length) * 10) / 10 : null;
  const perfectPours = getTotalPerfectPoursReceived(userId);
  return { totalQuantity, uniqueBeers, avgRating, perfectPours };
}

/* ---------- THE ABT DYNASTY: persisted reign history ----------
   Who The Abt Lord is (and every reign before them) is decided
   entirely server-side — see supabase/0004_abt_dynasty.sql,
   trg_check_abt_throne, which is the ONLY thing that ever writes to
   abt_reigns. The client only ever reads APP_DATA.abtReigns and
   derives everything below from it, same philosophy as
   computeBeerXp/computeLoreScore elsewhere in this file. */
const ABT_LORD_STATE = {
  currentLordId: null,
  fallenAbtId: null,
};

const FALLEN_ABT_WINDOW_DAYS = 7;

function refreshAbtLordState(){
  const current = APP_DATA.abtReigns.find(r => !r.endedAt);
  ABT_LORD_STATE.currentLordId = current ? current.userId : null;

  const endedReigns = [...APP_DATA.abtReigns].filter(r => r.endedAt).sort((a, b) => b.endedAt.localeCompare(a.endedAt));
  const mostRecentEnded = endedReigns[0];
  const daysSinceEnded = mostRecentEnded ? (Date.now() - new Date(mostRecentEnded.endedAt).getTime()) / 86400000 : Infinity;
  ABT_LORD_STATE.fallenAbtId = (mostRecentEnded && daysSinceEnded < FALLEN_ABT_WINDOW_DAYS && mostRecentEnded.userId !== ABT_LORD_STATE.currentLordId)
    ? mostRecentEnded.userId
    : null;
}

function getUserReignHistory(userId){
  return APP_DATA.abtReigns.filter(r => r.userId === userId).sort((a, b) => a.startedAt.localeCompare(b.startedAt));
}

function getAllReignsSorted(){
  return [...APP_DATA.abtReigns].sort((a, b) => a.startedAt.localeCompare(b.startedAt));
}

function getReignDays(reign){
  const end = reign.endedAt ? new Date(reign.endedAt) : new Date();
  const start = new Date(reign.startedAt);
  return Math.max(0, Math.floor((end - start) / 86400000));
}

function getLongestReignEver(userId){
  return getUserReignHistory(userId).reduce((max, r) => Math.max(max, getReignDays(r)), 0);
}

function getTotalDaysInPower(userId){
  return getUserReignHistory(userId).reduce((sum, r) => sum + getReignDays(r), 0);
}

function getThroneCaptureCount(userId){
  return getUserReignHistory(userId).length;
}

function getTimesDethroned(userId){
  return APP_DATA.abtReigns.filter(r => r.userId === userId && r.dethronedByUserId).length;
}

function getTimesDethronedOthers(userId){
  return APP_DATA.abtReigns.filter(r => r.dethronedByUserId === userId).length;
}

/* "The Sacred Records" — one titleholder per category, fully dynamic.
   null if nobody has ever held the throne yet. */
function getAbtRecords(){
  if (!APP_DATA.abtReigns.length) return null;
  const topBy = (fn) => APP_DATA.users
    .map(u => ({ user: u, value: fn(u.id) }))
    .sort((a, b) => b.value - a.value)[0];

  return {
    longestReign: topBy(getLongestReignEver),
    mostTotalDays: topBy(getTotalDaysInPower),
    mostCaptures: topBy(getThroneCaptureCount),
    mostSlaying: topBy(getTimesDethronedOthers),
    mostDethroned: topBy(getTimesDethroned),
  };
}

/* =============================================================
   LEADERBOARDS — automatisch berekend uit de bestaande data.
   -------------------------------------------------------------
   Geen eigen opgeslagen state: elk klassement wordt live opnieuw
   berekend uit APP_DATA (Users, Nicknames, Quotes, Anecdotes,
   Counters) telkens als de pagina rendert. LEADERBOARD_DEFS is de
   ene plek om een klassement toe te voegen/aan te passen — zowel de
   Leaderboards-pagina als de compacte Top 3 op Home lezen hieruit.
   ============================================================= */

/* ---- generieke ranking-helpers ---- */
function rankUsersBy(metricFn, opts = {}){
  return APP_DATA.users
    .map(u => ({ user: u, value: metricFn(u) }))
    .filter(e => opts.includeZero || e.value > 0)
    .sort((a, b) => b.value - a.value);
}

function rankNicknamesBy(metricFn, opts = {}){
  return APP_DATA.nicknames
    .map(n => ({ nickname: n, value: metricFn(n) }))
    .filter(e => opts.includeZero || e.value > 0)
    .sort((a, b) => b.value - a.value);
}

function daysSince(dateStr){
  const then = new Date(`${dateStr}T00:00:00`);
  const now = new Date();
  return Math.max(0, Math.floor((now - then) / (1000 * 60 * 60 * 24)));
}

/* XP per dag sinds aanmaak = hoe snel een nickname XP opbouwt. */
function nicknameXpPerDay(n){
  const days = Math.max(1, daysSince(n.createdAt));
  return Math.round((n.xp / days) * 10) / 10;
}

/* XP verdiend binnen de huidige kalendermaand (aanmaak-bonus telt
   mee als de nickname deze maand is ontstaan). */
function nicknameMonthlyXp(n){
  const monthPrefix = todayISO().slice(0, 7);
  let total = n.createdAt.slice(0, 7) === monthPrefix ? 10 : 0;
  n.usageLog.forEach(u => { if (u.date.slice(0, 7) === monthPrefix) total += u.xp; });
  return total;
}

/* ---- entries omzetten naar het generieke podium-formaat ----
   "personRef" wordt bewaard (i.p.v. al gerenderde avatar-HTML) zodat
   het podium en de ranglijst eronder elk hun eigen avatargrootte
   kunnen renderen via entryAvatarHtml(). Users dragen hun eigen
   avatar/displayName al rechtstreeks, dus personRef is gewoon de
   user zelf — geen apart adapter-object meer nodig. Als er geen
   subtitle wordt meegegeven, valt dit terug op de businessUnit
   (zelfde gedrag als vroeger op de People-gebaseerde boards). */
function userEntry(user, value, formatValue, subtitle){
  return {
    personRef: user,
    title: user.displayName,
    subtitle: subtitle !== undefined ? subtitle : user.businessUnit,
    value: formatValue(value),
    onClick: `goToUserLore('${user.id}')`,
  };
}

function nicknameEntry(nickname, value, formatValue){
  const name = nickname.personRealName || 'onbekend';
  return {
    personRef: null,
    title: nickname.text,
    subtitle: name,
    value: formatValue(value),
    onClick: nickname.personRealName ? `goToNicknamesFilteredByName('${escapeJs(nickname.personRealName)}')` : '',
  };
}

function entryAvatarHtml(entry, size){
  if (entry.personRef) return avatarHtml(entry.personRef, size);
  return `<div class="avatar-emoji" style="width:${size}px;height:${size}px;background:var(--mint);font-size:${Math.round(size * 0.4)}px">🏷️</div>`;
}

                <span class="stat-chip">🍺 ${latestSession.beerIds.map(bid => {

      const top3LoreSection = `

      const beerXpTop3 = APP_DATA.users.map(u => ({ user: u, value: computeBeerXp(u.id) })).sort((a, b) => b.value - a.value).slice(0, 3);
      const top3BeerXpSection = `
        <section class="section">
          <div class="section-head">
            <h3>🍻 Top 3 · Beer XP</h3>
            <button type="button" class="btn btn-ghost btn-sm" onclick="goToBeerLeaderboards()">Alle Beer Leaderboards →</button>
          </div>
          ${renderPodium(beerXpTop3.map(r => userEntry(r.user, r.value, v => `${v} XP`)), { compact: true, restLimit: 0 })}

      `;

      const activeCountersSection = `
        <section class="section">
          <div class="section-head">
            <h3>🔢 Active Counters</h3>
            <span class="count-chip">${data.counters.length}</span>
          </div>
          ${data.counters.length ? `
            <div class="grid cols-auto">
              ${data.counters.map(c => `
                <div class="sticker-card counter-card clickable" onclick="goToPage('counters')">

                  <div>
                    <div class="num">${c.total}</div>
                    <div class="label">${escapeHtml(c.name)}</div>

      const potmHome = getPoemOfTheMonth();
      const newestPoem = [...data.poems].sort((a, b) => b.createdAt.localeCompare(a.createdAt))[0];
      const homeLaureate = POET_LAUREATE_STATE.currentLaureateId ? findUser(POET_LAUREATE_STATE.currentLaureateId) : null;
      const poetryWallSection = `
        <section class="section">
          <div class="section-head">
            <h3>✒️ From the Poetry Wall</h3>
            <button type="button" class="btn btn-ghost btn-sm" onclick="goToPage('poetrywall')">Visit Poetry Wall →</button>

          ${data.poems.length ? `
            <div class="row-list">
              ${potmHome ? `
                <div class="row-item" style="cursor:pointer;" onclick="goToPage('poetrywall')">
                  <div class="avatar-emoji" style="width:34px;height:34px;background:var(--yellow);font-size:16px;">🏆</div>
                  <div class="info">
                    <div class="name">Poem of the Month: ${escapeHtml(potmHome.title)}</div>
                    <div class="sub">door ${resolveUserLabel(potmHome.authorUserId)}</div>
                  </div>
                </div>
              ` : ''}
              ${newestPoem ? `
                <div class="row-item" style="cursor:pointer;" onclick="POETRY_STATE.view='poemDetail'; POETRY_STATE.poemDetailId='${newestPoem.id}'; goToPage('poetrywall');">
                  <div class="avatar-emoji" style="width:34px;height:34px;background:var(--sky);font-size:16px;">📜</div>
                  <div class="info">
                    <div class="name">Newest: ${escapeHtml(newestPoem.title)}</div>
                    <div class="sub">door ${resolveUserLabel(newestPoem.authorUserId)}</div>

              ${homeLaureate ? `
                <div class="row-item" style="cursor:pointer;" onclick="goToPage('poetrywall')">
                  <div class="avatar-emoji" style="width:34px;height:34px;background:var(--lilac);font-size:16px;">🪶</div>
                  <div class="info">
                    <div class="name">Current Poet Laureate: ${escapeHtml(homeLaureate.displayName)}</div>
                    <div class="sub">${computePoemXp(homeLaureate.id)} Poetry XP</div>

        </section>
      `;

      const nextTerraceEvent = getUpcomingTerraceEvents().filter(e => e.status !== 'cancelled')[0] || null;
      const nextTerraceSection = `
        <section class="section">
          <div class="section-head">
            <h3>🍻 Next Terrace</h3>
            <button type="button" class="btn btn-ghost btn-sm" onclick="goToPage('terrace')">Visit Terrace →</button>
          </div>
          ${nextTerraceEvent ? `
            <div class="sticker-card terrace-card clickable" onclick="openTerraceEventDetail('${nextTerraceEvent.id}')">
              ${renderTerraceHomeCardBody(nextTerraceEvent)}
            </div>
          ` : `
            <div class="empty-state">
              No drinks planned. This seems irresponsible.
              <div style="margin-top:10px;"><button type="button" class="btn btn-primary btn-sm" onclick="openTerraceEventForm('add')">+ Plan Something</button></div>
            </div>
          `}
        </section>
      `;

      return headerSection + nicknameWallSection + todayAtOfficeSection + quoteOfTheWeekSection
        + nicknameOfTheMonthSection + abtLordSection + latestBeerSessionSection
        + top3LoreSection + top3BeerXpSection + activeCountersSection + poetryWallSection + nextTerraceSection;
    }
  },

  /* Niet in NAV_ITEMS (geen navigatietab) — enkel bereikbaar via het
     profielmenu rechtsboven ("My Profile"). */
  myprofile: {
    title: 'My Profile',
    subtitle: 'Enkel jij kan je eigen profiel bewerken.',
    emoji: '🙋',
    render(data){
      return renderMyProfilePage(data);
    }
  },

  /* Niet in NAV_ITEMS — bereikbaar via de Nickname Wall, leaderboards
     of nickname/quote/anekdote-kaarten ("X's Lore"). */
  userLore: {
    title: 'Lore Profiel',
    subtitle: 'Alle lore en statistieken over deze user.',
    emoji: '📖',
    render(data){
      return renderUserLorePage(data);
    }
  },

  nicknames: {
    title: 'Nicknames',
    subtitle: 'XP, levels, stemmen, gebruiksmomenten en battles — gegroepeerd per collega, puur visueel.',
    render(data){
      const pageTabsHtml = `
        <div class="people-toolbar" style="margin-bottom:16px;">
          <button type="button" class="nav-btn ${NICKNAME_PAGE_STATE.tab === 'nicknames' ? 'active' : ''}" onclick="switchNicknamePageTab('nicknames')">🏷️ Nicknames</button>
          <button type="button" class="nav-btn ${NICKNAME_PAGE_STATE.tab === 'battles' ? 'active' : ''}" onclick="switchNicknamePageTab('battles')">⚔️ Battles</button>

      return pageTabsHtml + `
        <section class="section">
          <div class="section-head">
            <h3>🏷️ Alle nicknames</h3>
            <div class="people-toolbar">
              <span class="count-chip">${data.nicknames.length}</span>
              <button type="button" class="btn btn-primary" onclick="openNicknameForm('add')">+ Nieuwe nickname</button>

          <div id="nicknames-view-switcher-mount">${renderNicknamesViewSwitcherHtml()}</div>

          <div class="nickname-filter-bar">
            <div class="form-field search-field">
              <label class="form-label" for="nk-search">🔎 Zoeken</label>
              <input class="form-input" id="nk-search" type="text" placeholder="Nickname, echte naam of business unit..." value="${escapeHtml(NICKNAME_FILTER_STATE.search)}" oninput="updateNicknameSearch(this.value)">
            </div>
            <div class="form-field">
              <label class="form-label" for="nk-filter-bu">Business Unit</label>
              <select class="form-input" id="nk-filter-bu" onchange="updateNicknameFilter('businessUnit', this.value)">
                <option value="">Alle</option>
                ${businessUnits.map(b => `<option value="${escapeHtml(b)}" ${NICKNAME_FILTER_STATE.businessUnit === b ? 'selected' : ''}>${escapeHtml(b)}</option>`).join('')}
              </select>
            </div>
            <div class="form-field">
              <label class="form-label" for="nk-filter-by">Toegevoegd door</label>
              <select class="form-input" id="nk-filter-by" onchange="updateNicknameFilter('createdBy', this.value)">
                <option value="">Iedereen</option>
                ${APP_DATA.users.map(u => `<option value="${u.id}" ${NICKNAME_FILTER_STATE.createdBy === u.id ? 'selected' : ''}>${escapeHtml(u.displayName)}</option>`).join('')}
              </select>
            </div>
            <div class="form-field">
              <label class="form-label" for="nk-filter-level">Nickname level</label>
              <select class="form-input" id="nk-filter-level" onchange="updateNicknameFilter('level', this.value)">
                <option value="">Alle levels</option>
                ${NICKNAME_LEVELS.map(l => `<option value="${escapeHtml(l.label)}" ${NICKNAME_FILTER_STATE.level === l.label ? 'selected' : ''}>${l.icon} ${l.label}</option>`).join('')}
              </select>
            </div>
            <div class="form-field">
              <label class="form-label" for="nk-sort">Sorteren</label>
              <select class="form-input" id="nk-sort" onchange="updateNicknameSort(this.value)">
                ${NICKNAME_SORT_DEFS.map(d => `<option value="${d.id}" ${NICKNAME_SORT_STATE.sortBy === d.id ? 'selected' : ''}>${escapeHtml(d.label)}</option>`).join('')}
              </select>
            </div>
            ${filtersActive ? `<button type="button" class="btn btn-ghost btn-sm" onclick="clearNicknameFilters()">✕ Filters wissen</button>` : ''}
          </div>

          <div id="nicknames-results-mount">${renderNicknamesResultsHtml()}</div>
        </section>
      `;
    }
  },

  lore: {
    title: 'Lore',
    subtitle: 'Quotes en anekdotes — samen de kantoorgeschiedenis.',
    render(data){
      const allItems = getAllLoreItems().sort((a, b) => b.date.localeCompare(a.date));
      return `
        <section class="section">
          <div class="section-head">
            <h3>📖 Alle Lore</h3>
            <div class="people-toolbar">
              <span class="count-chip">${allItems.length}</span>
              <button type="button" class="btn btn-primary" onclick="openLoreForm('add','quote')">+ Lore</button>
            </div>
          </div>
          ${allItems.length
            ? `<div class="grid cols-wide-lg">${allItems.map(item => renderLoreCard(item, item.kind)).join('')}</div>`
            : emptyState('Nog geen lore. Klik op "+ Lore" om te beginnen.')}
        </section>
      `;
    }
  },

  counters: {
    title: 'Counters',
    subtitle: 'Terugkerende dingen die iemand doet — met volledige historiek.',
    render(data){
      if (COUNTER_STATE.view === 'history') return renderCounterHistoryPage(data);
      return renderCountersList(data);
    }
  },

  beerclub: {
    title: 'The Taproom',
    subtitle: 'Probably conducting important research.',
    render(data){
      if (BEER_STATE.view === 'beerDetail') return renderBeerDetailPage(data);
      if (BEER_STATE.view === 'sessionForm') return renderSessionFormPage(data);
      if (BEER_STATE.view === 'sessionDetail') return renderSessionDetailPage(data);

      const navHtml = renderTaproomNavHtml();
      let body;
      if (BEER_STATE.view === 'sessions') body = renderBeerSessionsList(data);
      else if (BEER_STATE.view === 'leaderboards') body = renderBeerLeaderboardsPage(data);
      else if (BEER_STATE.view === 'database') body = renderBeerDatabase(data);
      else body = renderTaproomPage(data); // 'taproom' -- de nieuwe standaard landingspagina

      const xpOverview = BEER_STATE.view === 'taproom' ? '' : renderBeerXpOverview();
      return `<div class="taproom-page">${navHtml}${xpOverview}${body}</div>`;
    }
  },

  poetrywall: {
    title: 'Poetry Wall',
    subtitle: 'Waar collega\'s plots ook dichters bleken te zijn.',
    emoji: '✒️',
    render(data){
      if (POETRY_STATE.view === 'poemDetail') return renderPoemDetailPage(data);
      return renderPoetryWallPage(data);
    }
  },

  terrace: {
    title: 'Terrace Planner',
    subtitle: 'Important meetings, questionable agendas.',
    emoji: '🍻',
    render(data){
      if (TERRACE_STATE.view === 'eventForm') return renderTerraceEventFormPage(data);
      if (TERRACE_STATE.view === 'eventDetail') return renderTerraceEventDetailPage(data);
      if (TERRACE_STATE.view === 'locations') return renderTerraceLocationsPage(data);
      return renderTerracePage(data);
    }
  },

  leaderboards: {
    title: 'Leaderboards',
    subtitle: 'Automatisch berekende klassementen op basis van alle Office Lore-data.',
    render(data){
      const loreBoards = LEADERBOARD_DEFS.map(def => `
        <section class="section">
          <div class="section-head"><h3>${def.icon} ${def.title}</h3></div>
          ${renderPodium(def.build(), { crown: !!def.crown })}
        </section>
      `).join('');

      /* De bier-klassementen (Abt Lord, Beer King/Queen, Master of the
         Pour en meer) leven sinds de uitgebreide Beer Leaderboards
         allemaal samen op de Beer Club-pagina, ipv. hier verspreid te
         staan — vandaar deze doorverwijzing i.p.v. dubbele borden. */
      const beerPointer = `
        <section class="section">
          <div class="sticker-card" style="text-align:center; padding:26px 18px;">
            <div style="font-size:34px;">🍺🏆</div>
            <h3 style="margin:8px 0 4px;">Beer Leaderboards</h3>
            <p style="font-size:13px; color:#6b5c4d; max-width:440px; margin:0 auto 14px;">
              The Abt Lord, Beer King/Queen, Beer Explorer, Master of the Pour en nog 8 andere bier-klassementen wonen samen op de Beer Club-pagina.
            </p>
            <button type="button" class="btn btn-primary" onclick="goToBeerLeaderboards()">🍺 Bekijk Beer Leaderboards</button>
          </div>
        </section>
      `;

      /* Zelfde doorverwijzing als bij Beer: de Poetry-klassementen
         (Poet Laureate, Most Published, Actually Good, ...) wonen op
         de Poetry Wall zelf, niet dubbel hier. */
      const poetryPointer = `
        <section class="section">
          <div class="sticker-card" style="text-align:center; padding:26px 18px;">
            <div style="font-size:34px;">✒️🏆</div>
            <h3 style="margin:8px 0 4px;">Poetry Leaderboard</h3>
            <p style="font-size:13px; color:#6b5c4d; max-width:440px; margin:0 auto 14px;">
              The Poet Laureate, Most Published, Actually Good en nog meer klassementen wonen samen op de Poetry Wall.
            </p>
            <button type="button" class="btn btn-primary" onclick="goToPage('poetrywall')">✒️ Bekijk Poetry Wall</button>
          </div>
        </section>
      `;

      return loreBoards + beerPointer + poetryPointer;
    }
  },
};

/* =============================================================
   USER LORE-PAGINA + MY PROFILE — render helpers + event handlers
   -------------------------------------------------------------
   Er is geen aparte People-entiteit meer: de 3 vaste users ZIJN de
   personen. "Lore Profiel" (renderUserLorePage) is de publieke,
   read-only statistiekenpagina van één user (bv. "Atti's Lore"),
   bereikbaar via de Nickname Wall en de leaderboards. "My Profile"
   is de plek waar de ACTIEVE user enkel zijn/haar eigen gegevens
   bewerkt — er is geen manier om iemand anders' profiel te bewerken
   of om nieuwe/andere users toe te voegen of te verwijderen.
   ============================================================= */

/* ---- publieke lore-pagina van één user, bv. "Atti's Lore" ---- */
function renderUserLorePage(data){
  const user = findUser(USER_STATE.loreUserId);
  if (!user){
    return `<section class="section">${emptyState('Deze user bestaat niet.')}<div style="margin-top:14px;"><button type="button" class="btn btn-secondary" onclick="goToPage('home')">← Terug naar Home</button></div></section>`;
  }

  const loreScore = computeLoreScore(user);
  const beerXp = computeBeerXp(user.id);
  const loreRank = rankUsersBy(u => computeLoreScore(u), { includeZero: true }).findIndex(e => e.user.id === user.id) + 1;
  const beerRank = rankUsersBy(u => computeBeerXp(u.id), { includeZero: true }).findIndex(e => e.user.id === user.id) + 1;
  const beerLevel = getBeerLevelInfo(beerXp).level;
  const beerStats = getBeerUserStats(user.id);

  const isAbtLord = ABT_LORD_STATE.currentLordId === user.id;
  const isFallenAbt = !isAbtLord && ABT_LORD_STATE.fallenAbtId === user.id;
  const pourRows = getMasterOfThePourRows();
  const isMasterOfPour = pourRows[0] && pourRows[0].total > 0 && pourRows[0].user.id === user.id;
  const isPoetLaureate = POET_LAUREATE_STATE.currentLaureateId === user.id;
  const awards = [];
  if (isAbtLord) awards.push({ icon: '👑', label: 'The Abt Lord' });
  if (isFallenAbt) awards.push({ icon: '💀', label: 'The Fallen Abt' });
  if (isMasterOfPour) awards.push({ icon: '🏆', label: 'Master of the Pour' });
  if (isPoetLaureate) awards.push({ icon: '🪶', label: 'The Poet Laureate' });

  const poemXp = computePoemXp(user.id);
  const poemLevel = getPoemLevelInfo(poemXp).level;
  const userPoems = data.poems.filter(p => p.authorUserId === user.id);
  const totalReactionsReceived = POEM_REACTION_TYPES.reduce((sum, r) => sum + countReceivedReactions(user.id, r.id), 0);
  const mostReceivedReaction = getMostReceivedReaction(user.id);
  const timesPoemOfTheMonth = userPoems.filter(p => getPoemOfTheMonth()?.id === p.id).length;

  return `
    <section class="section">
      <button type="button" class="btn btn-ghost btn-sm" onclick="goToPage('home')">← Terug naar Home</button>
      <div class="detail-header">
        ${avatarHtml(user, 90)}
        <div>
          <h2 style="font-size:24px;">${escapeHtml(user.displayName)}'s Lore</h2>
          ${user.profileNickname ? `<div class="detail-subline">"${escapeHtml(user.profileNickname)}"</div>` : ''}
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;">
            ${user.businessUnit ? `<span class="badge lilac">${escapeHtml(user.businessUnit)}</span>` : ''}
            ${user.jobTitle ? `<span class="badge sky">${escapeHtml(user.jobTitle)}</span>` : ''}
          </div>
        </div>
      </div>

      ${user.bio ? `<p class="detail-desc">${escapeHtml(user.bio)}</p>` : emptyState('Nog geen bio ingesteld.')}

      ${awards.length ? `
        <div class="detail-meta-row">
          ${awards.map(a => `<span class="badge yellow">${a.icon} ${a.label}</span>`).join('')}
        </div>
      ` : ''}
    </section>

    <section class="section">
      <div class="section-head"><h3>✨ Lore Score</h3></div>
      <div class="beer-stats">
        <div class="beer-stat"><div class="num">${loreScore}</div><div class="label">Lore XP</div></div>
        <div class="beer-stat"><div class="num">#${loreRank}</div><div class="label">Lore Rank</div></div>
        <div class="beer-stat"><div class="num">${getUserNicknames(user.id).length}</div><div class="label">Nicknames</div></div>
        <div class="beer-stat"><div class="num">${getUserQuotes(user.id).length}</div><div class="label">Quotes</div></div>
        <div class="beer-stat"><div class="num">${getUserAnecdotes(user.id).length}</div><div class="label">Anekdotes</div></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h3>🍻 Beer statistieken</h3></div>
      <div class="beer-stats">
        <div class="beer-stat"><div class="num">${beerXp}</div><div class="label">Beer XP</div></div>
        <div class="beer-stat"><div class="num">#${beerRank}</div><div class="label">Beer Rank</div></div>
        <div class="beer-stat"><div class="num">${beerLevel.icon}</div><div class="label">${beerLevel.label}</div></div>
        <div class="beer-stat"><div class="num">${beerStats.totalQuantity}</div><div class="label">Bieren gedronken</div></div>
        <div class="beer-stat"><div class="num">${beerStats.avgRating !== null ? beerStats.avgRating : '—'}</div><div class="label">Gem. score</div></div>
        <div class="beer-stat"><div class="num">${beerStats.perfectPours}</div><div class="label">Perfect Pours</div></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h3>✒️ Poetry</h3></div>
      <div class="beer-stats">
        <div class="beer-stat"><div class="num">${poemXp}</div><div class="label">Poetry XP</div></div>
        <div class="beer-stat"><div class="num">${poemLevel.icon}</div><div class="label">${poemLevel.label}</div></div>
        <div class="beer-stat"><div class="num">${userPoems.length}</div><div class="label">Gedichten</div></div>
        <div class="beer-stat"><div class="num">${totalReactionsReceived}</div><div class="label">Reactions ontvangen</div></div>
        <div class="beer-stat"><div class="num">${mostReceivedReaction ? mostReceivedReaction.icon : '—'}</div><div class="label">${mostReceivedReaction ? mostReceivedReaction.label : 'Nog geen reactions'}</div></div>
        <div class="beer-stat"><div class="num">${timesPoemOfTheMonth}</div><div class="label">Poem of the Month</div></div>
      </div>
    </section>

    ${(() => {
      const challengeStats = getChallengeStats(user.id);
      if (!challengeStats.completed) return '';
      const favCat = challengeStats.favouriteCategory ? getChallengeCategoryDef(challengeStats.favouriteCategory) : null;
      return `
        <section class="section">
          <div class="section-head"><h3>🎯 Poetry Challenges</h3></div>
          <div class="beer-stats">
            <div class="beer-stat"><div class="num">${challengeStats.completed}</div><div class="label">Completed</div></div>
            <div class="beer-stat"><div class="num">${favCat ? favCat.icon : '—'}</div><div class="label">${favCat ? favCat.label : 'Nog geen favoriet'}</div></div>
            <div class="beer-stat"><div class="num">${challengeStats.reactionsReceived}</div><div class="label">Reactions op Challenges</div></div>
          </div>
          ${challengeStats.mostSuccessful ? `<p style="font-size:12.5px; color:#6b5c4d; font-weight:700; margin-top:10px;">Most successful challenge: "${escapeHtml(challengeStats.mostSuccessful.promptTextSnapshot)}"</p>` : ''}
        </section>
      `;
    })()}

    ${renderUserAbtHistorySection(user)}

    <section class="section">
      <div class="section-head">
        <h3>🕓 Recente lore</h3>
      </div>
      ${getUserRecentLore(user.id, 3).length
        ? `<div class="grid cols-auto-wide">${getUserRecentLore(user.id, 3).map(item => renderLoreCard(item, item.kind, { compact: true })).join('')}</div>`
        : emptyState('Nog geen lore voor deze user.')}
    </section>

    <section class="section">
      <div class="section-head">
        <h3>🏆 Populairste lore</h3>
      </div>
      <div class="grid cols-auto-wide">

async function submitMyProfileForm(event){
  event.preventDefault();

  const displayName = document.getElementById('mp-displayName').value.trim();
  const profileNickname = document.getElementById('mp-nickname').value.trim();
  const businessUnit = document.getElementById('mp-businessUnit').value.trim();
  const jobTitle = document.getElementById('mp-jobTitle').value.trim();
  const bio = document.getElementById('mp-bio').value.trim();
  const errorEl = document.getElementById('mp-error');

  if (!displayName){
    errorEl.textContent = 'Vul minstens een weergavenaam in.';
    return false;
  }
  errorEl.textContent = '';

  const { error } = await sb.from('profiles').update({
    display_name: displayName,
    profile_nickname: profileNickname || null,
    business_unit: businessUnit || null,
    job_title: jobTitle || null,
    bio,
    avatar_emoji: formDraft.avatarEmoji,
    accent_color: formDraft.avatarColor,
    avatar_photo: formDraft.avatarPhoto,
  }).eq('id', STATE.activeUser);

  if (error){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return false; }

  await refreshAppData();
  renderUserSwitcher(); // profielmenu-knop toont meteen de nieuwe naam/avatar
  goToPage('home');
  return false;
}

/* ---- afgeleide data ---- */
function getBattleVoteCounts(battleId){
  return APP_DATA.nicknameBattleVoteCounts.find(c => c.battleId === battleId) || { battleId, totalVotes: 0, votesA: 0, votesB: 0 };
}

function getMyVoteInBattle(battleId){
  const v = APP_DATA.nicknameBattleVotes.find(x => x.battleId === battleId && x.userId === STATE.activeUser);
  return v ? v.votedSide : null;
}

function getNicknameBattleRecord(nicknameId){
  const allInvolved = APP_DATA.nicknameBattles
    .filter(b => b.status !== 'open' && (b.nicknameAId === nicknameId || b.nicknameBId === nicknameId))
    .sort((a, b) => (a.finishedAt || '').localeCompare(b.finishedAt || ''));
  const decided = allInvolved.filter(b => b.status === 'finished');
  const played = allInvolved.length;
  const wins = decided.filter(b => b.winnerNicknameId === nicknameId).length;
  const losses = decided.length - wins;
  const winRate = decided.length ? Math.round((wins / decided.length) * 100) : 0;

  let currentStreak = 0;
  for (let i = allInvolved.length - 1; i >= 0; i--){
    const b = allInvolved[i];
    if (b.status === 'draw') break; // een draw onderbreekt een reeks
    if (b.winnerNicknameId === nicknameId) currentStreak++; else break;
  }
  let longestStreak = 0, running = 0;
  allInvolved.forEach(b => {
    if (b.status === 'draw'){ running = 0; return; }
    if (b.winnerNicknameId === nicknameId){ running++; longestStreak = Math.max(longestStreak, running); }
    else running = 0;
  });

  const totalVotesReceived = allInvolved.reduce((sum, b) => {
    const counts = getBattleVoteCounts(b.id);
    return sum + (b.nicknameAId === nicknameId ? counts.votesA : counts.votesB);
  }, 0);

  return { played, wins, losses, winRate, totalVotesReceived, currentStreak, longestStreak };
}

/* alle nicknames die minstens 1 afgeronde/draw battle achter de rug hebben */
function getBattleActiveNicknames(){
  const ids = new Set();
  APP_DATA.nicknameBattles.forEach(b => {
    if (b.status === 'open') return;
    if (b.nicknameAId) ids.add(b.nicknameAId);
    if (b.nicknameBId) ids.add(b.nicknameBId);
  });
  return [...ids].map(id => APP_DATA.nicknames.find(n => n.id === id)).filter(Boolean);
}

function getHallOfChampions(){
  const withRecord = getBattleActiveNicknames().map(n => ({ nickname: n, record: getNicknameBattleRecord(n.id) }));
  return {
    mostWins: withRecord.filter(e => e.record.wins > 0).sort((a, b) => b.record.wins - a.record.wins),
    bestWinRate: withRecord.filter(e => e.record.played >= 3).sort((a, b) => b.record.winRate - a.record.winRate),
    longestStreak: withRecord.filter(e => e.record.longestStreak > 0).sort((a, b) => b.record.longestStreak - a.record.longestStreak),
    mostVotes: withRecord.filter(e => e.record.totalVotesReceived > 0).sort((a, b) => b.record.totalVotesReceived - a.record.totalVotesReceived),
  };
}

/* Battles-pagina-scoped, puur afgeleide lijst -- geen echte
   opgeslagen activity feed (bestaat nergens in deze app), zelfde
   "spotlight" filosofie als Quote of the Week etc. */
function getRecentBattleActivity(){
  const messages = [];
  const recentDecided = [...APP_DATA.nicknameBattles]
    .filter(b => b.status !== 'open')
    .sort((a, b) => (b.finishedAt || '').localeCompare(a.finishedAt || ''))
    .slice(0, 5);

  recentDecided.forEach(b => {
    if (b.status === 'draw'){
      messages.push(`⚔️ "${b.nicknameAText}" vs "${b.nicknameBText}" ended in a DRAW`);
      return;
    }
    const counts = getBattleVoteCounts(b.id);
    const loserText = b.winnerNicknameId === b.nicknameAId ? b.nicknameBText : b.nicknameAText;
    messages.push(`🏆 "${b.winnerNicknameText}" defeated "${loserText}" ${Math.max(counts.votesA, counts.votesB)}–${Math.min(counts.votesA, counts.votesB)}`);
  });

  const seenStreakNicknames = new Set();
  recentDecided.forEach(b => {
    if (b.status !== 'finished' || !b.winnerNicknameId || seenStreakNicknames.has(b.winnerNicknameId)) return;
    const record = getNicknameBattleRecord(b.winnerNicknameId);
    if (record.currentStreak >= 3){
      seenStreakNicknames.add(b.winnerNicknameId);
      messages.push(`🔥 "${b.winnerNicknameText}" has won ${record.currentStreak} battles in a row`);
    }
  });

  return messages.slice(0, 6);
}

        <div class="battle-card-vs">⚔️ VS</div>

function renderNicknameBattlesTab(data){

/* ---- start a battle ---- */
function openStartBattleForm(){
  const options = [...APP_DATA.nicknames].sort((a, b) => a.text.localeCompare(b.text))
    .map(n => `<option value="${n.id}">"${escapeHtml(n.text)}" — ${escapeHtml(n.personRealName || 'onbekend')}</option>`).join('');
  openModal(`
    <h3>⚔️ Start a Battle</h3>
    <form onsubmit="return submitStartBattleForm(event)">
      <div class="form-field">
        <label class="form-label" for="sb-a">Nickname A</label>
        <select class="form-input" id="sb-a" required><option value="">— kies —</option>${options}</select>
      </div>
      <div style="text-align:center; font-weight:800; margin:10px 0;">⚔️ VS</div>
      <div class="form-field">
        <label class="form-label" for="sb-b">Nickname B</label>
        <select class="form-input" id="sb-b" required><option value="">— kies —</option>${options}</select>
      </div>
      <div id="sb-error" class="form-error"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
        <button type="submit" class="btn btn-primary">Start Battle</button>
      </div>
    </form>
  `);
}

async function submitStartBattleForm(event){
  event.preventDefault();
  const aId = document.getElementById('sb-a').value;
  const bId = document.getElementById('sb-b').value;
  const errorEl = document.getElementById('sb-error');
  if (!aId || !bId){ errorEl.textContent = 'Kies twee nicknames.'; return false; }
  if (aId === bId){ errorEl.textContent = 'Een nickname kan niet tegen zichzelf battlen.'; return false; }
  const a = APP_DATA.nicknames.find(n => n.id === aId);
  const b = APP_DATA.nicknames.find(n => n.id === bId);
  if (!a || !b) return false;

  const { data, error } = await sb.from('nickname_battles').insert({
    nickname_a_id: a.id, nickname_a_text: a.text, nickname_a_person_name: a.personRealName, nickname_a_business_unit: a.businessUnit,
    nickname_b_id: b.id, nickname_b_text: b.text, nickname_b_person_name: b.personRealName, nickname_b_business_unit: b.businessUnit,
    created_by_user_id: STATE.activeUser,
  }).select().single();
  if (error){ errorEl.textContent = 'Aanmaken mislukt, probeer opnieuw.'; return false; }

  await refreshAppData();
  closeModal();
  openBattleDetail(data.id);
  return false;
}

/* ---- battle-detail modal: stemmen + reveal ---- */
function renderBattleDetailHtml(battle){
  const counts = getBattleVoteCounts(battle.id);
  const myVote = getMyVoteInBattle(battle.id);
  const isOpen = battle.status === 'open';
  const isDraw = battle.status === 'draw';
  const isFinished = battle.status === 'finished';

  const sideCard = (side, text, personName, businessUnit) => {
    const isMine = myVote === side;
    const isWinner = isFinished && battle.winnerNicknameId === (side === 'a' ? battle.nicknameAId : battle.nicknameBId);
    const voteCount = side === 'a' ? counts.votesA : counts.votesB;
    return `
      <div class="battle-side-card ${!isOpen && isWinner ? 'battle-winner' : ''} ${!isOpen && !isDraw && !isWinner ? 'battle-loser' : ''}">
        <div class="battle-side-nickname">${escapeHtml(text)}</div>
        ${personName ? `<div class="battle-side-person">${escapeHtml(personName)}${businessUnit ? ' · ' + escapeHtml(businessUnit) : ''}</div>` : ''}
        ${isOpen
          ? `<button type="button" class="btn ${isMine ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="toggleBattleVote('${battle.id}','${side}')">${isMine ? '✓ Your vote' : 'Vote'}</button>`
          : `<div class="battle-side-votes">${voteCount} vote${voteCount === 1 ? '' : 's'}</div>${isWinner ? `<span class="badge yellow">🏆 WINNER</span>` : ''}`}
      </div>
    `;
  };

  return `
    <div data-battle-detail-id="${battle.id}">
      <div style="display:flex; justify-content:flex-end;"><button type="button" class="btn btn-ghost btn-sm" onclick="closeModal()">✕ Sluiten</button></div>
      <h3 style="text-align:center;">⚔️ NICKNAME BATTLE</h3>
      <div class="battle-vs-layout">
        ${sideCard('a', battle.nicknameAText, battle.nicknameAPersonName, battle.nicknameABusinessUnit)}
        <div class="battle-vs-divider">VS</div>
        ${sideCard('b', battle.nicknameBText, battle.nicknameBPersonName, battle.nicknameBBusinessUnit)}
      </div>
      ${isOpen ? `
        <div style="text-align:center; margin-top:12px;">
          <span class="stat-chip">${counts.totalVotes}/3 votes received</span>
          ${myVote ? `<div style="margin-top:6px; font-size:12.5px; color:#6b5c4d;">Your vote: ${escapeHtml(myVote === 'a' ? battle.nicknameAText : battle.nicknameBText)}</div>` : ''}
        </div>
        <div style="text-align:center; margin-top:10px;">
          <button type="button" class="btn btn-ghost btn-sm" onclick="confirmForceCloseBattle('${battle.id}')">Force Close</button>
        </div>
      ` : isDraw ? `
        <div style="text-align:center; margin-top:14px;">
          <div class="badge grey" style="font-size:16px; padding:8px 16px;">⚔️ DRAW</div>
          <div style="margin-top:10px;"><button type="button" class="btn btn-primary btn-sm" onclick="startRematch('${battle.id}')">🔁 Rematch</button></div>
        </div>
      ` : `
        <div style="text-align:center; margin-top:14px; font-weight:800;">🏆 WINNER: ${escapeHtml(battle.winnerNicknameText).toUpperCase()}</div>
      `}
      <div style="text-align:center; margin-top:16px;">
        <button type="button" class="btn btn-ghost btn-sm" onclick="confirmDeleteBattle('${battle.id}')">🗑️ Delete Battle</button>
      </div>
    </div>
  `;
}

function openBattleDetail(id){
  const battle = APP_DATA.nicknameBattles.find(b => b.id === id);
  if (!battle) return;
  openModal(renderBattleDetailHtml(battle));
}

function refreshOpenBattleDetailModal(){
  const openEl = document.querySelector('[data-battle-detail-id]');
  if (!openEl) return;
  const id = openEl.getAttribute('data-battle-detail-id');
  const fresh = APP_DATA.nicknameBattles.find(b => b.id === id);
  if (fresh) openModal(renderBattleDetailHtml(fresh));
  else closeModal();
}

async function toggleBattleVote(battleId, side){
  await sb.from('nickname_battle_votes').upsert(
    { battle_id: battleId, user_id: STATE.activeUser, voted_side: side, updated_at: new Date().toISOString() },
    { onConflict: 'battle_id,user_id' }
  );
  await refreshAppData();
  refreshOpenBattleDetailModal();
  checkAndShowBattleReveal(battleId);
  renderPage();
}

function confirmForceCloseBattle(battleId){
  openModal(`
    <h3>⚔️ Force close this battle?</h3>
    <p>This resolves the battle using whatever votes exist right now. If it's tied, the battle ends in a draw.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="openBattleDetail('${battleId}')">Cancel</button>
      <button type="button" class="btn btn-danger" onclick="forceCloseBattle('${battleId}')">Force Close</button>
    </div>
  `);
}

async function forceCloseBattle(battleId){
  await sb.rpc('close_nickname_battle_early', { p_battle_id: battleId });
  await refreshAppData();
  refreshOpenBattleDetailModal();
  checkAndShowBattleReveal(battleId);
  renderPage();
}

async function startRematch(battleId){
  const old = APP_DATA.nicknameBattles.find(b => b.id === battleId);
  if (!old) return;
  const { data, error } = await sb.from('nickname_battles').insert({
    nickname_a_id: old.nicknameAId, nickname_a_text: old.nicknameAText, nickname_a_person_name: old.nicknameAPersonName, nickname_a_business_unit: old.nicknameABusinessUnit,
    nickname_b_id: old.nicknameBId, nickname_b_text: old.nicknameBText, nickname_b_person_name: old.nicknameBPersonName, nickname_b_business_unit: old.nicknameBBusinessUnit,
    created_by_user_id: STATE.activeUser,
  }).select().single();
  if (error) return;
  await refreshAppData();
  closeModal();
  openBattleDetail(data.id);
}

function confirmDeleteBattle(battleId){
  openModal(`
    <h3>🗑️ Delete this battle?</h3>
    <p>This permanently removes the battle and its votes. This cannot be undone.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="openBattleDetail('${battleId}')">Cancel</button>
      <button type="button" class="btn btn-danger" onclick="performDeleteBattle('${battleId}')">Delete</button>
    </div>
  `);
}

async function performDeleteBattle(battleId){
  await sb.from('nickname_battles').delete().eq('id', battleId);
  await refreshAppData();
  closeModal();
  renderPage();
}

/* =============================================================
   NICKNAMES MODULE — render helpers + event handlers

/* ---- kaart (compact = Home Wall, zonder acties/stemmen) ---- */

  const savageScore = n.votes.savage.length;
  const accurateScore = n.votes.accurate.length;
  const legendaryScore = n.votes.legendary.length;
  const doubtScore = n.votes.doubt.length;
  const statusClass = statusBadgeClass(n.status);
  const isLegendary = isLegendaryNickname(n);

  return `
    <div class="sticker-card nickname-card ${compact ? 'nickname-card-compact' : ''}">
      <div class="nickname-card-top">
        <div>
          <div class="nickname-text">${escapeHtml(n.text)}</div>
          <div class="nickname-person clickable" onclick="goToNicknamesFilteredByName('${escapeJs(n.personRealName)}')">
            ${initialsAvatarHtml(n.personRealName, 22)}
            <span>${escapeHtml(n.personRealName || 'onbekend')}</span>
          </div>
          ${n.businessUnit ? `<span class="badge lilac" style="margin-top:4px;">${escapeHtml(n.businessUnit)}</span>` : ''}

        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
          <span class="badge ${statusClass}">${escapeHtml(n.status)}</span>
          ${isLegendary ? `<span class="badge yellow">🔥 LEGENDARY NICKNAME</span>` : ''}
        </div>
      </div>

      <div class="nickname-level-row">
        <span class="level-pill">${level.icon} ${level.label}</span>
        <span class="xp-value">${n.xp} XP</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${progressPct}%"></div>
      </div>
      <div class="progress-caption">${next ? `${xpToNext} XP tot "${next.label}"` : 'Maximum level bereikt 🎉'}</div>

      ${compact ? `
        <div class="nickname-meta-row">
          <span class="stat-chip">😂 ${funnyScore}</span>
          <span class="stat-chip">💀 ${savageScore}</span>
          <span class="stat-chip">🎯 ${accurateScore}</span>
          <span class="stat-chip">🔥 ${legendaryScore}</span>
          <span class="stat-chip">🤔 ${doubtScore}</span>
        </div>
      ` : `
        <p class="nickname-origin">${n.description ? escapeHtml(n.description) : 'Geen oorsprong toegevoegd.'}</p>
        ${n.anecdote ? `<p class="nickname-anecdote">💭 ${escapeHtml(n.anecdote)}</p>` : ''}

        <div class="vote-row">
          <button type="button" class="vote-btn ${n.votes.funny.includes(STATE.activeUser) ? 'voted' : ''}" onclick="toggleNicknameVote('${n.id}','funny')">😂 Funny <span>${funnyScore}</span></button>
          <button type="button" class="vote-btn ${n.votes.savage.includes(STATE.activeUser) ? 'voted' : ''}" onclick="toggleNicknameVote('${n.id}','savage')">💀 Savage <span>${savageScore}</span></button>
          <button type="button" class="vote-btn ${n.votes.accurate.includes(STATE.activeUser) ? 'voted' : ''}" onclick="toggleNicknameVote('${n.id}','accurate')">🎯 Accurate <span>${accurateScore}</span></button>
          <button type="button" class="vote-btn ${n.votes.legendary.includes(STATE.activeUser) ? 'voted' : ''}" onclick="toggleNicknameVote('${n.id}','legendary')">🔥 Legendary <span>${legendaryScore}</span></button>
          <button type="button" class="vote-btn ${n.votes.doubt.includes(STATE.activeUser) ? 'voted' : ''}" onclick="toggleNicknameVote('${n.id}','doubt')">🤔 Doubt <span>${doubtScore}</span></button>
        </div>

        <div class="nickname-meta-row">
          <span class="stat-chip">🔁 ${n.usageCount}× gebruikt</span>
          <span class="stat-chip">📅 ${n.createdAt}</span>
          <span class="stat-chip">👤 ${resolveUserLabel(n.createdByUserId)}</span>

/* ---- add/edit formulier (in een modal) ----
   Twee flows: de maker (created_by_user_id) mag alles wijzigen via de
   gewone volledige update; iedereen anders ziet dezelfde vorm maar met
   nickname/naam/Business Unit/status als read-only, en mag enkel
   uitleg + anekdote opslaan (via de veilige RPC, zie submitNicknameForm).
   isOwner bepaalt puur de UI-vertakking -- de echte beveiliging zit
   server-side (RLS + de RPC's eigen kolom-scope), dus DOM-manipulatie
   kan hier niets omzeilen. */
function renderNicknameFormHtml(mode, nickname, presetRealName, terraceEventId){
  const selectedName = nickname?.personRealName ?? presetRealName ?? '';
  const selectedBusinessUnit = nickname?.businessUnit ?? '';
  const isOwner = mode !== 'edit' || nickname.createdByUserId === STATE.activeUser;
  const lockedAttr = isOwner ? '' : 'disabled title="Only the person who created this nickname can change this field."';
  const lockIconHtml = isOwner ? '' : ` <span class="lock-icon" title="Only the person who created this nickname can change this field.">🔒</span>`;
  const showLastEdited = mode === 'edit' && nickname.updatedByUserId && nickname.updatedByUserId !== nickname.createdByUserId;

  return `
    <h3>${mode === 'edit' ? '✏️ Nickname bewerken' : '➕ Nieuwe nickname'}</h3>
    ${mode === 'edit' && !isOwner ? `<p class="form-meta" style="margin-top:0; margin-bottom:12px;">🔒 Alleen ${escapeHtml(resolveUserLabel(nickname.createdByUserId))} kan de nickname, naam en Business Unit wijzigen — jij kan wel de uitleg en anekdote aanpassen.</p>` : ''}
    ${terraceEventId ? `<p class="form-meta" style="margin-top:0;">🍻 Linked to this Terrace Event</p>` : ''}
    <form data-mode="${mode}" data-id="${nickname?.id || ''}" data-owner="${isOwner}" data-terrace-event-id="${terraceEventId || ''}" onsubmit="return submitNicknameForm(event)">
      ${renderRealNameFieldsHtml('nf', selectedName, selectedBusinessUnit, 'Echte naam *', !isOwner)}
      <div class="form-field" style="margin-top:10px;">
        <label class="form-label" for="nf-text">Nickname *${lockIconHtml}</label>
        <input class="form-input ${isOwner ? '' : 'form-input-locked'}" id="nf-text" type="text" value="${escapeHtml(nickname?.text || '')}" ${lockedAttr} required>
      </div>
      <div class="form-field" style="margin-top:10px;">
        <label class="form-label" for="nf-origin">Korte uitleg / oorsprong</label>
        <textarea class="form-input form-textarea" id="nf-origin" rows="2">${escapeHtml(nickname?.description || '')}</textarea>
      </div>
      <div class="form-field" style="margin-top:10px;">
        <label class="form-label" for="nf-anecdote">Optionele anekdote</label>
        <textarea class="form-input form-textarea" id="nf-anecdote" rows="2">${escapeHtml(nickname?.anecdote || '')}</textarea>
      </div>
      <div class="form-field" style="margin-top:10px;">
        <label class="form-label" for="nf-status">Status${lockIconHtml}</label>
        <select class="form-input ${isOwner ? '' : 'form-input-locked'}" id="nf-status" ${lockedAttr}>
          ${NICKNAME_STATUSES.map(s => `<option value="${s}" ${(nickname?.status || 'Actief') === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
      ${mode === 'edit' ? `
        <div class="form-meta">Toegevoegd op ${nickname.createdAt} door ${resolveUserLabel(nickname.createdByUserId)}</div>
        ${showLastEdited ? `<div class="form-meta">Last edited by ${resolveUserLabel(nickname.updatedByUserId)} · ${formatDateTime(nickname.updatedAt)}</div>` : ''}
      ` : ''}
      <div id="nf-error" class="form-error"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
        <button type="submit" class="btn btn-primary">${mode === 'edit' ? 'Save Changes' : 'Nickname toevoegen (+10 XP)'}</button>
      </div>
    </form>
  `;
}

function openNicknameForm(mode, nicknameId, presetRealName, terraceEventId){
  const nickname = mode === 'edit' ? APP_DATA.nicknames.find(n => n.id === nicknameId) : null;
  openModal(renderNicknameFormHtml(mode, nickname, presetRealName, terraceEventId));
}

async function submitNicknameForm(event){
  event.preventDefault();
  const form = event.target;
  const mode = form.dataset.mode;
  const editId = form.dataset.id;
  const isOwner = form.dataset.owner === 'true';
  const terraceEventId = form.dataset.terraceEventId || null;
  const errorEl = document.getElementById('nf-error');

  const description = document.getElementById('nf-origin').value.trim();
  const anecdote = document.getElementById('nf-anecdote').value.trim();

  // niet-maker: enkel uitleg + anekdote, via de veilige RPC (nooit een
  // rechtstreekse .update() -- RLS staat een niet-maker sowieso niet
  // toe, dit is de bedoelde, geteste weg zodat het ook echt opslaat)
  if (mode === 'edit' && !isOwner){
    errorEl.textContent = '';
    const { error } = await sb.rpc('update_nickname_collaborative_fields', {
      p_nickname_id: editId, p_description: description, p_anecdote: anecdote,
    });
    if (error){
      console.error('update_nickname_collaborative_fields failed:', error);
      errorEl.textContent = 'Could not save changes. Please try again.';
      return false;
    }
    await refreshAppData();
    closeModal();
    renderPage();
    return false;
  }

  const personRealName = document.getElementById('nf-realname').value.trim();
  const businessUnit = document.getElementById('nf-businessunit').value.trim();
  const text = document.getElementById('nf-text').value.trim();
  const status = document.getElementById('nf-status').value;

  if (!personRealName || !text){
    errorEl.textContent = 'Vul de echte naam van de persoon en een nickname in.';
    return false;
  }
  errorEl.textContent = '';

  let error;
  if (mode === 'edit'){
    ({ error } = await sb.from('nicknames').update({
      person_real_name: personRealName, business_unit: businessUnit || null,
      nickname: text, description, anecdote, status,
    }).eq('id', editId));
  } else {
    ({ error } = await sb.from('nicknames').insert({
      person_real_name: personRealName, business_unit: businessUnit || null,
      nickname: text, description, anecdote,
      status: status || 'Actief',
      created_by_user_id: STATE.activeUser, terrace_event_id: terraceEventId,
    }));
  }

  if (error){
    console.error('submitNicknameForm failed:', error);
    errorEl.textContent = 'Could not save changes. Please try again.';
    return false;
  }

  await refreshAppData();
  closeModal();
  renderPage();
  return false;
}

/* Wissel tussen Quote/Anekdote in het "+ Lore"-formulier zonder de
   al ingevulde naam (of terrace-koppeling) te verliezen. */
function switchLoreFormType(kind){
  const currentForm = document.querySelector('#modal-root form');
  const currentName = document.getElementById('lf-realname')?.value;
  const terraceEventId = currentForm?.dataset.terraceEventId || null;
  openModal(renderLoreFormHtml('add', kind, null, currentName, terraceEventId));
}

async function submitLoreForm(event){
  event.preventDefault();
  const form = event.target;
  const mode = form.dataset.mode;
  const kind = form.dataset.kind;
  const editId = form.dataset.id;
  const terraceEventId = form.dataset.terraceEventId || null;
  const errorEl = document.getElementById('lf-error');
  const personRealName = document.getElementById('lf-realname').value.trim();
  const businessUnit = document.getElementById('lf-businessunit').value.trim();

  if (!personRealName){
    errorEl.textContent = 'Vul de echte naam van de persoon in.';
    return false;
  }

  let error;
  if (kind === 'quote'){
    const text = document.getElementById('lf-text').value.trim();
    const context = document.getElementById('lf-context').value.trim();
    if (!text){
      errorEl.textContent = 'Vul de exacte quote in.';
      return false;
    }
    errorEl.textContent = '';
    if (mode === 'edit'){
      ({ error } = await sb.from('quotes').update({
        person_real_name: personRealName, business_unit: businessUnit || null, quote: text, context,
      }).eq('id', editId));
    } else {
      ({ error } = await sb.from('quotes').insert({
        person_real_name: personRealName, business_unit: businessUnit || null, quote: text, context,
        created_by_user_id: STATE.activeUser, terrace_event_id: terraceEventId,
      }));
    }
  } else {
    const title = document.getElementById('lf-title').value.trim();
    const description = document.getElementById('lf-description').value.trim();
    if (!title || !description){
      errorEl.textContent = 'Vul titel en beschrijving in.';
      return false;
    }
    errorEl.textContent = '';
    if (mode === 'edit'){
      ({ error } = await sb.from('anecdotes').update({
        person_real_name: personRealName, business_unit: businessUnit || null, title, description,
      }).eq('id', editId));
    } else {
      ({ error } = await sb.from('anecdotes').insert({
        person_real_name: personRealName, business_unit: businessUnit || null, title, description,
        created_by_user_id: STATE.activeUser,
      }));
    }
  }

  if (error){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return false; }

  await refreshAppData();
  closeModal();
  renderPage();
  return false;
}

async function toggleLoreReaction(kind, itemId, category){
  const list = kind === 'quote' ? APP_DATA.quotes : APP_DATA.anecdotes;
  const item = list.find(x => x.id === itemId);
  if (!item) return;
  const table = kind === 'quote' ? 'quote_reactions' : 'anecdote_reactions';
  const idField = kind === 'quote' ? 'quote_id' : 'anecdote_id';
  const alreadyReacted = item.reactions[category].includes(STATE.activeUser);
  if (alreadyReacted){
    await sb.from(table).delete().eq(idField, itemId).eq('user_id', STATE.activeUser).eq('reaction_type', category);
  } else {
    await sb.from(table).insert({ [idField]: itemId, user_id: STATE.activeUser, reaction_type: category });
  }
  // all-three bonus (if any) is awarded server-side by a trigger on insert
  await refreshAppData();
  renderPage();
}

function openCounterForm(mode, counterId, presetRealName){
  const counter = mode === 'edit' ? APP_DATA.counters.find(c => c.id === counterId) : null;
  openModal(renderCounterFormHtml(mode, counter, presetRealName));
}

async function submitCounterForm(event){
  event.preventDefault();
  const form = event.target;
  const mode = form.dataset.mode;
  const editId = form.dataset.id;

  const name = document.getElementById('cf-name').value.trim();
  const personRealName = document.getElementById('cf-realname').value.trim();
  const businessUnit = document.getElementById('cf-businessunit').value.trim();
  const description = document.getElementById('cf-description').value.trim();
  const errorEl = document.getElementById('cf-error');

  if (!name || !personRealName){
    errorEl.textContent = 'Vul een naam voor de counter in en de echte naam van de persoon.';
    return false;
  }
  errorEl.textContent = '';

  let error;
  if (mode === 'edit'){
    ({ error } = await sb.from('counters').update({
      title: name, person_real_name: personRealName, business_unit: businessUnit || null, description,
    }).eq('id', editId));
  } else {
    const startEl = document.getElementById('cf-start');
    const start = startEl ? Math.max(0, parseInt(startEl.value, 10) || 0) : 0;
    const { data, error: insertError } = await sb.from('counters').insert({
      title: name, person_real_name: personRealName, business_unit: businessUnit || null, description,
      created_by_user_id: STATE.activeUser,
    }).select().single();
    error = insertError;
    if (!error && start > 0){
      ({ error } = await sb.from('counter_events').insert({
        counter_id: data.id, registered_by_user_id: STATE.activeUser, delta: start, note: 'Startwaarde',
      }));
    }
  }

  if (error){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return false; }

  await refreshAppData();
  closeModal();
  renderPage();
  return false;
}

/* Speelse podiumkaarten voor plaats 1-3 (1 in het midden, met
   optionele kroonbadge), en een gewone ranglijst voor de rest.
   entries = [{ avatar, title, subtitle, value, onClick }]. */
function renderPodium(entries, opts = {}){
  if (!entries.length) return emptyState('Nog geen data voor dit klassement.');

  const top3 = entries.slice(0, 3);
  const restLimit = opts.restLimit ?? 7;
  const rest = entries.slice(3, 3 + restLimit);
  const medals = ['🥇', '🥈', '🥉'];
  const displayOrder = [1, 0, 2].filter(i => top3[i]);

  const podiumHtml = displayOrder.map(i => {
    const e = top3[i];
    const place = i + 1;
    const isBeerifyWinner = place === 1 && opts.beerify;
    return `
      <div class="podium-spot podium-place-${place} ${isBeerifyWinner ? 'podium-beerify' : ''} ${e.onClick ? 'clickable' : ''}" ${e.onClick ? `onclick="${e.onClick}"` : ''}>
        ${place === 1 && opts.crown ? `<div class="podium-crown">👑</div>` : ''}
        ${isBeerifyWinner ? `
          <div class="podium-bubbles"><span></span><span></span><span></span><span></span></div>
          <div class="podium-trophy">🏆</div>
        ` : ''}
        <div class="podium-medal">${medals[place - 1]}</div>
        <div class="podium-avatar">${entryAvatarHtml(e, 54)}</div>
        <div class="podium-title">${escapeHtml(e.title)}</div>
        ${e.subtitle ? `<div class="podium-subtitle">${escapeHtml(e.subtitle)}</div>` : ''}
        <div class="podium-value">${e.value}</div>
      </div>
    `;
  }).join('');

  const restHtml = rest.length ? `
    <div class="row-list" style="margin-top:14px;">
      ${rest.map((e, idx) => `
        <div class="row-item ${e.onClick ? 'clickable' : ''}" ${e.onClick ? `onclick="${e.onClick}"` : ''}>
          <div class="rank">#${idx + 4}</div>
          ${entryAvatarHtml(e, 40)}
          <div class="info">
            <div class="name">${escapeHtml(e.title)}</div>
            ${e.subtitle ? `<div class="sub">${escapeHtml(e.subtitle)}</div>` : ''}
          </div>
          <div class="value">${e.value}</div>
        </div>
      `).join('')}
    </div>
  ` : '';

  return `<div class="podium ${opts.compact ? 'compact' : ''}">${podiumHtml}</div>${restHtml}`;
}
