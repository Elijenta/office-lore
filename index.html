<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Office Lore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* =========================================================
     1. DESIGN TOKENS
     Alle kleuren / afmetingen hier zodat toekomstige modules
     dezelfde sticker-stijl automatisch overnemen.
  ========================================================= */
  :root{
    --ink: #2b2320;
    --paper: #fff8ef;
    --card: #ffffff;

    --pink: #ffd1e3;
    --pink-deep: #ff8fb3;
    --yellow: #ffe58a;
    --yellow-deep: #ffc93c;
    --mint: #b9f2d9;
    --mint-deep: #4fd8a2;
    --sky: #bfe3ff;
    --sky-deep: #6fb8ff;
    --lilac: #ddd0ff;
    --lilac-deep: #b39dff;
    --peach: #ffd6b8;
    --peach-deep: #ff9d5c;

    --outline: 3px solid var(--ink);
    --outline-thin: 2px solid var(--ink);
    --shadow-pop: 5px 5px 0 var(--ink);
    --shadow-pop-sm: 3px 3px 0 var(--ink);
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-sm: 12px;

    --font-display: 'Baloo 2', 'Comic Sans MS', cursive, sans-serif;
    --font-body: 'Nunito', system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background:
      radial-gradient(circle at 8% 12%, rgba(255,209,227,.5), transparent 40%),
      radial-gradient(circle at 92% 18%, rgba(191,227,255,.5), transparent 42%),
      radial-gradient(circle at 50% 95%, rgba(185,242,217,.45), transparent 45%),
      var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  h1,h2,h3,h4{ font-family: var(--font-display); margin: 0; }
  p{ margin: 0; }

  button{ font-family: var(--font-body); cursor: pointer; }

  ::selection{ background: var(--yellow-deep); }

  /* =========================================================
     2. LAYOUT SHELL
  ========================================================= */
  .app-shell{
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 20px 60px;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 22px;
    background: var(--card);
    border: var(--outline);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    margin-bottom: 22px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap: 12px;
  }

  .brand .logo-badge{
    display:flex;
    align-items:center;
    justify-content:center;
    width: 52px; height: 52px;
    font-size: 26px;
    background: var(--yellow);
    border: var(--outline);
    border-radius: 16px;
    box-shadow: var(--shadow-pop-sm);
    transform: rotate(-6deg);
    animation: wiggle 5s ease-in-out infinite;
  }

  .brand h1{
    font-size: 30px;
    letter-spacing: .5px;
  }

  .brand .tagline{
    font-size: 12.5px;
    font-weight: 700;
    color: #8a7a6b;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-top: 2px;
  }

  @keyframes wiggle{
    0%, 100%{ transform: rotate(-6deg); }
    50%{ transform: rotate(4deg); }
  }

  /* ---- user switcher (top-right) ---- */
  .user-switcher{
    display:flex;
    align-items:center;
    gap: 10px;
  }

  .user-switcher .label{
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8a7a6b;
    margin-right: 2px;
  }

  .user-pill{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 6px 14px 6px 6px;
    background: var(--card);
    border: var(--outline-thin);
    border-radius: 999px;
    box-shadow: var(--shadow-pop-sm);
    transition: transform .15s ease, background .15s ease;
    font-weight: 700;
    font-size: 13.5px;
    color: var(--ink);
  }

  .user-pill .avatar{
    width: 30px; height: 30px;
    display:flex; align-items:center; justify-content:center;
    border-radius: 50%;
    border: var(--outline-thin);
    font-size: 15px;
  }

  .user-pill:hover{ transform: translateY(-2px); }

  .user-pill.active{
    background: var(--mint);
    box-shadow: var(--shadow-pop);
    transform: translateY(-2px);
  }

  .user-pill.active .avatar{ background: #fff; }

  /* =========================================================
     3. MAIN NAVIGATION
  ========================================================= */
  .main-nav{
    display:flex;
    gap: 10px;
    overflow-x: auto;
    padding: 6px 4px 14px;
    margin-bottom: 8px;
    scrollbar-width: thin;
  }

  .main-nav::-webkit-scrollbar{ height: 6px; }
  .main-nav::-webkit-scrollbar-thumb{ background: var(--lilac-deep); border-radius: 10px; }

  .nav-btn{
    flex: 0 0 auto;
    display:flex;
    align-items:center;
    gap: 7px;
    padding: 10px 18px;
    background: var(--card);
    border: var(--outline-thin);
    border-radius: 999px;
    font-weight: 800;
    font-size: 14px;
    color: var(--ink);
    box-shadow: var(--shadow-pop-sm);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    white-space: nowrap;
  }

  .nav-btn:hover{ transform: translateY(-2px); }

  .nav-btn.active{
    background: var(--pink-deep);
    color: #fff;
    border-color: var(--ink);
  }

  .nav-btn .emoji{ font-size: 16px; }

  /* =========================================================
     4. PAGE / SECTION SCAFFOLDING
  ========================================================= */
  .page{ display:none; animation: fadeIn .35s ease; }
  .page.active{ display:block; }

  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .page-header{
    margin: 6px 4px 20px;
  }

  .page-header h2{
    font-size: 26px;
  }

  .page-header .sub{
    font-size: 14px;
    color: #8a7a6b;
    font-weight: 700;
    margin-top: 4px;
  }

  .section{
    background: var(--card);
    border: var(--outline);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    padding: 20px 22px 24px;
    margin-bottom: 22px;
  }

  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .section-head h3{
    font-size: 19px;
    display:flex;
    align-items:center;
    gap: 8px;
  }

  .section-head .count-chip{
    background: var(--yellow);
    border: var(--outline-thin);
    border-radius: 999px;
    padding: 2px 12px;
    font-size: 12px;
    font-weight: 800;
  }

  .placeholder-note{
    font-size: 12px;
    font-weight: 700;
    color: #a9967f;
    background: #fff2de;
    border: 1.5px dashed #d8bfa0;
    border-radius: 10px;
    padding: 6px 10px;
  }

  /* =========================================================
     5. GRIDS & CARDS (herbruikbaar over modules)
  ========================================================= */
  .grid{
    display:grid;
    gap: 14px;
  }
  .grid.cols-auto{ grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .grid.cols-auto-wide{ grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .grid.cols-wide-lg{ grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

  .sticker-card{
    background: var(--card);
    border: var(--outline-thin);
    border-radius: var(--radius-md);
    padding: 14px;
    box-shadow: var(--shadow-pop-sm);
    transition: transform .15s ease, box-shadow .15s ease;
    position: relative;
  }
  .sticker-card:hover{
    transform: translateY(-3px) rotate(-0.4deg);
    box-shadow: 6px 6px 0 var(--ink);
  }

  /* nickname wall */
  .nick-card{ text-align:center; }
  .nick-card .avatar{
    width: 54px; height: 54px;
    margin: 0 auto 8px;
    display:flex; align-items:center; justify-content:center;
    font-size: 26px;
    border-radius: 50%;
    border: var(--outline-thin);
  }
  .nick-card .nickname{
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 700;
  }
  .nick-card .real-name{
    font-size: 11.5px;
    color: #8a7a6b;
    font-weight: 700;
    margin-top: 2px;
  }

  /* lore list */
  .lore-card{
    display:flex;
    flex-direction: column;
    gap: 6px;
  }
  .lore-card .meta{
    display:flex;
    align-items:center;
    gap: 8px;
    font-size: 11.5px;
    font-weight: 800;
    color: #8a7a6b;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .lore-card .title{ font-family: var(--font-display); font-size: 17px; }
  .lore-card .snippet{ font-size: 13.5px; line-height: 1.5; color: #4b3f36; }

  /* quote of the week */
  .quote-box{
    background: linear-gradient(135deg, var(--lilac), var(--sky));
    border: var(--outline);
    border-radius: var(--radius-md);
    padding: 26px 26px 20px;
    box-shadow: var(--shadow-pop-sm);
    position: relative;
    text-align: center;
  }
  .quote-box .mark{
    font-family: var(--font-display);
    font-size: 46px;
    line-height: 1;
    opacity: .6;
  }
  .quote-box .quote-text{
    font-family: var(--font-display);
    font-size: 21px;
    max-width: 560px;
    margin: 6px auto 12px;
  }
  .quote-box .quote-author{
    font-weight: 800;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .6px;
  }

  /* counters */
  .counter-card{
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .counter-card .icon{
    width: 44px; height: 44px;
    flex: 0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-size: 20px;
    border-radius: 14px;
    border: var(--outline-thin);
    background: var(--peach);
  }
  .counter-card .num{
    font-family: var(--font-display);
    font-size: 24px;
    line-height: 1;
  }
  .counter-card .label{
    font-size: 12px;
    font-weight: 700;
    color: #6b5c4d;
  }

  /* beer club */
  .beer-stats{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
  }
  .beer-stat{
    background: var(--yellow);
    border: var(--outline-thin);
    border-radius: var(--radius-md);
    padding: 16px;
    text-align:center;
    box-shadow: var(--shadow-pop-sm);
  }
  .beer-stat .num{ font-family: var(--font-display); font-size: 28px; }
  .beer-stat .label{ font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; color: #6b5c4d; }

  /* abt lord */
  .abt-lord-card{
    display:flex;
    align-items:center;
    gap: 18px;
    background: linear-gradient(135deg, var(--yellow), var(--peach));
    border: var(--outline);
    border-radius: var(--radius-md);
    padding: 20px;
    box-shadow: var(--shadow-pop-sm);
  }
  .abt-lord-card .crown{
    font-size: 42px;
    animation: floaty 3s ease-in-out infinite;
  }
  @keyframes floaty{
    0%, 100%{ transform: translateY(0) rotate(-4deg); }
    50%{ transform: translateY(-5px) rotate(4deg); }
  }
  .abt-lord-card .name{ font-family: var(--font-display); font-size: 22px; }
  .abt-lord-card .desc{ font-size: 12.5px; font-weight: 700; color: #6b5236; margin-top: 2px; }

  /* badges (herbruikbaar) */
  .badge{
    display:inline-flex;
    align-items:center;
    gap: 4px;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
    border: var(--outline-thin);
    background: var(--mint);
  }
  .badge.pink{ background: var(--pink); }
  .badge.sky{ background: var(--sky); }
  .badge.lilac{ background: var(--lilac); }
  .badge.peach{ background: var(--peach); }
  .badge.yellow{ background: var(--yellow); }
  .badge.grey{ background: #e7ddd0; }

  /* generic list rows (People / Leaderboards) */
  .row-list{ display:flex; flex-direction:column; gap: 10px; }
  .row-item{
    display:flex;
    align-items:center;
    gap: 14px;
    background: var(--card);
    border: var(--outline-thin);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    box-shadow: var(--shadow-pop-sm);
  }
  .row-item .rank{
    font-family: var(--font-display);
    font-size: 18px;
    width: 28px;
    text-align:center;
  }
  .row-item .avatar{
    width: 40px; height: 40px;
    border-radius: 50%;
    border: var(--outline-thin);
    display:flex; align-items:center; justify-content:center;
    font-size: 18px;
  }
  .row-item .info{ flex: 1; }
  .row-item .info .name{ font-weight: 800; font-size: 14.5px; }
  .row-item .info .sub{ font-size: 11.5px; color: #8a7a6b; font-weight: 700; }
  .row-item .value{
    font-family: var(--font-display);
    font-size: 17px;
  }

  /* empty-state (voor secties die nog geen data hebben) */
  .empty-state{
    text-align:center;
    padding: 26px 10px;
    color: #a9967f;
    font-weight: 700;
    font-size: 13.5px;
    border: 2px dashed #d8bfa0;
    border-radius: var(--radius-sm);
  }

  footer.app-footer{
    text-align:center;
    font-size: 11.5px;
    color: #a9967f;
    font-weight: 700;
    padding-top: 10px;
  }

  /* =========================================================
     6. PEOPLE MODULE (kaarten, formulier, detail, modal)
     Herbruikbare bouwstenen (.btn, .form-*, modal) zijn bewust
     generiek benoemd zodat andere modules (Nicknames, Lore, ...)
     ze later kunnen hergebruiken.
  ========================================================= */

  /* ---- generieke knoppen ---- */
  .btn{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    padding: 9px 16px;
    border: var(--outline-thin);
    border-radius: 999px;
    font-weight: 800;
    font-size: 13.5px;
    box-shadow: var(--shadow-pop-sm);
    transition: transform .15s ease, box-shadow .15s ease;
    background: var(--card);
    color: var(--ink);
  }
  .btn:hover{ transform: translateY(-2px); }
  .btn:active{ transform: translateY(0); box-shadow: 1px 1px 0 var(--ink); }
  .btn-primary{ background: var(--mint-deep); }
  .btn-secondary{ background: var(--sky); }
  .btn-danger{ background: #ff9b9b; }
  .btn-ghost{ background: transparent; box-shadow: none; }
  .btn-ghost:hover{ box-shadow: none; }
  .btn-sm{ padding: 6px 12px; font-size: 12px; }

  /* ---- people toolbar ---- */
  .people-toolbar{
    display:flex;
    align-items:center;
    gap: 10px;
  }

  /* ---- person card (grid overzicht) ---- */
  .person-card{
    display:flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
  }
  .person-card-top{
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .person-card-name{
    font-family: var(--font-display);
    font-size: 17px;
    line-height: 1.15;
  }
  .person-card-desc{
    font-size: 12.5px;
    color: #6b5c4d;
    line-height: 1.4;
    min-height: 18px;
  }
  .person-stats{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .stat-chip{
    font-size: 11px;
    font-weight: 800;
    background: var(--paper);
    border: var(--outline-thin);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }

  /* ---- avatars (herbruikbaar: card, detail, form-preview) ---- */
  .avatar-emoji{
    border-radius: 50%;
    border: var(--outline-thin);
    display:flex;
    align-items:center;
    justify-content:center;
    flex: 0 0 auto;
  }
  .avatar-img{
    border-radius: 50%;
    border: var(--outline-thin);
    object-fit: cover;
    flex: 0 0 auto;
  }

  /* ---- formulier ---- */
  .form-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .form-field{
    display:flex;
    flex-direction: column;
    gap: 5px;
  }
  .form-label{
    font-size: 11.5px;
    font-weight: 800;
    color: #6b5c4d;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .form-input{
    font-family: var(--font-body);
    padding: 9px 12px;
    border: var(--outline-thin);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: #fff;
    color: var(--ink);
    width: 100%;
  }
  .form-input:focus{
    outline:none;
    box-shadow: 0 0 0 3px var(--yellow);
  }
  .form-textarea{
    resize: vertical;
    min-height: 70px;
    font-family: var(--font-body);
  }
  .form-error{
    color: #b3261e;
    font-weight: 800;
    font-size: 12.5px;
    margin-top: 12px;
    min-height: 16px;
  }
  .form-actions{
    display:flex;
    justify-content:flex-end;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .form-meta{
    font-size: 11.5px;
    font-weight: 700;
    color: #8a7a6b;
    margin-top: 14px;
  }

  /* ---- avatar picker binnen formulier ---- */
  .avatar-editor{
    display:flex;
    gap: 18px;
    align-items:flex-start;
    flex-wrap: wrap;
  }
  .avatar-picker{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 300px;
  }
  .avatar-swatch{
    width: 36px; height: 36px;
    border-radius: 50%;
    border: var(--outline-thin);
    background: #fff;
    font-size: 17px;
    display:flex; align-items:center; justify-content:center;
    transition: transform .1s ease;
  }
  .avatar-swatch:hover{ transform: scale(1.08); }
  .avatar-swatch.selected{
    background: var(--yellow);
    box-shadow: var(--shadow-pop-sm);
  }
  .color-picker{
    display:flex;
    gap: 6px;
    margin-top: 10px;
  }
  .color-swatch{
    width: 24px; height: 24px;
    border-radius: 50%;
    border: var(--outline-thin);
  }
  .color-swatch.selected{
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink);
  }

  /* ---- "Wie is dit?"-kiezer (Nickname/Quote/Anecdote/Counter-formulieren) ---- */
  .user-picker{
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .user-picker-btn{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 6px 14px 6px 6px;
    background: var(--card);
    border: var(--outline-thin);
    border-radius: 999px;
    cursor:pointer;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .user-picker-btn:hover{ transform: translateY(-2px); }
  .user-picker-btn.selected{
    background: var(--mint);
    box-shadow: var(--shadow-pop-sm);
    border-color: var(--ink);
  }

  /* ---- detailpagina ---- */
  .detail-header{
    display:flex;
    align-items:center;
    gap: 18px;
    flex-wrap: wrap;
    margin: 14px 0 16px;
  }
  .detail-subline{
    font-size: 12.5px;
    font-weight: 700;
    color: #8a7a6b;
    margin-top: 2px;
  }
  .detail-actions{
    margin-left: auto;
    display:flex;
    gap: 8px;
  }
  .detail-desc{
    font-size: 14px;
    line-height: 1.6;
    color: #4b3f36;
    margin-bottom: 14px;
  }
  .detail-meta-row{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* ---- mini quote kaart (detailpagina) ---- */
  .quote-mini-card{ text-align:center; }
  .quote-mini-card .mark{
    font-family: var(--font-display);
    font-size: 28px;
    opacity: .5;
    line-height: 1;
  }
  .quote-mini-card p{
    font-size: 13.5px;
    font-weight: 700;
    margin-top: 4px;
  }

  /* ---- modal (bevestiging verwijderen, herbruikbaar) ---- */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(43,35,32,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 100;
    animation: fadeIn .15s ease;
  }
  .modal-box{
    background: var(--card);
    border: var(--outline);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop);
    padding: 22px;
    max-width: 420px;
    width: 100%;
  }
  .modal-box h3{
    font-size: 19px;
    margin-bottom: 10px;
  }
  .modal-box p{
    font-size: 13.5px;
    line-height: 1.5;
    color: #4b3f36;

  /* =========================================================
     8. LORE MODULE (quotes + anecdotes kaart, add-formulier toggle)
  ========================================================= */

  /* =========================================================
     10. LEADERBOARDS MODULE (podium top 3 + ranglijst)
  ========================================================= */
  .podium{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap: 14px;
    flex-wrap: wrap;
    padding-top: 16px;
  }
  .podium-spot{

  }
  .podium-value{
    font-family: var(--font-display);
    font-size: 17px;
    margin-top: 6px;
  }

  .podium.compact .podium-title{ font-size: 12.5px; }
  .podium.compact .podium-value{ font-size: 14px; }
  .podium.compact .podium-medal{ font-size: 20px; }

  /* ranglijst-rijen (4+) mogen ook klikbaar zijn, zelfde .row-item */
  .row-item.clickable{ cursor:pointer; transition: transform .15s ease; }
  .row-item.clickable:hover{ transform: translateY(-2px); }

  /* =========================================================
     11. BEER XP / ABT LORD TROON (overdreven ceremonieel, Home)
  ========================================================= */
  .abt-throne{
    position: relative;
    text-align: center;
    padding: 34px 20px 26px;
    border-radius: var(--radius-lg);
    border: var(--outline);

    box-shadow: var(--shadow-pop);

  }

    gap: 10px;
    margin-top: 20px;
  }
  .abt-stat{
    background: rgba(255,255,255,.7);
    border: var(--outline-thin);
    border-radius: var(--radius-md);
    padding: 10px 6px;
  }
  .abt-stat .num{ font-family: var(--font-display); font-size: 22px; }
  .abt-stat .label{
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .3px;
    color: #6b4d1f;
  }
  .fallen-abt-badge{ margin-top: 16px; }

  .abt-throne-reigning{
    font-weight: 800;
    font-size: 12.5px;
    letter-spacing: .3px;
    color: #6b4d1f;
    margin-top: 2px;
  }
  .abt-throne-dynasty-stats{ margin-top: 10px; }
  .abt-throne-lead{
    margin-top: 14px;
    font-weight: 800;
    font-size: 12.5px;

  }

  }

  /* ---- The Abt Dynasty: vertical reign timeline ---- */
  .dynasty-timeline{
    position: relative;
    display:flex;
    flex-direction: column;
    gap: 18px;
    padding-left: 4px;
  }
  .dynasty-timeline::before{
    content: '';
    position: absolute;
    left: 27px;
    top: 6px;
    bottom: 6px;
    width: 3px;
    background: repeating-linear-gradient(180deg, var(--lilac-deep) 0, var(--lilac-deep) 6px, transparent 6px, transparent 12px);
  }
  .dynasty-entry{
    position: relative;
    display:flex;
    align-items:flex-start;
    gap: 14px;
    z-index: 1;
  }
  .dynasty-avatar{ flex: 0 0 auto; }
  .dynasty-avatar .avatar-emoji, .dynasty-avatar .avatar-img{ background: var(--card); }
  .dynasty-info{
    background: var(--card);
    border: var(--outline-thin);
    border-radius: var(--radius-md);
    padding: 8px 14px;
    box-shadow: var(--shadow-pop-sm);
    flex: 1;
  }
  .dynasty-name{ font-family: var(--font-display); font-size: 15px; }
  .dynasty-length{ font-size: 12px; font-weight: 800; color: #6b5c4d; margin-top: 2px; }
  .dynasty-dates{ font-size: 11px; font-weight: 700; color: #8a7a6b; margin-top: 2px; }
  .dynasty-entry.current .dynasty-info{
    background: linear-gradient(135deg, var(--yellow), var(--peach));
    box-shadow: var(--shadow-pop);
  }
  .dynasty-entry.current .dynasty-length{ color: #6b4d1f; }

  /* ---- dramatic full-screen dethronement overlay ---- */
  .dynasty-overlay{
    position: fixed;
    inset: 0;
    z-index: 200;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 20%, rgba(255,201,60,.35), transparent 55%), rgba(43,35,32,.82);
    animation: fadeIn .2s ease;
  }
  .dynasty-overlay-confetti{
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .dynasty-confetti-piece{
    position: absolute;
    top: -40px;
    font-size: 26px;
    animation: confetti-fall 2.6s ease-in forwards;
  }
  @keyframes confetti-fall{
    0%{ transform: translateY(0) rotate(0deg); opacity: 1; }
    100%{ transform: translateY(110vh) rotate(340deg); opacity: 0; }
  }
  .dynasty-overlay-card{
    position: relative;
    z-index: 1;
    max-width: 440px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    text-align: center;
    background: linear-gradient(160deg, var(--yellow) 0%, var(--peach) 55%, var(--pink) 100%);
    border: var(--outline);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    padding: 30px 24px 26px;
    animation: crown-drop .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes crown-drop{
    0%{ transform: translateY(-40px) scale(.85); opacity: 0; }
    100%{ transform: translateY(0) scale(1); opacity: 1; }
  }
  .dynasty-overlay-crown{
    font-size: 54px;
    line-height: 1;
    animation: floaty 2.2s ease-in-out infinite;
  }
  .dynasty-overlay-title{
    font-family: var(--font-display);
    font-size: 24px;
    letter-spacing: .5px;
    color: #7a1f1f;
    text-shadow: 2px 2px 0 rgba(255,255,255,.5);
    margin-top: 8px;
  }
  .dynasty-overlay-headline{
    font-weight: 800;
    font-size: 13.5px;
    letter-spacing: .3px;
    color: #4b3f36;
    margin-top: 8px;

  .dynasty-overlay-battle{
    display:flex;
    flex-direction: column;
    gap: 8px;
    margin: 16px 0;
  }
  .dynasty-overlay-side{
    border: var(--outline-thin);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-family: var(--font-display);
    font-size: 15px;
    background: rgba(255,255,255,.6);
  }
  .dynasty-overlay-side.winner{ background: var(--mint); }
  .dynasty-overlay-side.loser{ background: rgba(255,255,255,.5); opacity: .85; }
  .dynasty-overlay-tagline{

    font-size: 12.5px;

    color: #6b4d1f;
    margin-top: 4px;

  .dynasty-overlay-newlord{
    font-family: var(--font-display);
    font-size: 18px;
    margin-top: 10px;
  }
  .dynasty-overlay-subtitle{
    font-style: italic;
    font-size: 13px;
    font-weight: 700;
    color: #6b4d1f;
    margin-top: 6px;
  }
  .dynasty-overlay-btn{ margin-top: 20px; }

  /* ---- Abt Dynasty HERO: the single most prestigious section on the
     Leaderboards page — deliberately bigger/richer than every other
     card on the page (thicker outline, bigger shadow, warm gradient,
     subtle glow pulse) so it reads as THE headline, not just another
     leaderboard. ---- */
  .dynasty-hero{

    background: linear-gradient(165deg, var(--yellow) 0%, var(--peach) 45%, var(--pink) 80%, var(--lilac) 100%);

    box-shadow: 7px 7px 0 var(--ink);
    padding: 28px 20px 24px;

    animation: dynasty-hero-glow 4s ease-in-out infinite;
  }
  @keyframes dynasty-hero-glow{
    0%, 100%{ box-shadow: 7px 7px 0 var(--ink), 0 0 0 rgba(255,201,60,0); }
    50%{ box-shadow: 7px 7px 0 var(--ink), 0 0 34px rgba(255,201,60,.55); }
  }
  .dynasty-hero-header{ text-align: center; margin-bottom: 18px; }
  .dynasty-hero-crown{
    font-size: 62px;
    line-height: 1;
    animation: floaty 3s ease-in-out infinite;
  }
  .dynasty-hero-title{
    font-family: var(--font-display);
    font-size: 30px;
    letter-spacing: 1.5px;
    text-shadow: 3px 3px 0 rgba(255,255,255,.5);

  }
  .dynasty-hero-tagline{
    font-style: italic;
    font-weight: 700;

    color: #6b4d1f;
    margin-top: 4px;

  .dynasty-hero-avatar .avatar-emoji, .dynasty-hero-avatar .avatar-img{
    border-width: 4px;
    box-shadow: var(--shadow-pop);
  }
  .dynasty-hero-name{ font-family: var(--font-display); font-size: 30px; }
  .dynasty-hero-subtitle{
    font-style: italic;
    font-size: 13.5px;
    font-weight: 700;
    color: #6b4d1f;
    margin-top: 4px;
  }
  .dynasty-hero-level{
    display:inline-block;
    margin-top: 10px;
    padding: 5px 16px;
    background: rgba(255,255,255,.7);
    border: var(--outline-thin);
    border-radius: 999px;
    font-weight: 800;
    font-size: 13px;
  }
  .dynasty-hero-xp{

    font-size: 44px;
    margin-top: 14px;
    color: #6b4d1f;
  }
  .dynasty-hero-xp span{

  .dynasty-hero-stats .dynasty-hero-stat{

  }
  .dynasty-hero-stats .num{ font-family: var(--font-display); font-size: 20px; }
  .dynasty-hero-stats .label{
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;

  }
  .dynasty-hero-lead{
    margin-top: 16px;

  }
  .dynasty-hero-lead.danger{

  .dynasty-hero .fallen-abt-badge{ margin-top: 14px; }
  .dynasty-hero .section{ margin-bottom: 14px; }
  .dynasty-hero .section:last-child{ margin-bottom: 0; }

  /* =========================================================
     12. PERFECT POUR / MASTER OF THE POUR
     (speelse bier-/schuim-animaties op de winnende podiumplek
     en op de stemknoppen in de sessiedetailpagina)
  ========================================================= */
  .podium-place-1.podium-beerify{
    background: linear-gradient(160deg, #ffe19a 0%, #fff8ea 60%, #ffd9d9 100%);
  }
  .podium-trophy{
    position:absolute;
    top: -28px;
    left:50%;
    transform: translateX(-50%);
    font-size: 30px;

<body>

<div class="app-shell">

  <!-- ============ TOPBAR: brand + user switcher ============ -->
  <header class="topbar">
    <div class="brand">
      <div class="logo-badge">🗂️</div>

      <!-- gevuld door JS: renderUserSwitcher() -- profielmenu (My Profile / Switch User) -->
    </div>
  </header>

  <!-- ============ MAIN NAV ============ -->
  <nav class="main-nav" id="main-nav">
    <!-- gevuld door JS: renderNav() -->
  </nav>

    <!-- gevuld door JS: renderPage() -->
  </main>

  <footer class="app-footer">Office Lore · intern speeltje, geen HR-document 🍻</footer>

<!-- gevuld door JS: openModal()/closeModal() -- herbruikbaar voor toekomstige modules -->
<div id="modal-root"></div>

<!-- gevuld door JS: openDramaticOverlay()/closeDramaticOverlay() -- full-screen Abt Dynasty moments -->
<div id="dynasty-overlay-root"></div>

<script>
/* =============================================================
   OFFICE LORE — APP FUNDAMENT
   -------------------------------------------------------------
   Modulaire opzet:
   - APP_DATA        : placeholder "database" (later te vervangen
                        door echte opslag / API calls)
   - MODULES         : één object per navigatie-item, elk met een
                        eigen render(data) functie die HTML teruggeeft.
                        Nieuwe features toevoegen = nieuwe module
                        schrijven of bestaande module uitbreiden,
                        zonder de rest te raken.
   - CURRENT_USER     : wie er "actief" is via de profiel-switcher.
   - Simpele router: leest state.activePage, toont bijhorende page.
   ============================================================= */

/* ---------- 1. DATA (Supabase-backed) ----------
   APP_DATA has the exact same shape the app always used (camelCase,
   nested usageLog/votes/reactions/entries arrays) so every render
   function below keeps working completely unchanged. The difference
   is that it now starts empty and gets populated by loadAppData()
   (see the SUPABASE DATA LAYER section right below) instead of being
   hardcoded here. */
let APP_DATA = {
  users: [],
  nicknames: [],
  quotes: [],
  anecdotes: [],
  counters: [],
  beers: [],
  beerSessions: [],
  abtReigns: [],
  standaloneBeerEntries: [],
};

/* ---------- 1b. SUPABASE CONFIG + CLIENT ----------
   The anon/public key is safe to expose in client code by design —
   Row Level Security (see supabase/0001_schema.sql) is the actual
   security boundary, not secrecy of this key. */
const SUPABASE_URL = 'https://pldhdsopdwmgvuvwdsta.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_BqEilTRoa09-UtJ_fNPheA_mhXqapM_';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- 1c. SUPABASE DATA LAYER ----------
   Fetches every table and reassembles APP_DATA in the exact shape the
   rest of the app expects. Called once after login, then again after
   every mutation and on every realtime event (see bottom of file). */
async function loadAppData(){
  const [
    profilesRes, nicknamesRes, nicknameEventsRes, nicknameVotesRes,
    quotesRes, quoteReactionsRes, anecdotesRes, anecdoteReactionsRes,
    countersRes, counterEventsRes,
    beersRes, beerSessionsRes, participantsRes, ratingsRes, consumptionRes, pourRes,
    abtReignsRes,
  ] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('nicknames').select('*'),
    sb.from('nickname_events').select('*'),
    sb.from('nickname_votes').select('*'),
    sb.from('quotes').select('*'),
    sb.from('quote_reactions').select('*'),
    sb.from('anecdotes').select('*'),
    sb.from('anecdote_reactions').select('*'),
    sb.from('counters').select('*'),
    sb.from('counter_events').select('*'),
    sb.from('beers').select('*'),
    sb.from('beer_sessions').select('*'),
    sb.from('beer_session_participants').select('*'),
    sb.from('beer_ratings').select('*'),
    sb.from('beer_consumption').select('*'),
    sb.from('perfect_pours').select('*'),
    sb.from('abt_reigns').select('*'),
  ]);

  for (const res of [
    profilesRes, nicknamesRes, nicknameEventsRes, nicknameVotesRes,
    quotesRes, quoteReactionsRes, anecdotesRes, anecdoteReactionsRes,
    countersRes, counterEventsRes,
    beersRes, beerSessionsRes, participantsRes, ratingsRes, consumptionRes, pourRes,
    abtReignsRes,
  ]){
    if (res.error) { console.error('Supabase load error:', res.error); throw res.error; }
  }

  const users = (profilesRes.data || []).map(p => ({
    id: p.id,
    firstName: p.first_name,
    displayName: p.display_name,
    profileNickname: p.profile_nickname,
    businessUnit: p.business_unit,
    jobTitle: p.job_title,
    bio: p.bio,
    avatarEmoji: p.avatar_emoji || '🙂',
    avatarColor: p.accent_color || 'var(--mint)',
    avatarPhoto: p.avatar_photo,
    createdAt: p.created_at,
    updatedAt: p.updated_at,
  }));

  const nicknames = (nicknamesRes.data || []).map(n => {
    const events = (nicknameEventsRes.data || []).filter(e => e.nickname_id === n.id);
    const votesForN = (nicknameVotesRes.data || []).filter(v => v.nickname_id === n.id);
    const votes = { funny: [], accurate: [], savage: [] };
    votesForN.forEach(v => { if (votes[v.vote_type]) votes[v.vote_type].push(v.user_id); });
    return {
      id: n.id,
      personRealName: n.person_real_name,
      businessUnit: n.business_unit,
      text: n.nickname,
      createdAt: n.created_at,
      updatedAt: n.updated_at,
      createdByUserId: n.created_by_user_id,
      description: n.description,
      anecdote: n.anecdote,
      status: n.status,
      xp: 10 + events.reduce((sum, e) => sum + e.xp_value, 0),
      usageCount: events.length,
      usageLog: events.map(e => ({ id: e.id, type: e.event_type, xp: e.xp_value, date: e.created_at, loggedBy: e.created_by_user_id })),
      votes,
    };
  });

  function buildReactions(rows, itemId, idField){
    const reactions = { funny: [], savage: [], facepalm: [] };
    rows.filter(r => r[idField] === itemId).forEach(r => { if (reactions[r.reaction_type]) reactions[r.reaction_type].push(r.user_id); });
    return reactions;
  }

  const quotes = (quotesRes.data || []).map(q => ({
    id: q.id,
    personRealName: q.person_real_name,
    businessUnit: q.business_unit,
    text: q.quote,
    context: q.context,
    date: q.created_at,
    addedBy: q.created_by_user_id,
    reactions: buildReactions(quoteReactionsRes.data || [], q.id, 'quote_id'),
    points: 5 + (q.all_three_bonus_awarded ? 5 : 0),
    allThreeBonusAwarded: q.all_three_bonus_awarded,
  }));

  const anecdotes = (anecdotesRes.data || []).map(a => ({
    id: a.id,
    personRealName: a.person_real_name,
    businessUnit: a.business_unit,
    title: a.title,
    description: a.description,
    date: a.created_at,
    addedBy: a.created_by_user_id,
    reactions: buildReactions(anecdoteReactionsRes.data || [], a.id, 'anecdote_id'),
    points: 5 + (a.all_three_bonus_awarded ? 5 : 0),
    allThreeBonusAwarded: a.all_three_bonus_awarded,
  }));

  const counters = (countersRes.data || []).map(c => {
    const events = (counterEventsRes.data || []).filter(e => e.counter_id === c.id);
    return {
      id: c.id,
      name: c.title,
      personRealName: c.person_real_name,
      businessUnit: c.business_unit,
      description: c.description,
      total: Math.max(0, events.reduce((sum, e) => sum + e.delta, 0)),
      dateCreated: c.created_at,
      createdBy: c.created_by_user_id,
      history: events.map(e => ({ id: e.id, delta: e.delta, by: e.registered_by_user_id, at: e.created_at, note: e.note })),
    };
  });

  const beers = (beersRes.data || []).map(b => ({
    id: b.id,
    name: b.name,
    brewery: b.brewery,
    style: b.beer_style,
    abv: b.alcohol_percentage,
    country: b.country,
    photo: b.image_url,
    dateAdded: b.created_at,
    addedBy: b.created_by_user_id,
  }));

  const beerSessions = (beerSessionsRes.data || []).map(s => {
    const ratings = (ratingsRes.data || []).filter(r => r.session_id === s.id);
    const consumption = (consumptionRes.data || []).filter(c => c.session_id === s.id);
    const key = (beerId, userId) => beerId + '::' + userId;
    const consumptionByKey = new Map(consumption.map(c => [key(c.beer_id, c.user_id), c]));
    const entryKeys = new Set([
      ...ratings.map(r => key(r.beer_id, r.user_id)),
      ...consumption.map(c => key(c.beer_id, c.user_id)),
    ]);
    const entries = Array.from(entryKeys).map(k => {
      const [beerId, userId] = k.split('::');
      const rating = ratings.find(r => r.beer_id === beerId && r.user_id === userId);
      const cons = consumptionByKey.get(k);
      const firstTime = !!cons && !(consumptionRes.data || []).some(c =>
        c.beer_id === beerId && c.user_id === userId && new Date(c.created_at) < new Date(cons.created_at));
      return {
        id: (rating && rating.id) || (cons && cons.id),
        beerId, userId,
        score: rating ? rating.rating : null,
        review: rating ? rating.review : '',
        quantity: cons ? cons.quantity : 0,
        firstTime,
      };
    });
    return {
      id: s.id,
      date: s.session_date,
      location: s.location,
      beerIds: Array.from(new Set(entries.map(e => e.beerId))),
      participantIds: (participantsRes.data || []).filter(p => p.session_id === s.id).map(p => p.user_id),
      loggedBy: s.created_by_user_id,
      entries,
      perfectPourVotes: (pourRes.data || []).filter(pp => pp.session_id === s.id)
        .map(pp => ({ id: pp.id, fromUserId: pp.given_by_user_id, toUserId: pp.received_by_user_id })),
    };
  });

  const abtReigns = (abtReignsRes.data || []).map(r => ({
    id: r.id,
    userId: r.user_id,
    startedAt: r.started_at,
    endedAt: r.ended_at,
    startingBeerXp: r.starting_beer_xp,
    endingBeerXp: r.ending_beer_xp,
    dethronedByUserId: r.dethroned_by_user_id,
  }));

  /* Standalone ratings/consumption: beer_ratings/beer_consumption rows
     with session_id = null ("Rate this beer" on the beer detail page,
     no Beer Session required). Kept as separate rating/consumption
     entries (not merged into one object like session entries are) —
     XP/stat functions just sum contributions per entry regardless, so
     this needs no changes to computeBeerXp/getBeerUserStats/etc. The
     quantity shown alongside a standalone rating in the UI is a
     best-effort match against a consumption row inserted within the
     same few seconds (both rows come from the same submit action) —
     cosmetic only, never relied on for XP (that's handled entirely by
     the existing session-agnostic DB triggers). */
  const standaloneConsumptionRows = (consumptionRes.data || []).filter(c => !c.session_id);
  const standaloneRatings = (ratingsRes.data || []).filter(r => !r.session_id).map(r => {
    const matchingConsumption = standaloneConsumptionRows.find(c =>
      c.beer_id === r.beer_id && c.user_id === r.user_id && Math.abs(new Date(c.created_at) - new Date(r.created_at)) < 5000);
    return {
      kind: 'rating', id: r.id, beerId: r.beer_id, userId: r.user_id,
      score: r.rating, review: r.review || '', quantity: matchingConsumption ? matchingConsumption.quantity : 0,
      firstTime: false, sessionDate: r.rated_at, context: r.context || '', createdAt: r.created_at,
    };
  });
  const standaloneConsumption = standaloneConsumptionRows.map(c => {
    const firstTime = !(consumptionRes.data || []).some(c2 =>
      c2.beer_id === c.beer_id && c2.user_id === c.user_id && new Date(c2.created_at) < new Date(c.created_at));
    return {
      kind: 'consumption', id: c.id, beerId: c.beer_id, userId: c.user_id,
      score: null, review: '', quantity: c.quantity, firstTime,
      sessionDate: c.created_at.slice(0, 10), createdAt: c.created_at,
    };
  });
  const standaloneBeerEntries = [...standaloneRatings, ...standaloneConsumption];

  APP_DATA = { users, nicknames, quotes, anecdotes, counters, beers, beerSessions, abtReigns, standaloneBeerEntries };
}

/* Debounced "refetch everything + redraw" — used after every mutation
   and by the realtime subscription. Simple over granular on purpose. */
let refreshInFlight = null;
async function refreshAppData(){
  if (!refreshInFlight) refreshInFlight = loadAppData().finally(() => { refreshInFlight = null; });
  await refreshInFlight;
}

/* ---------- 1d. REALTIME ----------
   One channel across every domain table. Any insert/update/delete on
   any of them -> debounce ~150ms -> refetch everything -> redraw the
   current page. Simple over granular, on purpose (see SUPABASE_SETUP.md). */
const REALTIME_TABLES = [
  'nicknames', 'nickname_events', 'nickname_votes',
  'quotes', 'quote_reactions', 'anecdotes', 'anecdote_reactions',
  'counters', 'counter_events',
  'beers', 'beer_sessions', 'beer_session_participants', 'beer_ratings', 'beer_consumption', 'perfect_pours',
  'abt_reigns',
];
let realtimeChannel = null;
let realtimeDebounceTimer = null;

function subscribeRealtime(){
  if (realtimeChannel) return;
  realtimeChannel = sb.channel('office-lore-changes');
  REALTIME_TABLES.forEach(table => {
    realtimeChannel.on('postgres_changes', { event: '*', schema: 'public', table }, onRealtimeChange);
  });
  // dedicated listener: a reign row is only ever UPDATEd once, exactly
  // when it's closed by a dethronement (dethroned_by_user_id gets set
  // then and never touched again) — this only fires for genuinely live
  // events since the listener is registered after the initial load
  realtimeChannel.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'abt_reigns' }, onAbtReignClosed);
  realtimeChannel.subscribe();
}

function unsubscribeRealtime(){
  if (!realtimeChannel) return;
  sb.removeChannel(realtimeChannel);
  realtimeChannel = null;
}

function onRealtimeChange(){
  clearTimeout(realtimeDebounceTimer);
  realtimeDebounceTimer = setTimeout(async () => {
    if (!STATE.activeUser) return;
    await refreshAppData();
    renderApp();
  }, 150);
}

/* live dethronement -> one-time full-screen "THE THRONE HAS FALLEN" moment.
   Only reacts to real-time events (registered after the initial load),
   so a page refresh/re-login never replays a past dethronement. */
let lastShownDethronementReignId = null;
async function onAbtReignClosed(payload){
  const row = payload.new;
  if (!row || !row.dethroned_by_user_id) return; // an edit unrelated to a dethronement
  if (lastShownDethronementReignId === row.id) return; // avoid duplicate realtime deliveries
  lastShownDethronementReignId = row.id;

  if (!STATE.activeUser) return;
  await refreshAppData();
  renderApp();
  showDethronementOverlay(row.user_id, row.dethroned_by_user_id, row.ending_beer_xp);
}

/* ---------- 2. APP STATE ---------- */
const STATE = {
  activePage: 'home',
  activeUser: null, // null = nog niet ingelogd -> loginscherm wordt getoond
};

/* ---------- 2b. AUTH STATE + FLOW ----------
   activeUser is now driven by a real Supabase Auth session instead of
   the old local "Who enters the Lore?" picker. AUTH_STATE only tracks
   UI concerns (login form error, forgot-password mode, recovery mode);
   the actual session lives in Supabase and survives refresh/devices. */
const AUTH_STATE = {
  loading: true,       // true while we're checking for an existing session on first load
  error: '',
  mode: 'login',        // 'login' | 'signup' | 'forgot' | 'recovery'
  forgotSent: false,
  signupSent: false,    // true once signUp succeeded and we're waiting on email confirmation
};

async function initAuth(){
  // Supabase puts recovery tokens in the URL hash after a password-reset redirect.
  if (window.location.hash.includes('type=recovery')) AUTH_STATE.mode = 'recovery';

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY'){ AUTH_STATE.mode = 'recovery'; renderApp(); return; }
    if (event === 'SIGNED_OUT'){ STATE.activeUser = null; renderApp(); return; }
    if (session && event === 'SIGNED_IN'){ handleSignedIn(session); }
  });

  const { data: { session } } = await sb.auth.getSession();
  AUTH_STATE.loading = false;
  if (session && AUTH_STATE.mode !== 'recovery'){
    await handleSignedIn(session);
  } else {
    renderApp();
  }
}

/* ---------- PERSISTENT NAVIGATION STATE ----------
   Remembers which page (and, for Beer Club, which subtab) the user
   was on, so a refresh/re-open/data-reload returns them there instead
   of always dumping them back on Home. Saved on every renderPage()
   call (so it always reflects whatever's actually on screen, and
   realtime-triggered re-renders never change it since they never
   touch STATE.activePage themselves) and restored once, right after
   login, before the first render. Deep-link sub-views that depend on
   a specific record (beerDetail/sessionForm/sessionDetail, or a
   Counter's history view) are deliberately NOT persisted — those fall
   back to their parent list, since the record they pointed at may no
   longer exist by the time the user comes back. */
const NAV_STATE_STORAGE_KEY = 'officeLoreNavState';
const PERSISTABLE_PAGES = ['home', 'nicknames', 'lore', 'counters', 'beerclub', 'leaderboards', 'myprofile'];
const PERSISTABLE_BEER_VIEWS = ['database', 'sessions', 'leaderboards'];

/* deep-link views normaliseren naar hun bovenliggende tab (het record
   waar ze naar wijzen bestaat mogelijk niet meer bij terugkomst) */
function normalizeBeerViewForPersistence(view){
  if (view === 'beerDetail') return 'database';
  if (view === 'sessionDetail' || view === 'sessionForm') return 'sessions';
  return PERSISTABLE_BEER_VIEWS.includes(view) ? view : 'database';
}

function saveNavState(){
  if (!PERSISTABLE_PAGES.includes(STATE.activePage)) return;
  const navState = { page: STATE.activePage };
  if (STATE.activePage === 'beerclub'){
    navState.beerView = normalizeBeerViewForPersistence(BEER_STATE.view);
  }
  try { localStorage.setItem(NAV_STATE_STORAGE_KEY, JSON.stringify(navState)); } catch (e) { /* storage unavailable (private browsing etc.) -> just skip persisting */ }
}

function restoreNavState(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(NAV_STATE_STORAGE_KEY)); } catch (e) { saved = null; }

  if (saved && PERSISTABLE_PAGES.includes(saved.page) && MODULES[saved.page]){
    STATE.activePage = saved.page;
    if (saved.page === 'beerclub' && PERSISTABLE_BEER_VIEWS.includes(saved.beerView)){
      BEER_STATE.view = saved.beerView;
    }
  } else {
    STATE.activePage = 'home'; // onbekende/niet-meer-bestaande route -> terug naar Home
  }
}

function clearNavState(){
  try { localStorage.removeItem(NAV_STATE_STORAGE_KEY); } catch (e) { /* ignore */ }
}

async function handleSignedIn(session){
  await refreshAppData();
  STATE.activeUser = session.user.id;
  restoreNavState();
  subscribeRealtime();
  renderApp();
}

async function submitLoginForm(event){
  event.preventDefault();
  const form = event.target;
  const email = form.email.value.trim();
  const password = form.password.value;
  AUTH_STATE.error = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ AUTH_STATE.error = 'Inloggen mislukt: e-mail of wachtwoord klopt niet.'; renderApp(); return; }
  // onAuthStateChange -> handleSignedIn() handles the rest
}

async function submitSignupForm(event){
  event.preventDefault();
  const form = event.target;
  const email = form.email.value.trim();
  const password = form.password.value;
  AUTH_STATE.error = '';
  if (password.length < 6){ AUTH_STATE.error = 'Wachtwoord moet minstens 6 tekens hebben.'; renderApp(); return; }
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error){ AUTH_STATE.error = 'Registreren mislukt: ' + (error.message === 'User already registered' ? 'dit e-mailadres heeft al een account.' : 'probeer opnieuw.'); renderApp(); return; }
  if (data.session){
    // e-mailbevestiging staat uit in dit project -> meteen ingelogd
    await handleSignedIn(data.session);
  } else {
    // e-mailbevestiging staat aan -> pas ingelogd na het klikken van de link in de mail
    AUTH_STATE.signupSent = true;
    renderApp();
  }
}

async function submitForgotPasswordForm(event){
  event.preventDefault();
  const form = event.target;
  const email = form.email.value.trim();
  AUTH_STATE.error = '';
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  if (error){ AUTH_STATE.error = 'Kon geen reset-mail versturen. Controleer het e-mailadres.'; renderApp(); return; }
  AUTH_STATE.forgotSent = true;
  renderApp();
}

async function submitNewPasswordForm(event){
  event.preventDefault();
  const form = event.target;
  const password = form.password.value;
  AUTH_STATE.error = '';
  const { error } = await sb.auth.updateUser({ password });
  if (error){ AUTH_STATE.error = 'Kon wachtwoord niet bijwerken. Probeer opnieuw.'; renderApp(); return; }
  window.location.hash = '';
  AUTH_STATE.mode = 'login';
  const { data: { session } } = await sb.auth.getSession();
  if (session) await handleSignedIn(session);
  else renderApp();
}

function goToForgotPassword(){ AUTH_STATE.mode = 'forgot'; AUTH_STATE.error = ''; AUTH_STATE.forgotSent = false; renderApp(); }
function goToSignup(){ AUTH_STATE.mode = 'signup'; AUTH_STATE.error = ''; AUTH_STATE.signupSent = false; renderApp(); }
function backToLogin(){ AUTH_STATE.mode = 'login'; AUTH_STATE.error = ''; renderApp(); }

async function logout(){
  unsubscribeRealtime();
  clearNavState(); // een volgende login (zelfde of andere user) start weer op Home, niet op de oude route
  await sb.auth.signOut();
}

function el(html){

function emptyState(msg){

function escapeHtml(str){
  if (str === null || str === undefined) return '';
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function truncate(str, n){
  if (!str) return '';
  return str.length > n ? str.slice(0, n).trim() + '…' : str;
}

/* Veilig een vrije-tekstwaarde (bv. personRealName) binnen een
   inline onclick="...('...')"-string plaatsen. */
function escapeJs(str){
  if (str === null || str === undefined) return '';
  return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function uid(prefix){

   Toont een geüploade foto als die er is, anders het gekozen emoji-avatar. */

   voor de echte naam van een collega (met datalist-suggesties op

/* Deterministisch, puur visueel "avatarje" op basis van een vrije
   naam-string — niets wordt hiervoor opgeslagen, alleen berekend op
   basis van de tekst zelf (zelfde naam = zelfde kleur/letter). */
function initialsAvatarHtml(name, size){
  const safeName = (name || '?').trim();
  const letter = safeName.charAt(0).toUpperCase() || '?';
  let hash = 0;
  for (let i = 0; i < safeName.length; i++) hash = (hash * 31 + safeName.charCodeAt(i)) >>> 0;
  const color = AVATAR_COLORS[hash % AVATAR_COLORS.length].value;
  return `<div class="avatar-emoji" style="width:${size}px;height:${size}px;background:${color};font-size:${Math.round(size * 0.42)}px;font-family:'Fredoka',sans-serif;font-weight:600;">${letter}</div>`;
}

/* Lore Score = som van alle sub-systemen die een user heeft
   BIJGEDRAGEN aan Office Lore: nickname-XP, quote-punten,
   anekdote-punten en counter-events die hij/zij zelf toevoegde
   (createdByUserId / addedBy / createdBy). Nicknames/quotes/
   anekdotes/counters gaan over collega's (vrije tekst), niet over
   de 3 users — de Lore Score meet dus wie het meest bijdraagt aan de
   lore, niet over wie de meeste lore gaat. */
function computeLoreScore(person){
  const nicknamePoints = getUserNicknames(person.id).reduce((sum, n) => sum + n.xp, 0);
  const quotePoints = getUserQuotes(person.id).reduce((sum, q) => sum + q.points, 0);
  const anecdotePoints = getUserAnecdotes(person.id).reduce((sum, a) => sum + a.points, 0);
  const counterPoints = getUserCounters(person.id).reduce((sum, c) => sum + c.total, 0);
  return nicknamePoints + quotePoints + anecdotePoints + counterPoints;
}

/* ---------- NICKNAMES: helpers ---------- */
/* "Bijgedragen door" (createdByUserId) — NIET "over wie". Nicknames
   gaan over collega's op kantoor (personRealName, vrije tekst). */
function getUserNicknames(userId){
  return APP_DATA.nicknames.filter(n => n.createdByUserId === userId);
}

function nicknamePopularity(n){
  return n.votes.funny.length + n.votes.accurate.length + n.votes.savage.length;
}

/* Alle groepen van nicknames die exact dezelfde "personRealName"
   delen — dit is PUUR visuele groepering bij het renderen, er wordt
   nergens een person-/colleague-record voor aangemaakt of bewaard.
   Alles hieronder wordt live herberekend uit APP_DATA.nicknames. */
function getNicknameRealNameGroups(list){
  const source = list || APP_DATA.nicknames;
  const order = [];
  const map = {};
  source.forEach(n => {
    const key = (n.personRealName || '').trim() || 'Onbekend';
    if (!map[key]){ map[key] = []; order.push(key); }
    map[key].push(n);
  });
  return order.map(name => {
    const items = [...map[name]].sort((a, b) => (nicknamePopularity(b) - nicknamePopularity(a)) || (b.xp - a.xp));
    const totalXp = items.reduce((sum, n) => sum + n.xp, 0);
    const businessUnit = items.find(n => n.businessUnit)?.businessUnit || null;
    return { name, nicknames: items, count: items.length, totalXp, topNickname: items[0], businessUnit };
  });
}

/* Alle unieke "personRealName"-waarden die al ooit gebruikt zijn,
   over nicknames/quotes/anekdotes/counters heen — puur om als
   suggesties (datalist) te tonen in formulieren, geen opgeslagen
   entiteit. */
function getKnownRealNames(){
  const names = new Set();
  APP_DATA.nicknames.forEach(n => n.personRealName && names.add(n.personRealName));
  APP_DATA.quotes.forEach(q => q.personRealName && names.add(q.personRealName));
  APP_DATA.anecdotes.forEach(a => a.personRealName && names.add(a.personRealName));
  APP_DATA.counters.forEach(c => c.personRealName && names.add(c.personRealName));
  return [...names].sort((a, b) => a.localeCompare(b));
}

/* Unieke Business Units die al gebruikt zijn op nicknames, voor het
   filter-dropdown op de Nicknames-tab. */
function getKnownNicknameBusinessUnits(){
  const units = new Set();
  APP_DATA.nicknames.forEach(n => n.businessUnit && units.add(n.businessUnit));
  return [...units].sort((a, b) => a.localeCompare(b));
}

/* Past NICKNAME_FILTER_STATE (zoekterm + 3 filters) toe op
   APP_DATA.nicknames. Zoekterm matcht op nickname-tekst, echte naam
   en business unit. */
function getFilteredNicknames(){
  const q = NICKNAME_FILTER_STATE.search.trim().toLowerCase();
  return APP_DATA.nicknames.filter(n => {
    if (q){
      const haystack = `${n.text} ${n.personRealName || ''} ${n.businessUnit || ''}`.toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    if (NICKNAME_FILTER_STATE.businessUnit && n.businessUnit !== NICKNAME_FILTER_STATE.businessUnit) return false;
    if (NICKNAME_FILTER_STATE.createdBy && n.createdByUserId !== NICKNAME_FILTER_STATE.createdBy) return false;
    if (NICKNAME_FILTER_STATE.level && getNicknameLevelInfo(n.xp).level.label !== NICKNAME_FILTER_STATE.level) return false;
    return true;
  });
}

/* De kaarten-grid van de Nicknames-tab: gefilterd + visueel
   gegroepeerd op exacte "personRealName"-match. Los gehouden van de
   rest van de pagina (filter bar) zodat alleen dit stuk opnieuw

function getTopNicknames(count){
  return [...APP_DATA.nicknames]
    .sort((a, b) => (nicknamePopularity(b) - nicknamePopularity(a)) || (b.xp - a.xp))
    .slice(0, count);
}

function getNicknameLevelInfo(xp){
  const idx = NICKNAME_LEVELS.findIndex(l => xp >= l.min && xp <= l.max);
  const level = NICKNAME_LEVELS[idx === -1 ? NICKNAME_LEVELS.length - 1 : idx];
  const next = NICKNAME_LEVELS[NICKNAME_LEVELS.indexOf(level) + 1] || null;
  if (!next){
    return { level, next: null, progressPct: 100, xpToNext: 0 };
  }
  const span = next.min - level.min;
  const progressed = xp - level.min;
  const progressPct = Math.max(0, Math.min(100, Math.round((progressed / span) * 100)));
  return { level, next, progressPct, xpToNext: next.min - xp };
}

function statusBadgeClass(status){

  return ''; // Actief -> standaard (mint)

/* "Aangemaakt door" (createdBy) — NIET "over wie". Counters gaan over

/* Abt Dynasty ceremonial dates are deliberately in English, matching
   the existing Abt Lord flourishes ("May his glass never run dry.") —
   the rest of the app's UI stays Dutch. */
function formatNiceDate(iso){
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

function formatDateTime(iso){
  const d = new Date(iso);
  const datePart = iso.slice(0, 10);
  const timePart = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  return `${datePart} ${timePart}`;
}

function getLastRegistration(counter){
  if (!counter.history.length) return null;
  return [...counter.history].sort((a, b) => b.at.localeCompare(a.at))[0];
}

/* Wie de knop het vaakst indrukte (aantal registraties, los van +1/-1). */
function getMostFrequentRegistrant(counter){
  const counts = {};
  counter.history.forEach(h => { counts[h.by] = (counts[h.by] || 0) + 1; });
  let best = null;
  Object.entries(counts).forEach(([userId, count]) => {
    if (!best || count > best.count) best = { userId, count };
  });
  return best;
}

/* Netto bijdrage + aantal registraties per vaste gebruiker (voor de historiekpagina). */
function getCounterUserTotals(counter){
  return APP_DATA.users.map(u => {
    const entries = counter.history.filter(h => h.by === u.id);
    const total = entries.reduce((sum, h) => sum + h.delta, 0);
    return { user: u, total, registrations: entries.length };
  });
}

function getStartOfWeekISO(){
  const now = new Date();
  const day = now.getDay(); // 0 = zondag
  const diffToMonday = day === 0 ? 6 : day - 1;
  const monday = new Date(now);
  monday.setDate(now.getDate() - diffToMonday);
  return monday.toISOString().slice(0, 10);
}

function getRegistrationsToday(counter){
  const today = todayISO();
  return counter.history.filter(h => h.at.slice(0, 10) === today).length;
}

function getRegistrationsThisWeek(counter){
  const startOfWeek = getStartOfWeekISO();
  return counter.history.filter(h => h.at.slice(0, 10) >= startOfWeek).length;
}

/* Persoonlijk record per dag: hoogste aantal registraties dat één
   gebruiker ooit op één kalenderdag deed voor deze counter. */
function getPersonalDailyRecords(counter){
  const byUserDate = {};
  counter.history.forEach(h => {
    const date = h.at.slice(0, 10);
    byUserDate[h.by] = byUserDate[h.by] || {};
    byUserDate[h.by][date] = (byUserDate[h.by][date] || 0) + 1;
  });
  return APP_DATA.users.map(u => {
    const values = Object.values(byUserDate[u.id] || {});
    return { user: u, record: values.length ? Math.max(...values) : 0 };
  });
}

   Bieren/sessies zijn gekoppeld aan APP_DATA.users (de 3 vaste
   gebruikers), niet aan People. Alles hieronder is puur berekening,

function isDuplicateBeer(name, brewery, excludeId){
  const normName = name.trim().toLowerCase();
  const normBrewery = (brewery || '').trim().toLowerCase();
  return APP_DATA.beers.some(b =>
    b.id !== excludeId &&
    b.name.trim().toLowerCase() === normName &&
    (b.brewery || '').trim().toLowerCase() === normBrewery
  );
}

/* Alle score/review/aantal-regels voor één bier, over alle sessies heen. */
function getBeerEntries(beerId){
  const entries = [];
  APP_DATA.beerSessions.forEach(s => {
    s.entries.filter(e => e.beerId === beerId).forEach(e => entries.push({ ...e, sessionId: s.id, sessionDate: s.date }));
  });
  APP_DATA.standaloneBeerEntries.filter(e => e.beerId === beerId).forEach(e => entries.push({ ...e, sessionId: null }));
  return entries;
}

/* Alleen de losse ratings (géén sessie) voor dit bier, nieuwste eerst
   — gebruikt op de bierdetailpagina. */
function getStandaloneRatingsForBeer(beerId){
  return APP_DATA.standaloneBeerEntries
    .filter(e => e.kind === 'rating' && e.beerId === beerId)
    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
}

function getBeerSessionsFor(beerId){
  return APP_DATA.beerSessions.filter(s => s.beerIds.includes(beerId)).sort((a, b) => b.date.localeCompare(a.date));
}

function getBeerAverageScore(beerId){
  const entries = getBeerEntries(beerId).filter(e => typeof e.score === 'number');
  if (!entries.length) return null;
  return Math.round((entries.reduce((sum, e) => sum + e.score, 0) / entries.length) * 10) / 10;
}

function getBeerTotalQuantity(beerId){
  return getBeerEntries(beerId).reduce((sum, e) => sum + (e.quantity || 0), 0);
}

function getBeerUniqueDrinkers(beerId){

}

/* Vaakste drinker = hoogste totaal aantal gedronken van dit bier. */
function getBeerMostFrequentDrinker(beerId){
  const totals = {};
  getBeerEntries(beerId).forEach(e => { totals[e.userId] = (totals[e.userId] || 0) + (e.quantity || 0); });
  let best = null;
  Object.entries(totals).forEach(([userId, qty]) => { if (!best || qty > best.qty) best = { userId, qty }; });
  return best;
}

/* Hoogste score = hoogste gemiddelde score die iemand aan dit bier gaf. */
function getBeerHighestScorer(beerId){
  const scoresByUser = {};
  getBeerEntries(beerId).forEach(e => {
    if (typeof e.score !== 'number') return;
    scoresByUser[e.userId] = scoresByUser[e.userId] || [];
    scoresByUser[e.userId].push(e.score);
  });
  let best = null;
  Object.entries(scoresByUser).forEach(([userId, scores]) => {
    const avg = Math.round((scores.reduce((s, v) => s + v, 0) / scores.length) * 10) / 10;
    if (!best || avg > best.avg) best = { userId, avg };
  });
  return best;
}

function getAllBeerEntries(){

   (niet aan een specifiek bier). Elke deelnemer mag per sessie
   maximaal 1 stem uitbrengen, nooit op zichzelf. Alles wordt
   opgeslagen als s.perfectPourVotes = [{id, fromUserId, toUserId}]
   zodat de historie per sessie permanent bewaard blijft. ---------- */
function getSessionVoteByUser(session, fromUserId){
  return session.perfectPourVotes.find(v => v.fromUserId === fromUserId) || null;
}

/* Alle Perfect Pour-stemmen die userId ooit ontving, over alle sessies heen. */
function getPerfectPourVotesReceivedBy(userId){
  const votes = [];
  APP_DATA.beerSessions.forEach(s => {
    s.perfectPourVotes.forEach(v => {
      if (v.toUserId === userId) votes.push({ ...v, sessionId: s.id, sessionDate: s.date });
    });
  });
  return votes;
}

function getTotalPerfectPoursReceived(userId){
  return getPerfectPourVotesReceivedBy(userId).length;
}

}

/* Ranking van de 3 vaste users op totaal ontvangen Perfect Pours,
   gebruikt door zowel de "Master of the Pour"-leaderboard als de
   Beer XP-berekening. */
function getMasterOfThePourRows(){
  return APP_DATA.users
    .map(u => ({ user: u, total: getTotalPerfectPoursReceived(u.id) }))
    .sort((a, b) => b.total - a.total);
}

/* Stem casten/verplaatsen/intrekken: klik nogmaals op dezelfde persoon
   om de stem in te trekken; klik op iemand anders om de stem te
   verplaatsen (max 1 stem per gebruiker per sessie, nooit op jezelf). */
async function castPerfectPourVote(sessionId, toUserId){
  const session = APP_DATA.beerSessions.find(s => s.id === sessionId);
  if (!session) return;
  const fromUserId = STATE.activeUser;
  if (fromUserId === toUserId) return; // niet op jezelf stemmen
  if (!session.participantIds.includes(fromUserId) || !session.participantIds.includes(toUserId)) return;

  const existing = session.perfectPourVotes.find(v => v.fromUserId === fromUserId);
  if (existing && existing.toUserId === toUserId){
    await sb.from('perfect_pours').delete().eq('id', existing.id);
  } else {
    // delete-then-insert (not update) so the XP trigger fires correctly for the new recipient
    if (existing) await sb.from('perfect_pours').delete().eq('id', existing.id);
    await sb.from('perfect_pours').insert({ session_id: sessionId, given_by_user_id: fromUserId, received_by_user_id: toUserId });
  }
  await refreshAppData();
  renderPage();
}

/* Meest herhaalde bier van userId: hoogste cumulatieve hoeveelheid
   van precies 1 bier, over alle sessies heen ("Most Loyal Drinker"). */
function getUserBeerLoyalty(userId){
  const totals = {};
  getAllBeerEntries().filter(e => e.userId === userId).forEach(e => {
    totals[e.beerId] = (totals[e.beerId] || 0) + (e.quantity || 0);
  });
  let best = null;
  Object.entries(totals).forEach(([beerId, qty]) => {
    if (!best || qty > best.qty) best = { beerId, qty };
  });
  if (!best) return null;
  const beer = APP_DATA.beers.find(b => b.id === best.beerId);
  return beer ? { beer, quantity: best.qty } : null;
}

/* Favoriete bier van userId: hoogste gemiddelde score die die
   gebruiker aan een bier gaf (tie-break: meest gedronken). */
function getUserFavoriteBeer(userId){
  const entries = getAllBeerEntries().filter(e => e.userId === userId && typeof e.score === 'number');
  if (!entries.length) return null;
  const byBeer = {};
  entries.forEach(e => {
    byBeer[e.beerId] = byBeer[e.beerId] || { scores: [], qty: 0 };
    byBeer[e.beerId].scores.push(e.score);
    byBeer[e.beerId].qty += (e.quantity || 0);
  });
  let best = null;
  Object.entries(byBeer).forEach(([beerId, v]) => {
    const avg = Math.round((v.scores.reduce((s, x) => s + x, 0) / v.scores.length) * 10) / 10;
    if (!best || avg > best.avg || (avg === best.avg && v.qty > best.qty)) {
      best = { beerId, avg, qty: v.qty };
    }
  });
  const beer = APP_DATA.beers.find(b => b.id === best.beerId);
  return beer ? { beer, avgScore: best.avg, quantity: best.qty } : null;
}

/* Bier met de hoogste ('high') of laagste ('low') gemiddelde score
   over alle drinkers heen (enkel bieren met minstens 1 score). */
function getExtremeRatedBeer(direction){
  let best = null;
  APP_DATA.beers.forEach(b => {
    const avg = getBeerAverageScore(b.id);
    if (avg === null) return;
    if (!best || (direction === 'high' ? avg > best.avg : avg < best.avg)) best = { beer: b, avg };
  });
  return best;
}

/* Bier met de hoogste totale gedronken hoeveelheid ("Most Consumed Beer"). */
function getMostConsumedBeer(){
  let best = null;
  APP_DATA.beers.forEach(b => {
    const qty = getBeerTotalQuantity(b.id);
    if (qty <= 0) return;
    if (!best || qty > best.qty) best = { beer: b, qty };

/* Grappige, datagedreven opmerkingen — enkel getoond als het patroon
   er echt is. Elke functie geeft null (niets te melden) of een tekst. */
function getSuspiciousQuotes(){
  const pairs = {};
  getAllBeerEntries().forEach(e => {
    if (typeof e.score !== 'number') return;
    const key = `${e.userId}__${e.beerId}`;
    pairs[key] = pairs[key] || { userId: e.userId, beerId: e.beerId, scores: [], qty: 0 };
    pairs[key].scores.push(e.score);
    pairs[key].qty += (e.quantity || 0);
  });
  const quotes = [];
  Object.values(pairs).forEach(p => {
    const avg = Math.round((p.scores.reduce((s, v) => s + v, 0) / p.scores.length) * 10) / 10;
    if (avg <= 7 && p.qty >= 8){
      const beer = APP_DATA.beers.find(b => b.id === p.beerId);
      if (!beer) return;
      quotes.push(`${resolveUserLabel(p.userId)} geeft ${escapeHtml(beer.name)} ${avg}/10 maar heeft er al ${p.qty}× van gedronken. Suspicious. 🕵️`);
    }
  });
  return quotes;
}

/* ---------- BEER XP: los systeem, gekoppeld aan de 3 vaste
   gebruikers (niet aan Lore XP/Lore Score). Alles hier wordt puur
   berekend uit APP_DATA.beers/beerSessions — geen losse teller. ---------- */
const BEER_XP_RULES = {
  perDrink: 1,          // elk gedronken bier (× aantal)
  newBeerTried: 3,       // een nieuw/uniek bier proberen (firstTime)
  ratingGiven: 2,        // een rating/review geven (elke registratie heeft een score)
  ownBeerAdopted: 5,      // eigen toegevoegd bier dat door >=2 gebruikers geprobeerd wordt
  perfectPour: 3,         // elke ontvangen Perfect Pour-stem (zie getTotalPerfectPoursReceived)
};

const BEER_LEVELS = [
  { min: 0,   max: 19,       label: 'The Novice',       icon: '🌰' },
  { min: 20,  max: 49,       label: 'Brother of Beer',  icon: '🍺' },
  { min: 50,  max: 99,       label: 'Abbey Disciple',   icon: '⛪' },
  { min: 100, max: 199,      label: 'Beer Monk',        icon: '🧎' },
  { min: 200, max: 349,      label: 'Grand Brewer',     icon: '🍻' },
  { min: 350, max: 499,      label: 'Abt Master',       icon: '🎖️' },
  { min: 500, max: Infinity, label: 'Abt Elite',        icon: '👑' },
];

function getBeerLevelInfo(xp){
  const idx = BEER_LEVELS.findIndex(l => xp >= l.min && xp <= l.max);
  const level = BEER_LEVELS[idx === -1 ? BEER_LEVELS.length - 1 : idx];
  const next = BEER_LEVELS[BEER_LEVELS.indexOf(level) + 1] || null;
  if (!next) return { level, next: null, progressPct: 100, xpToNext: 0 };
  const span = next.min - level.min;
  const progressPct = Math.max(0, Math.min(100, Math.round(((xp - level.min) / span) * 100)));
  return { level, next, progressPct, xpToNext: next.min - xp };
}

function computeBeerXp(userId){
  let xp = 0;
  getAllBeerEntries().forEach(e => {
    if (e.userId !== userId) return;
    xp += (e.quantity || 0) * BEER_XP_RULES.perDrink;
    if (e.firstTime) xp += BEER_XP_RULES.newBeerTried;
    if (typeof e.score === 'number' && e.score > 0) xp += BEER_XP_RULES.ratingGiven;
  });
  xp += getTotalPerfectPoursReceived(userId) * BEER_XP_RULES.perfectPour;
  APP_DATA.beers.forEach(b => {
    if (b.addedBy !== userId) return;
    const drinkers = new Set(getBeerEntries(b.id).map(e => e.userId));
    if (drinkers.size >= 2) xp += BEER_XP_RULES.ownBeerAdopted;
  });
  return xp;
}

function getBeerUserStats(userId){
  const entries = getAllBeerEntries().filter(e => e.userId === userId);
  const totalQuantity = entries.reduce((sum, e) => sum + (e.quantity || 0), 0);
  const uniqueBeers = new Set(entries.map(e => e.beerId)).size;
  const scored = entries.filter(e => typeof e.score === 'number');
  const avgRating = scored.length ? Math.round((scored.reduce((s, e) => s + e.score, 0) / scored.length) * 10) / 10 : null;
  const perfectPours = getTotalPerfectPoursReceived(userId);
  return { totalQuantity, uniqueBeers, avgRating, perfectPours };
}

   trg_check_abt_throne, which is the ONLY thing that ever writes to
   abt_reigns. The client only ever reads APP_DATA.abtReigns and
   derives everything below from it, same philosophy as
   computeBeerXp/computeLoreScore elsewhere in this file. */
const ABT_LORD_STATE = {
  currentLordId: null,
  fallenAbtId: null,
};

const FALLEN_ABT_WINDOW_DAYS = 7;

function refreshAbtLordState(){
  const current = APP_DATA.abtReigns.find(r => !r.endedAt);
  ABT_LORD_STATE.currentLordId = current ? current.userId : null;

  const endedReigns = [...APP_DATA.abtReigns].filter(r => r.endedAt).sort((a, b) => b.endedAt.localeCompare(a.endedAt));
  const mostRecentEnded = endedReigns[0];
  const daysSinceEnded = mostRecentEnded ? (Date.now() - new Date(mostRecentEnded.endedAt).getTime()) / 86400000 : Infinity;
  ABT_LORD_STATE.fallenAbtId = (mostRecentEnded && daysSinceEnded < FALLEN_ABT_WINDOW_DAYS && mostRecentEnded.userId !== ABT_LORD_STATE.currentLordId)
    ? mostRecentEnded.userId
    : null;
}

function getUserReignHistory(userId){
  return APP_DATA.abtReigns.filter(r => r.userId === userId).sort((a, b) => a.startedAt.localeCompare(b.startedAt));
}

function getAllReignsSorted(){
  return [...APP_DATA.abtReigns].sort((a, b) => a.startedAt.localeCompare(b.startedAt));
}

function getReignDays(reign){
  const end = reign.endedAt ? new Date(reign.endedAt) : new Date();
  const start = new Date(reign.startedAt);
  return Math.max(0, Math.floor((end - start) / 86400000));
}

function getLongestReignEver(userId){
  return getUserReignHistory(userId).reduce((max, r) => Math.max(max, getReignDays(r)), 0);
}

function getTotalDaysInPower(userId){
  return getUserReignHistory(userId).reduce((sum, r) => sum + getReignDays(r), 0);
}

function getThroneCaptureCount(userId){
  return getUserReignHistory(userId).length;
}

function getTimesDethroned(userId){
  return APP_DATA.abtReigns.filter(r => r.userId === userId && r.dethronedByUserId).length;
}

function getTimesDethronedOthers(userId){
  return APP_DATA.abtReigns.filter(r => r.dethronedByUserId === userId).length;
}

/* "The Sacred Records" — one titleholder per category, fully dynamic.
   null if nobody has ever held the throne yet. */
function getAbtRecords(){
  if (!APP_DATA.abtReigns.length) return null;
  const topBy = (fn) => APP_DATA.users
    .map(u => ({ user: u, value: fn(u.id) }))
    .sort((a, b) => b.value - a.value)[0];

  return {
    longestReign: topBy(getLongestReignEver),
    mostTotalDays: topBy(getTotalDaysInPower),
    mostCaptures: topBy(getThroneCaptureCount),
    mostSlaying: topBy(getTimesDethronedOthers),
    mostDethroned: topBy(getTimesDethroned),
  };
}

/* =============================================================
   LEADERBOARDS — automatisch berekend uit de bestaande data.
   -------------------------------------------------------------
   Geen eigen opgeslagen state: elk klassement wordt live opnieuw
   berekend uit APP_DATA (Users, Nicknames, Quotes, Anecdotes,
   Counters) telkens als de pagina rendert. LEADERBOARD_DEFS is de
   ene plek om een klassement toe te voegen/aan te passen — zowel de
   Leaderboards-pagina als de compacte Top 3 op Home lezen hieruit.
   ============================================================= */

/* ---- generieke ranking-helpers ---- */
function rankUsersBy(metricFn, opts = {}){
  return APP_DATA.users
    .map(u => ({ user: u, value: metricFn(u) }))
    .filter(e => opts.includeZero || e.value > 0)
    .sort((a, b) => b.value - a.value);
}

function rankNicknamesBy(metricFn, opts = {}){
  return APP_DATA.nicknames
    .map(n => ({ nickname: n, value: metricFn(n) }))
    .filter(e => opts.includeZero || e.value > 0)
    .sort((a, b) => b.value - a.value);
}

function daysSince(dateStr){
  const then = new Date(`${dateStr}T00:00:00`);
  const now = new Date();
  return Math.max(0, Math.floor((now - then) / (1000 * 60 * 60 * 24)));
}

/* XP per dag sinds aanmaak = hoe snel een nickname XP opbouwt. */
function nicknameXpPerDay(n){
  const days = Math.max(1, daysSince(n.createdAt));
  return Math.round((n.xp / days) * 10) / 10;
}

/* XP verdiend binnen de huidige kalendermaand (aanmaak-bonus telt
   mee als de nickname deze maand is ontstaan). */
function nicknameMonthlyXp(n){
  const monthPrefix = todayISO().slice(0, 7);
  let total = n.createdAt.slice(0, 7) === monthPrefix ? 10 : 0;
  n.usageLog.forEach(u => { if (u.date.slice(0, 7) === monthPrefix) total += u.xp; });
  return total;
}

/* ---- entries omzetten naar het generieke podium-formaat ----
   "personRef" wordt bewaard (i.p.v. al gerenderde avatar-HTML) zodat
   het podium en de ranglijst eronder elk hun eigen avatargrootte
   kunnen renderen via entryAvatarHtml(). Users dragen hun eigen
   avatar/displayName al rechtstreeks, dus personRef is gewoon de
   user zelf — geen apart adapter-object meer nodig. Als er geen
   subtitle wordt meegegeven, valt dit terug op de businessUnit
   (zelfde gedrag als vroeger op de People-gebaseerde boards). */
function userEntry(user, value, formatValue, subtitle){
  return {
    personRef: user,
    title: user.displayName,
    subtitle: subtitle !== undefined ? subtitle : user.businessUnit,
    value: formatValue(value),
    onClick: `goToUserLore('${user.id}')`,
  };
}

function nicknameEntry(nickname, value, formatValue){
  const name = nickname.personRealName || 'onbekend';
  return {
    personRef: null,
    title: nickname.text,
    subtitle: name,
    value: formatValue(value),
    onClick: nickname.personRealName ? `goToNicknamesFilteredByName('${escapeJs(nickname.personRealName)}')` : '',
  };
}

function entryAvatarHtml(entry, size){
  if (entry.personRef) return avatarHtml(entry.personRef, size);
  return `<div class="avatar-emoji" style="width:${size}px;height:${size}px;background:var(--mint);font-size:${Math.round(size * 0.4)}px">🏷️</div>`;
}

      if (BEER_STATE.view === 'beerDetail') return renderBeerDetailPage(data);
      if (BEER_STATE.view === 'sessionForm') return renderSessionFormPage(data);
      if (BEER_STATE.view === 'sessionDetail') return renderSessionDetailPage(data);

      const tabsHtml = `
        <div class="people-toolbar" style="margin-bottom:16px;">
          <button type="button" class="nav-btn ${BEER_STATE.view === 'database' ? 'active' : ''}" onclick="switchBeerTab('database')">🍺 Database</button>
          <button type="button" class="nav-btn ${BEER_STATE.view === 'sessions' ? 'active' : ''}" onclick="switchBeerTab('sessions')">📋 Sessions</button>
          <button type="button" class="nav-btn ${BEER_STATE.view === 'leaderboards' ? 'active' : ''}" onclick="switchBeerTab('leaderboards')">🏆 Leaderboards</button>
        </div>

      let body;
      if (BEER_STATE.view === 'sessions') body = renderBeerSessionsList(data);
      else if (BEER_STATE.view === 'leaderboards') body = renderBeerLeaderboardsPage(data);
      else body = renderBeerDatabase(data);

    }
  },

  leaderboards: {
    title: 'Leaderboards',
    subtitle: 'Automatisch berekende klassementen op basis van alle Office Lore-data.',
    render(data){
      const loreBoards = LEADERBOARD_DEFS.map(def => `
        <section class="section">
          <div class="section-head"><h3>${def.icon} ${def.title}</h3></div>
          ${renderPodium(def.build(), { crown: !!def.crown })}
        </section>
      `).join('');

      /* De bier-klassementen (Abt Lord, Beer King/Queen, Master of the
         Pour en meer) leven sinds de uitgebreide Beer Leaderboards
         allemaal samen op de Beer Club-pagina, ipv. hier verspreid te
         staan — vandaar deze doorverwijzing i.p.v. dubbele borden. */
      const beerPointer = `
        <section class="section">
          <div class="sticker-card" style="text-align:center; padding:26px 18px;">
            <div style="font-size:34px;">🍺🏆</div>
            <h3 style="margin:8px 0 4px;">Beer Leaderboards</h3>
            <p style="font-size:13px; color:#6b5c4d; max-width:440px; margin:0 auto 14px;">
              The Abt Lord, Beer King/Queen, Beer Explorer, Master of the Pour en nog 8 andere bier-klassementen wonen samen op de Beer Club-pagina.

      return loreBoards + beerPointer;

};

  const beerRank = rankUsersBy(u => computeBeerXp(u.id), { includeZero: true }).findIndex(e => e.user.id === user.id) + 1;

  const isFallenAbt = !isAbtLord && ABT_LORD_STATE.fallenAbtId === user.id;
  const pourRows = getMasterOfThePourRows();
  const isMasterOfPour = pourRows[0] && pourRows[0].total > 0 && pourRows[0].user.id === user.id;
  const awards = [];
  if (isAbtLord) awards.push({ icon: '👑', label: 'The Abt Lord' });
  if (isFallenAbt) awards.push({ icon: '💀', label: 'The Fallen Abt' });

        <div class="beer-stat"><div class="num">${getUserAnecdotes(user.id).length}</div><div class="label">Anekdotes</div></div>
