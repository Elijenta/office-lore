async function submitTerraceRating(eventId, locationId){
  const clamp = (v) => (v === null || isNaN(v)) ? null : Math.min(10, Math.max(1, v));
  const terraceRating = clamp(parseInt(document.getElementById('tr-terrace').value, 10));
  const beerSelectionRating = clamp(parseInt(document.getElementById('tr-beer').value, 10));
  const vibeRating = clamp(parseInt(document.getElementById('tr-vibe').value, 10));
  const existing = APP_DATA.terraceLocationRatings.find(r => r.terraceEventId === eventId && r.locationId === locationId && r.userId === STATE.activeUser);
  if (existing){
    await sb.from('terrace_location_ratings').update({ terrace_rating: terraceRating, beer_selection_rating: beerSelectionRating, vibe_rating: vibeRating }).eq('id', existing.id);
  } else {
    await sb.from('terrace_location_ratings').insert({
      terrace_event_id: eventId, location_id: locationId, user_id: STATE.activeUser,
      terrace_rating: terraceRating, beer_selection_rating: beerSelectionRating, vibe_rating: vibeRating,
    });
  }
  await refreshAppData();
  closeModal();
  renderPage();
}

/* ---- stats ---- */
const TERRACE_LEADERBOARD_DEFS = [
  {
    icon: '🍻', title: 'Most Visited Spot',
    build(){
      return getTerraceLocationStats().filter(s => s.visits > 0).sort((a, b) => b.visits - a.visits)
        .map(s => ({ title: s.location.name, subtitle: s.location.city || '', value: `${s.visits} visits` }));
    },
  },
  {
    icon: '📅', title: 'Most Active Month',
    build(){
      const counts = {};
      APP_DATA.terraceEvents.filter(e => e.status === 'confirmed').forEach(e => {
        const d = getTerraceEventPrimaryDate(e);
        if (!d) return;
        const month = d.slice(0, 7);
        counts[month] = (counts[month] || 0) + 1;
      });
      return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([month, count]) => ({
        title: new Date(month + '-01T00:00:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }),
        value: `${count} events`,
      }));
    },
  },
  {
    icon: '👑', title: 'Terrace Initiator',
    build(){ return rankUsersBy(u => APP_DATA.terraceEvents.filter(e => e.createdByUserId === u.id).length).map(e => userEntry(e.user, e.value, v => `${v} plans`)); },
  },
  {
    icon: '✅', title: 'Most Reliable',
    build(){
      return rankUsersBy(u => {
        const yesVotes = APP_DATA.terraceAvailability.filter(a => a.userId === u.id && a.status === 'yes').length;
        if (!yesVotes) return 0;
        const attended = APP_DATA.terraceAttendance.filter(a => a.userId === u.id && a.attended).length;
        return Math.round((attended / yesVotes) * 100);
      }).map(e => userEntry(e.user, e.value, v => `${v}%`));
    },
  },
  {
    icon: '🤔', title: 'King/Queen of Maybe',
    build(){ return rankUsersBy(u => APP_DATA.terraceAvailability.filter(a => a.userId === u.id && a.status === 'maybe').length).map(e => userEntry(e.user, e.value, v => `${v}× maybe`)); },
  },
  {
    icon: '❌', title: 'Professional Decliner',
    build(){ return rankUsersBy(u => APP_DATA.terraceAvailability.filter(a => a.userId === u.id && a.status === 'no').length).map(e => userEntry(e.user, e.value, v => `${v}× can't`)); },
  },
];

      <div class="profile-menu-dropdown" id="profile-menu-dropdown">
        <button type="button" onclick="closeProfileMenu(); goToPage('myprofile');">🙋 My Profile</button>
        <button type="button" onclick="closeProfileMenu(); logout();">🚪 Log out</button>
      </div>
    </div>
  `;
}

function toggleProfileMenu(event){
  if (event) event.stopPropagation();
  const dd = document.getElementById('profile-menu-dropdown');
  if (dd) dd.classList.toggle('open');
}

function closeProfileMenu(){
  const dd = document.getElementById('profile-menu-dropdown');
  if (dd) dd.classList.remove('open');
}

/* dropdown sluiten bij een klik ergens anders op de pagina */
document.addEventListener('click', (e) => {
  if (!e.target.closest('.profile-menu')) closeProfileMenu();
});

/* ---------- 6b. RENDER: login / forgot-password / recovery ----------
   Wordt getoond in plaats van de volledige app zolang er geen actieve
   Supabase-sessie is (STATE.activeUser === null). Vervangt het oude
   lokale "Who enters the Lore?"-gate-scherm door echte Supabase Auth. */
function renderGateScreen(){
  const root = document.getElementById('page-root');

  if (AUTH_STATE.loading){
    root.innerHTML = `<div class="gate-screen"><p class="gate-sub">Bezig met laden…</p></div>`;
    return;
  }

  if (AUTH_STATE.accessDenied){
    root.innerHTML = `
      <div class="gate-screen">
        <div class="gate-header">
          <div class="logo-badge" style="margin:0 auto;">🗂️</div>
          <h1>Nog geen toegang</h1>
          <p class="gate-sub">Je account bestaat, maar je hebt nog geen toegang tot Office Lore. Vraag een admin om je toe te voegen.</p>
        </div>
        <div class="modal-box" style="text-align:left; max-width:360px;">
          <div class="form-actions" style="justify-content:center;">
            <button type="button" class="btn" onclick="logout()">Uitloggen</button>
          </div>
        </div>
      </div>
    `;
    return;
  }

  if (AUTH_STATE.mode === 'recovery'){
    root.innerHTML = `
      <div class="gate-screen">
        <div class="gate-header">
          <div class="logo-badge" style="margin:0 auto;">🗂️</div>
          <h1>Nieuw wachtwoord</h1>
          <p class="gate-sub">Kies een nieuw wachtwoord voor je account.</p>
        </div>
        <div class="modal-box" style="text-align:left; max-width:360px;">
          <form onsubmit="submitNewPasswordForm(event)">
            <div class="form-field">
              <label class="form-label">Nieuw wachtwoord</label>
              <input class="form-input" type="password" name="password" required minlength="6" autocomplete="new-password" />
            </div>
            <div class="form-error">${escapeHtml(AUTH_STATE.error)}</div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Wachtwoord instellen</button>
            </div>
          </form>
        </div>
      </div>
    `;
    return;
  }

  if (AUTH_STATE.mode === 'signup'){
    root.innerHTML = `
      <div class="gate-screen">
        <div class="gate-header">
          <div class="logo-badge" style="margin:0 auto;">🗂️</div>
          <h1>Account aanmaken</h1>
          <p class="gate-sub">Registreer met je e-mail en een wachtwoord.</p>
        </div>
        <div class="modal-box" style="text-align:left; max-width:360px;">
          ${AUTH_STATE.signupSent ? `
            <p>Bijna klaar! Check je mailbox en klik op de bevestigingslink om je account te activeren.</p>
            <div class="form-actions"><button type="button" class="btn" onclick="backToLogin()">Terug naar inloggen</button></div>
          ` : `
            <form onsubmit="submitSignupForm(event)">
              <div class="form-field">
                <label class="form-label">E-mail</label>
                <input class="form-input" type="email" name="email" required autocomplete="email" />
              </div>
              <div class="form-field" style="margin-top:12px;">
                <label class="form-label">Wachtwoord</label>
                <input class="form-input" type="password" name="password" required minlength="6" autocomplete="new-password" />
              </div>
              <div class="form-error">${escapeHtml(AUTH_STATE.error)}</div>
              <div class="form-actions" style="justify-content:space-between; align-items:center;">
                <button type="button" class="btn btn-ghost btn-sm" onclick="backToLogin()">Al een account?</button>
                <button type="submit" class="btn btn-primary">Registreren</button>
              </div>
            </form>
          `}
        </div>
      </div>
    `;
    return;
  }

  if (AUTH_STATE.mode === 'forgot'){
    root.innerHTML = `
      <div class="gate-screen">
        <div class="gate-header">
          <div class="logo-badge" style="margin:0 auto;">🗂️</div>
          <h1>Wachtwoord vergeten</h1>
          <p class="gate-sub">Vul je e-mailadres in, dan sturen we een reset-link.</p>
        </div>
        <div class="modal-box" style="text-align:left; max-width:360px;">
          ${AUTH_STATE.forgotSent ? `
            <p>Als dit e-mailadres bestaat, is er een reset-link naartoe gestuurd. Check je mailbox.</p>
            <div class="form-actions"><button type="button" class="btn" onclick="backToLogin()">Terug naar inloggen</button></div>
          ` : `
            <form onsubmit="submitForgotPasswordForm(event)">
              <div class="form-field">
                <label class="form-label">E-mail</label>
                <input class="form-input" type="email" name="email" required autocomplete="email" />
              </div>
              <div class="form-error">${escapeHtml(AUTH_STATE.error)}</div>
              <div class="form-actions" style="justify-content:space-between;">
                <button type="button" class="btn btn-ghost btn-sm" onclick="backToLogin()">Terug</button>
                <button type="submit" class="btn btn-primary">Verstuur reset-link</button>
              </div>
            </form>
          `}
        </div>
      </div>
    `;
    return;
  }

  root.innerHTML = `
    <div class="gate-screen">
      <div class="gate-header">
        <div class="logo-badge" style="margin:0 auto;">🗂️</div>
        <h1>Office Lore</h1>
        <p class="gate-sub">Log in om verder te gaan.</p>
      </div>
      <div class="modal-box" style="text-align:left; max-width:360px;">
        <form onsubmit="submitLoginForm(event)">
          <div class="form-field">
            <label class="form-label">E-mail</label>
            <input class="form-input" type="email" name="email" required autocomplete="email" />
          </div>
          <div class="form-field" style="margin-top:12px;">
            <label class="form-label">Wachtwoord</label>
            <input class="form-input" type="password" name="password" required autocomplete="current-password" />
          </div>
          <div class="form-error">${escapeHtml(AUTH_STATE.error)}</div>
          <div class="form-actions" style="justify-content:space-between; align-items:center;">
            <button type="button" class="btn btn-ghost btn-sm" onclick="goToForgotPassword()">Wachtwoord vergeten?</button>
            <button type="submit" class="btn btn-primary">Inloggen</button>
          </div>
        </form>
        <p style="text-align:center; margin-top:14px; font-size:12.5px; font-weight:700; color:#8a7a6b;">
          Nog geen account? <a href="#" onclick="goToSignup(); return false;" style="color:var(--ink);">Registreren</a>
        </p>
      </div>
    </div>
  `;
}

/* ---------- 7. RENDER: nav ---------- */
function renderNav(){
  const mount = document.getElementById('main-nav');
  const terracePending = getTerracePendingVoteCount();
  mount.innerHTML = NAV_ITEMS.map(item => `
    <button class="nav-btn ${item.id === STATE.activePage ? 'active' : ''}" data-page="${item.id}">
      <span class="emoji">${item.emoji}</span>${item.label}${item.id === 'terrace' && terracePending > 0 ? `<span class="nav-badge-dot"></span>` : ''}
    </button>
  `).join('');

  mount.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.activePage = btn.dataset.page;
      renderNav();
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

/* ---------- 8. RENDER: active page ---------- */
function renderPage(){
  refreshAbtLordState(); // altijd actueel: The Abt Lord + The Fallen Abt
  refreshPoetLaureateState(); // altijd actueel: The Poet Laureate
  const root = document.getElementById('page-root');
  const mod = MODULES[STATE.activePage];
  if (!mod){
    root.innerHTML = emptyState('Deze pagina bestaat nog niet.');
    return;
  }
  saveNavState(); // onthoudt de huidige pagina (+ Beer Club-subtab) voor de volgende keer
  root.innerHTML = `
    <div class="page active">
      <div class="page-header">
        <h2>${mod.emoji || (NAV_ITEMS.find(n => n.id === STATE.activePage) || {}).emoji || '📄'} ${mod.title}</h2>
        <div class="sub">${mod.subtitle}</div>
      </div>
      ${mod.render(APP_DATA)}
    </div>
  `;
}

/* ---------- 9. RENDER: hele app (gate-screen of normale shell) ----------
   Zolang STATE.activeUser null is (bij eerste load, of na "Switch
   User") tonen we enkel het "Who enters the Lore?"-gate-scherm en
   blijven nav + profielmenu leeg/verborgen. */
function renderApp(){
  const mainNav = document.getElementById('main-nav');
  const switcherMount = document.getElementById('user-switcher');
  if (!STATE.activeUser){
    mainNav.innerHTML = '';
    switcherMount.innerHTML = '';
    renderGateScreen();
    return;
  }
  renderUserSwitcher();
  renderNav();
  renderPage();
}

/* ---------- 10. INIT ---------- */
initAuth();
</script>
