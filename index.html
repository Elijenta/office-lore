<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Office Lore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* =========================================================
     1. DESIGN TOKENS
     Alle kleuren / afmetingen hier zodat toekomstige modules
     dezelfde sticker-stijl automatisch overnemen.
  ========================================================= */
  :root{
    --ink: #2b2320;
    --paper: #fff8ef;
    --card: #ffffff;

    --pink: #ffd1e3;
    --pink-deep: #ff8fb3;
    --yellow: #ffe58a;
    --yellow-deep: #ffc93c;
    --mint: #b9f2d9;
    --mint-deep: #4fd8a2;
    --sky: #bfe3ff;
    --sky-deep: #6fb8ff;
    --lilac: #ddd0ff;
    --lilac-deep: #b39dff;
    --peach: #ffd6b8;
    --peach-deep: #ff9d5c;

    --outline: 3px solid var(--ink);
    --outline-thin: 2px solid var(--ink);
    --shadow-pop: 5px 5px 0 var(--ink);
    --shadow-pop-sm: 3px 3px 0 var(--ink);
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-sm: 12px;

    --font-display: 'Baloo 2', 'Comic Sans MS', cursive, sans-serif;
    --font-body: 'Nunito', system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background:
      radial-gradient(circle at 8% 12%, rgba(255,209,227,.5), transparent 40%),
      radial-gradient(circle at 92% 18%, rgba(191,227,255,.5), transparent 42%),
      radial-gradient(circle at 50% 95%, rgba(185,242,217,.45), transparent 45%),
      var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  h1,h2,h3,h4{ font-family: var(--font-display); margin: 0; }
  p{ margin: 0; }

  button{ font-family: var(--font-body); cursor: pointer; }

  ::selection{ background: var(--yellow-deep); }

  /* =========================================================
     2. LAYOUT SHELL
  ========================================================= */
  .app-shell{
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 20px 60px;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 22px;
    background: var(--card);
    border: var(--outline);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    margin-bottom: 22px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap: 12px;
  }

  .brand .logo-badge{
    display:flex;
    align-items:center;
    justify-content:center;
    width: 52px; height: 52px;
    font-size: 26px;
    background: var(--yellow);
    border: var(--outline);
    border-radius: 16px;
    box-shadow: var(--shadow-pop-sm);
    transform: rotate(-6deg);
    animation: wiggle 5s ease-in-out infinite;
  }

  .brand h1{
    font-size: 30px;
    letter-spacing: .5px;
  }

  .brand .tagline{
    font-size: 12.5px;
    font-weight: 700;
    color: #8a7a6b;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-top: 2px;
  }

  @keyframes wiggle{
    0%, 100%{ transform: rotate(-6deg); }
    50%{ transform: rotate(4deg); }
  }

  /* ---- user switcher (top-right) ---- */
  .user-switcher{
    display:flex;
    align-items:center;
    gap: 10px;
  }

  .user-switcher .label{
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8a7a6b;
    margin-right: 2px;
  }

  .user-pill{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 6px 14px 6px 6px;
    background: var(--card);
    border: var(--outline-thin);
    border-radius: 999px;
    box-shadow: var(--shadow-pop-sm);
    transition: transform .15s ease, background .15s ease;
    font-weight: 700;
    font-size: 13.5px;
    color: var(--ink);
  }

  .user-pill .avatar{
    width: 30px; height: 30px;
    display:flex; align-items:center; justify-content:center;
    border-radius: 50%;
    border: var(--outline-thin);
    font-size: 15px;
  }

  .user-pill:hover{ transform: translateY(-2px); }

  .user-pill.active{
    background: var(--mint);
    box-shadow: var(--shadow-pop);
    transform: translateY(-2px);
  }

  .user-pill.active .avatar{ background: #fff; }

  /* =========================================================
     3. MAIN NAVIGATION
  ========================================================= */
  .main-nav{
    display:flex;
    gap: 10px;
    overflow-x: auto;
    padding: 6px 4px 14px;
    margin-bottom: 8px;
    scrollbar-width: thin;
  }

  .main-nav::-webkit-scrollbar{ height: 6px; }
  .main-nav::-webkit-scrollbar-thumb{ background: var(--lilac-deep); border-radius: 10px; }

  .nav-btn{
    flex: 0 0 auto;
    display:flex;
    align-items:center;
    gap: 7px;
    padding: 10px 18px;
    background: var(--card);
    border: var(--outline-thin);
    border-radius: 999px;
    font-weight: 800;
    font-size: 14px;
    color: var(--ink);
    box-shadow: var(--shadow-pop-sm);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    white-space: nowrap;
  }

  .nav-btn:hover{ transform: translateY(-2px); }

  .nav-btn.active{
    background: var(--pink-deep);
    color: #fff;
    border-color: var(--ink);
  }

  .nav-btn .emoji{ font-size: 16px; }

  .nav-badge-dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--pink-deep);
    box-shadow: 0 0 0 2px var(--card);
  }
  .nav-btn.active .nav-badge-dot{ background: #fff; box-shadow: 0 0 0 2px var(--pink-deep); }

  /* =========================================================
     4. PAGE / SECTION SCAFFOLDING
  ========================================================= */
  .page{ display:none; animation: fadeIn .35s ease; }
  .page.active{ display:block; }

  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .page-header{
    margin: 6px 4px 20px;
  }

  .page-header h2{
    font-size: 26px;
  }

  .page-header .sub{
    font-size: 14px;
    color: #8a7a6b;
    font-weight: 700;
    margin-top: 4px;
  }

  .section{
    background: var(--card);
    border: var(--outline);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    padding: 20px 22px 24px;
    margin-bottom: 22px;
  }

  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .section-head h3{
    font-size: 19px;
    display:flex;
    align-items:center;
    gap: 8px;
  }

  .section-head .count-chip{
    background: var(--yellow);
    border: var(--outline-thin);
    border-radius: 999px;
    padding: 2px 12px;
    font-size: 12px;
    font-weight: 800;
  }

  .placeholder-note{
    font-size: 12px;
    font-weight: 700;
    color: #a9967f;
    background: #fff2de;
    border: 1.5px dashed #d8bfa0;
    border-radius: 10px;
    padding: 6px 10px;
  }

  /* =========================================================
     5. GRIDS & CARDS (herbruikbaar over modules)
  ========================================================= */
  .grid{
    display:grid;
    gap: 14px;
  }
  .grid.cols-auto{ grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .grid.cols-auto-wide{ grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .grid.cols-wide-lg{ grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

  .sticker-card{
    background: var(--card);
    border: var(--outline-thin);
    border-radius: var(--radius-md);
    padding: 14px;
    box-shadow: var(--shadow-pop-sm);
    transition: transform .15s ease, box-shadow .15s ease;
    position: relative;
  }
  .sticker-card:hover{
    transform: translateY(-3px) rotate(-0.4deg);
    box-shadow: 6px 6px 0 var(--ink);
  }

  /* nickname wall */
  .nick-card{ text-align:center; }
  .nick-card .avatar{
    width: 54px; height: 54px;
    margin: 0 auto 8px;
    display:flex; align-items:center; justify-content:center;
    font-size: 26px;
    border-radius: 50%;
    border: var(--outline-thin);
  }
  .nick-card .nickname{
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 700;
  }
  .nick-card .real-name{
    font-size: 11.5px;
    color: #8a7a6b;
    font-weight: 700;
    margin-top: 2px;
  }

  /* lore list */
  .lore-card{
    display:flex;
    flex-direction: column;
    gap: 6px;
  }
  .lore-card .meta{
    display:flex;
    align-items:center;
    gap: 8px;
    font-size: 11.5px;
    font-weight: 800;
    color: #8a7a6b;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .lore-card .title{ font-family: var(--font-display); font-size: 17px; }
  .lore-card .snippet{ font-size: 13.5px; line-height: 1.5; color: #4b3f36; }

  /* quote of the week */
  .quote-box{
    background: linear-gradient(135deg, var(--lilac), var(--sky));
    border: var(--outline);
    border-radius: var(--radius-md);
    padding: 26px 26px 20px;
    box-shadow: var(--shadow-pop-sm);
    position: relative;
    text-align: center;
  }
  .quote-box .mark{
    font-family: var(--font-display);
    font-size: 46px;
    line-height: 1;
    opacity: .6;
  }
  .quote-box .quote-text{
    font-family: var(--font-display);
    font-size: 21px;
    max-width: 560px;
    margin: 6px auto 12px;
  }
  .quote-box .quote-author{
    font-weight: 800;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .6px;
  }

  /* counters */
  .counter-card{
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .counter-card .icon{
    width: 44px; height: 44px;
    flex: 0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-size: 20px;
    border-radius: 14px;
    border: var(--outline-thin);
    background: var(--peach);
  }
  .counter-card .num{
    font-family: var(--font-display);
    font-size: 24px;
    line-height: 1;
  }
  .counter-card .label{
    font-size: 12px;
    font-weight: 700;
    color: #6b5c4d;
  }

  /* beer club */
  .beer-stats{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
  }
  .beer-stat{
    background: var(--yellow);
    border: var(--outline-thin);
    border-radius: var(--radius-md);
    padding: 16px;
    text-align:center;
    box-shadow: var(--shadow-pop-sm);
  }
  .beer-stat .num{ font-family: var(--font-display); font-size: 28px; }
  .beer-stat .label{ font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; color: #6b5c4d; }

  /* abt lord */
  .abt-lord-card{
    display:flex;
    align-items:center;
    gap: 18px;
    background: linear-gradient(135deg, var(--yellow), var(--peach));
    border: var(--outline);
    border-radius: var(--radius-md);
    padding: 20px;
    box-shadow: var(--shadow-pop-sm);
  }
  .abt-lord-card .crown{
    font-size: 42px;
    animation: floaty 3s ease-in-out infinite;
  }
  @keyframes floaty{
    0%, 100%{ transform: translateY(0) rotate(-4deg); }
    50%{ transform: translateY(-5px) rotate(4deg); }
  }
  .abt-lord-card .name{ font-family: var(--font-display); font-size: 22px; }
  .abt-lord-card .desc{ font-size: 12.5px; font-weight: 700; color: #6b5236; margin-top: 2px; }

  /* badges (herbruikbaar) */
  .badge{
    display:inline-flex;
    align-items:center;
    gap: 4px;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
    border: var(--outline-thin);
    background: var(--mint);
  }
  .badge.pink{ background: var(--pink); }
  .badge.sky{ background: var(--sky); }
  .badge.lilac{ background: var(--lilac); }
  .badge.peach{ background: var(--peach); }
  .badge.yellow{ background: var(--yellow); }
  .badge.grey{ background: #e7ddd0; }

  /* generic list rows (People / Leaderboards) */
  .row-list{ display:flex; flex-direction:column; gap: 10px; }
  .row-item{
    display:flex;
    align-items:center;
    gap: 14px;
    background: var(--card);
    border: var(--outline-thin);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    box-shadow: var(--shadow-pop-sm);
  }
  .row-item .rank{
    font-family: var(--font-display);
    font-size: 18px;
    width: 28px;
    text-align:center;
  }
  .row-item .avatar{
    width: 40px; height: 40px;
    border-radius: 50%;
    border: var(--outline-thin);
    display:flex; align-items:center; justify-content:center;
    font-size: 18px;
  }
  .row-item .info{ flex: 1; }
  .row-item .info .name{ font-weight: 800; font-size: 14.5px; }
  .row-item .info .sub{ font-size: 11.5px; color: #8a7a6b; font-weight: 700; }
  .row-item .value{
    font-family: var(--font-display);
    font-size: 17px;
  }

  /* empty-state (voor secties die nog geen data hebben) */
  .empty-state{
    text-align:center;
    padding: 26px 10px;
    color: #a9967f;
    font-weight: 700;
    font-size: 13.5px;
    border: 2px dashed #d8bfa0;
    border-radius: var(--radius-sm);
  }

  footer.app-footer{
    text-align:center;
    font-size: 11.5px;
    color: #a9967f;
    font-weight: 700;
    padding-top: 10px;
  }

  /* =========================================================
     6. PEOPLE MODULE (kaarten, formulier, detail, modal)
     Herbruikbare bouwstenen (.btn, .form-*, modal) zijn bewust
     generiek benoemd zodat andere modules (Nicknames, Lore, ...)
     ze later kunnen hergebruiken.
  ========================================================= */

  /* ---- generieke knoppen ---- */
  .btn{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    padding: 9px 16px;
    border: var(--outline-thin);
    border-radius: 999px;
    font-weight: 800;
    font-size: 13.5px;
    box-shadow: var(--shadow-pop-sm);
    transition: transform .15s ease, box-shadow .15s ease;
    background: var(--card);
    color: var(--ink);
  }
  .btn:hover{ transform: translateY(-2px); }
  .btn:active{ transform: translateY(0); box-shadow: 1px 1px 0 var(--ink); }
  .btn-primary{ background: var(--mint-deep); }
  .btn-secondary{ background: var(--sky); }
  .btn-danger{ background: #ff9b9b; }
  .btn-ghost{ background: transparent; box-shadow: none; }
  .btn-ghost:hover{ box-shadow: none; }
  .btn-sm{ padding: 6px 12px; font-size: 12px; }
  .btn-lg{ padding: 16px 14px; font-size: 15px; flex: 1 1 0; justify-content: center; }

  /* ---- Terrace Planner ---- */
  .terrace-card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 10px;
    margin-bottom: 6px;
  }
  .terrace-card-meta{
    font-size: 13px;
    font-weight: 700;
    color: #6b5c4d;
    margin-top: 2px;
  }
  .terrace-vote-buttons{
    display:flex;
    gap: 8px;
    margin-top: 10px;
  }
  .terrace-card-nudge{
    margin-top: 10px;
    padding: 8px 10px;
    background: var(--yellow);
    border: var(--outline-thin);
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 800;
  }

  /* ---- people toolbar ---- */
  .people-toolbar{
    display:flex;
    align-items:center;
    gap: 10px;
  }

  /* ---- person card (grid overzicht) ---- */
  .person-card{
    display:flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
  }
  .person-card-top{
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .person-card-name{
    font-family: var(--font-display);
    font-size: 17px;
    line-height: 1.15;
  }
  .person-card-desc{
    font-size: 12.5px;
    color: #6b5c4d;
    line-height: 1.4;
    min-height: 18px;
  }
  .person-stats{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .beer-card-user-ratings{
    display:flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    margin-top: 8px;
    font-size: 11.5px;
    font-weight: 700;
    color: #6b5c4d;
  }
  .beer-card-user-ratings strong{ color: var(--ink); }
  .stat-chip{
    font-size: 11px;
    font-weight: 800;
    background: var(--paper);
    border: var(--outline-thin);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }
  .stat-chip.clickable{ cursor: pointer; }
  .stat-chip.clickable:hover{ background: var(--yellow); }

  /* ---- avatars (herbruikbaar: card, detail, form-preview) ---- */
  .avatar-emoji{
    border-radius: 50%;
    border: var(--outline-thin);
    display:flex;
    align-items:center;
    justify-content:center;
    flex: 0 0 auto;
  }
  .avatar-img{
    border-radius: 50%;
    border: var(--outline-thin);
    object-fit: cover;
    flex: 0 0 auto;
  }

  /* ---- formulier ---- */
  .form-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .form-field{
    display:flex;
    flex-direction: column;
    gap: 5px;
  }
  .form-label{
    font-size: 11.5px;
    font-weight: 800;
    color: #6b5c4d;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .form-input{
    font-family: var(--font-body);
    padding: 9px 12px;
    border: var(--outline-thin);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: #fff;
    color: var(--ink);
    width: 100%;
  }
  .form-input:focus{
    outline:none;
    box-shadow: 0 0 0 3px var(--yellow);
  }
  .form-input-locked{
    background: #f2ede4;
    color: #8a7a6b;
    cursor: not-allowed;
  }
  .lock-icon{ font-size: 11px; }
  .form-textarea{
    resize: vertical;
    min-height: 70px;
    font-family: var(--font-body);
  }
  .form-error{
    color: #b3261e;
    font-weight: 800;
    font-size: 12.5px;
    margin-top: 12px;
    min-height: 16px;
  }
  .form-actions{
    display:flex;
    justify-content:flex-end;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .form-meta{
    font-size: 11.5px;
    font-weight: 700;
    color: #8a7a6b;
    margin-top: 14px;
  }

  /* ---- avatar picker binnen formulier ---- */
  .avatar-editor{
    display:flex;
    gap: 18px;
    align-items:flex-start;
    flex-wrap: wrap;
  }
  .avatar-picker{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 300px;
  }
  .avatar-swatch{
    width: 36px; height: 36px;
    border-radius: 50%;
    border: var(--outline-thin);
    background: #fff;
    font-size: 17px;
    display:flex; align-items:center; justify-content:center;
    transition: transform .1s ease;
  }
  .avatar-swatch:hover{ transform: scale(1.08); }
  .avatar-swatch.selected{
    background: var(--yellow);
    box-shadow: var(--shadow-pop-sm);
  }
  .color-picker{
    display:flex;
    gap: 6px;
    margin-top: 10px;
  }
  .color-swatch{
    width: 24px; height: 24px;
    border-radius: 50%;
    border: var(--outline-thin);
  }
  .color-swatch.selected{
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink);
  }

  /* ---- "Wie is dit?"-kiezer (Nickname/Quote/Anecdote/Counter-formulieren) ---- */
  .user-picker{
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .user-picker-btn{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 6px 14px 6px 6px;
    background: var(--card);
    border: var(--outline-thin);
    border-radius: 999px;
    cursor:pointer;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .user-picker-btn:hover{ transform: translateY(-2px); }
  .user-picker-btn.selected{
    background: var(--mint);
    box-shadow: var(--shadow-pop-sm);
    border-color: var(--ink);
  }

  /* ---- detailpagina ---- */
  .detail-header{
    display:flex;

    font-size: 12.5px;

  .detail-actions{

  .detail-desc{

  }
  .detail-meta-row{

  /* ---- mini quote kaart (detailpagina) ---- */

  .modal-box p{

  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* =========================================================
     7. NICKNAMES MODULE (kaart, level/progress, stemmen, modals)
  ========================================================= */
  .nickname-filter-bar{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
    margin-bottom: 18px;
  }
  .nickname-filter-bar .form-field{ min-width: 160px; flex: 1 1 160px; gap: 4px; }
  .nickname-filter-bar .form-field.search-field{ flex: 2 1 220px; }
  .nickname-filter-bar .form-input{ padding: 8px 11px; font-size: 13px; }
  .nickname-group{ margin-bottom: 22px; }
  .nickname-group-header{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .nickname-group-title{
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: #6b5c4d;
  }
  .nickname-group-line{
    flex: 1;
    height: 2px;
    background: repeating-linear-gradient(90deg, #d9cdbf 0, #d9cdbf 6px, transparent 6px, transparent 12px);
  }
  .nickname-card{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .nickname-card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 10px;
  }
  .nickname-text{
    font-family: var(--font-display);
    font-size: 17px;
    line-height: 1.2;
  }
  .nickname-card-compact .nickname-text{ font-size: 15px; }
  .nickname-person{
    display:flex;
    align-items:center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 700;
    color: #8a7a6b;
    margin-top: 4px;
  }
  .nickname-person.clickable{ cursor:pointer; transition: color .15s ease; width: fit-content; }
  .nickname-person.clickable:hover{ color: var(--ink); }

  .nickname-level-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 8px;
    margin-top: 2px;
  }
  .level-pill{
    font-size: 11.5px;
    font-weight: 800;

  .xp-value{
    font-family: var(--font-display);
    font-size: 15px;
  }
  .progress-track{
    height: 10px;
    border-radius: 999px;
    background: var(--paper);
    border: var(--outline-thin);
    overflow: hidden;
  }
  .progress-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--mint-deep), var(--sky-deep));

  }
  .progress-caption{
    font-size: 10.5px;
    font-weight: 700;
    color: #8a7a6b;
  }

  .nickname-origin{
    font-size: 13px;
    line-height: 1.5;
    color: #4b3f36;
  }
  .nickname-anecdote{
    font-size: 12.5px;
    line-height: 1.5;
    color: #6b5c4d;
    background: var(--paper);
    border: 1.5px dashed #d8bfa0;

  }

  .vote-row{

  }
  .vote-btn{
    display:flex;
    align-items:center;
    gap: 5px;

    font-weight: 800;
    padding: 6px 10px;
    border-radius: 999px;
    border: var(--outline-thin);
    background: #fff;

  }
  .vote-btn:hover{ transform: translateY(-1px); }
  .vote-btn span{
    background: var(--paper);
    border-radius: 999px;

  }
  .vote-btn.voted{ background: var(--yellow); }

  .nickname-meta-row{

  }
  .nickname-actions{

    gap: 8px;
    flex-wrap: wrap;

    border-radius: var(--radius-sm);
    background: #fff;
    font-weight: 700;
    font-size: 13px;
    box-shadow: var(--shadow-pop-sm);
    transition: transform .1s ease, background .15s ease;
    color: var(--ink);
  }
  .usage-option:hover{

  .usage-icon{ font-size: 18px; flex: 0 0 auto; }
  .usage-label{ flex: 1; }
  .usage-xp{

  /* =========================================================
     8. LORE MODULE (quotes + anecdotes kaart, add-formulier toggle)
  ========================================================= */
  .lore-item-card{

  }

  .lore-item-title{

  /* =========================================================
     9. COUNTERS MODULE (grote kaart met +1/-1, historiekpagina)

  }

  /* =========================================================
     10. LEADERBOARDS MODULE (podium top 3 + ranglijst)
  ========================================================= */
  .podium{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap: 14px;
    flex-wrap: wrap;
    padding-top: 16px;
  }
  .podium-spot{
    position: relative;
    width: 150px;
    background: var(--card);
    border: var(--outline-thin);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop-sm);
    padding: 16px 12px;
    text-align:center;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .podium-spot.clickable{ cursor:pointer; }
  .podium-spot.clickable:hover{
    transform: translateY(-4px);
    box-shadow: 5px 5px 0 var(--ink);
  }
  .podium-place-1{
    order: 2;
    padding-top: 30px;
    padding-bottom: 22px;
    background: linear-gradient(160deg, var(--yellow), var(--peach));
    border: var(--outline);
    transform: scale(1.06);
    z-index: 2;
  }
  .podium-place-1.clickable:hover{ transform: scale(1.06) translateY(-4px); }
  .podium-place-2{ order: 1; background: var(--sky); }
  .podium-place-3{ order: 3; background: var(--peach); padding-bottom: 10px; }
  .podium-crown{
    position:absolute;
    top: -26px;
    left:50%;
    transform: translateX(-50%);

  .podium-avatar{
    display:flex;
    justify-content:center;
    margin: 6px 0;
  }
  .podium-title{
    font-family: var(--font-display);
    font-size: 14px;
    line-height: 1.25;
  }
  .podium-subtitle{
    font-size: 10.5px;
    font-weight: 700;

    margin-top: 2px;
  }
  .podium-value{
    font-family: var(--font-display);
    font-size: 17px;
    margin-top: 6px;
  }

  /* compacte variant voor de Home Top 3 */

  .podium.compact .podium-place-1{ padding-top: 22px; padding-bottom: 16px; }
  .podium.compact .podium-title{ font-size: 12.5px; }
  .podium.compact .podium-value{ font-size: 14px; }

  /* =========================================================
     11. BEER XP / ABT LORD TROON (overdreven ceremonieel, Home)
  ========================================================= */
  .abt-throne{
    position: relative;
    text-align: center;
    padding: 34px 20px 26px;
    border-radius: var(--radius-lg);
    border: var(--outline);
    background: linear-gradient(160deg, var(--yellow) 0%, var(--peach) 55%, var(--pink) 100%);
    box-shadow: var(--shadow-pop);
    overflow: hidden;
  }
  .abt-throne-crown{
    font-size: 54px;
    line-height: 1;
    animation: floaty 3s ease-in-out infinite;
  }
  .abt-throne-title{
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: 3px;
    font-weight: 800;
    color: #6b4d1f;
    margin-top: 6px;
  }
  .abt-throne-avatar{
    display:flex;
    justify-content:center;
    margin: 14px 0 8px;
  }
  .abt-throne-avatar .avatar-emoji{
    border-width: 4px;
    box-shadow: var(--shadow-pop);
  }
  .abt-throne-name{
    font-family: var(--font-display);
    font-size: 28px;
  }
  .abt-throne-subtitle{
    font-style: italic;
    font-size: 13px;
    font-weight: 700;
    color: #6b4d1f;
    margin-top: 4px;
  }
  .abt-throne-level{
    display:inline-block;
    margin-top: 12px;
    padding: 5px 16px;
    background: rgba(255,255,255,.65);
    border: var(--outline-thin);
    border-radius: 999px;
    font-weight: 800;
    font-size: 13px;
  }
  .abt-throne-stats{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
    gap: 10px;
    margin-top: 20px;
  }
  .abt-stat{
    background: rgba(255,255,255,.7);
    border: var(--outline-thin);
    border-radius: var(--radius-md);
    padding: 10px 6px;
  }
  .abt-stat .num{ font-family: var(--font-display); font-size: 22px; }
  .abt-stat .label{
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .3px;
    color: #6b4d1f;
  }
  .fallen-abt-badge{ margin-top: 16px; }

  .abt-throne-reigning{
    font-weight: 800;
    font-size: 12.5px;
    letter-spacing: .3px;
    color: #6b4d1f;
    margin-top: 2px;
  }
  .abt-throne-dynasty-stats{ margin-top: 10px; }
  .abt-throne-lead{
    margin-top: 14px;
    font-weight: 800;
    font-size: 12.5px;
    color: #6b4d1f;
  }
  .abt-throne-lead.danger{
    color: #8a2e0e;
    animation: wiggle 1.4s ease-in-out infinite;
  }

  /* ---- The Abt Dynasty: vertical reign timeline ---- */
  .dynasty-timeline{
    position: relative;
    display:flex;
    flex-direction: column;
    gap: 18px;
    padding-left: 4px;
  }
  .dynasty-timeline::before{
    content: '';
    position: absolute;
    left: 27px;
    top: 6px;
    bottom: 6px;
    width: 3px;
    background: repeating-linear-gradient(180deg, var(--lilac-deep) 0, var(--lilac-deep) 6px, transparent 6px, transparent 12px);
  }
  .dynasty-entry{
    position: relative;
    display:flex;
    align-items:flex-start;
    gap: 14px;
    z-index: 1;
  }
  .dynasty-avatar{ flex: 0 0 auto; }
  .dynasty-avatar .avatar-emoji, .dynasty-avatar .avatar-img{ background: var(--card); }
  .dynasty-info{
    background: var(--card);
    border: var(--outline-thin);
    border-radius: var(--radius-md);
    padding: 8px 14px;
    box-shadow: var(--shadow-pop-sm);
    flex: 1;
  }
  .dynasty-name{ font-family: var(--font-display); font-size: 15px; }
  .dynasty-length{ font-size: 12px; font-weight: 800; color: #6b5c4d; margin-top: 2px; }
  .dynasty-dates{ font-size: 11px; font-weight: 700; color: #8a7a6b; margin-top: 2px; }
  .dynasty-entry.current .dynasty-info{
    background: linear-gradient(135deg, var(--yellow), var(--peach));
    box-shadow: var(--shadow-pop);
  }
  .dynasty-entry.current .dynasty-length{ color: #6b4d1f; }

  /* ---- dramatic full-screen dethronement overlay ---- */
  .dynasty-overlay{
    position: fixed;
    inset: 0;
    z-index: 200;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 20%, rgba(255,201,60,.35), transparent 55%), rgba(43,35,32,.82);
    animation: fadeIn .2s ease;
  }
  .dynasty-overlay-confetti{
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .dynasty-confetti-piece{
    position: absolute;
    top: -40px;
    font-size: 26px;
    animation: confetti-fall 2.6s ease-in forwards;
  }
  @keyframes confetti-fall{
    0%{ transform: translateY(0) rotate(0deg); opacity: 1; }
    100%{ transform: translateY(110vh) rotate(340deg); opacity: 0; }
  }
  .dynasty-overlay-card{
    position: relative;
    z-index: 1;
    max-width: 440px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    text-align: center;
    background: linear-gradient(160deg, var(--yellow) 0%, var(--peach) 55%, var(--pink) 100%);
    border: var(--outline);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    padding: 30px 24px 26px;
    animation: crown-drop .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes crown-drop{
    0%{ transform: translateY(-40px) scale(.85); opacity: 0; }
    100%{ transform: translateY(0) scale(1); opacity: 1; }
  }
  .dynasty-overlay-crown{
    font-size: 54px;
    line-height: 1;
    animation: floaty 2.2s ease-in-out infinite;
  }
  .dynasty-overlay-title{
    font-family: var(--font-display);
    font-size: 24px;
    letter-spacing: .5px;
    color: #7a1f1f;
    text-shadow: 2px 2px 0 rgba(255,255,255,.5);
    margin-top: 8px;
  }
  .dynasty-overlay-headline{
    font-weight: 800;
    font-size: 13.5px;
    letter-spacing: .3px;
    color: #4b3f36;
    margin-top: 8px;
  }
  .dynasty-overlay-battle{
    display:flex;
    flex-direction: column;
    gap: 8px;
    margin: 16px 0;
  }
  .dynasty-overlay-side{
    border: var(--outline-thin);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-family: var(--font-display);
    font-size: 15px;
    background: rgba(255,255,255,.6);
  }
  .dynasty-overlay-side.winner{ background: var(--mint); }
  .dynasty-overlay-side.loser{ background: rgba(255,255,255,.5); opacity: .85; }
  .dynasty-overlay-tagline{
    font-weight: 800;
    font-size: 12.5px;
    letter-spacing: .8px;
    color: #6b4d1f;
    margin-top: 4px;
  }
  .dynasty-overlay-newlord{
    font-family: var(--font-display);
    font-size: 18px;
    margin-top: 10px;
  }
  .dynasty-overlay-subtitle{
    font-style: italic;
    font-size: 13px;
    font-weight: 700;
    color: #6b4d1f;
    margin-top: 6px;
  }
  .dynasty-overlay-btn{ margin-top: 20px; }

  /* =========================================================
     THE TAPROOM — Beer Club redesign, pass 2: a spatial environment
     instead of a card grid. .taproom-environment is ONE continuous
     backdrop (back bar → bar counter → wall → table → wall → exit)
     that every section below sits inside/against, each shaped like a
     different physical object rather than a uniform rounded-card.
     Tokens scoped to .taproom-page (never touch :root). Reuses
     existing primitives (.dynasty-hero-lord, .row-item, .badge) for
     content that's literally the same component shown elsewhere.
     ========================================================= */
  .taproom-page{
    --wood: #6b4226;
    --wood-deep: #3d2513;
    --wood-light: #8a5a35;
    --wood-mid: #6f4a2c;
    --amber: #f0b84e;
    --amber-deep: #c98a1f;
    --brass: #cfa53d;
    --brass-light: #ecd48a;
    --chalkboard: #2b362e;
    --chalk: #f5f0e6;
    --cream: #fff3e0;
    --fridge-glass: #26313c;
    --fridge-glass-deep: #141c24;
  }

  /* ---- the environment shell ---- */
  .taproom-environment{
    position: relative;
    background:
      radial-gradient(ellipse 60% 40% at 22% 4%, var(--amber-glow, rgba(240,184,78,.16)), transparent 60%),
      radial-gradient(ellipse 50% 30% at 78% 46%, rgba(240,184,78,.10), transparent 65%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0px, rgba(0,0,0,.05) 1px, transparent 1px, transparent 36px),
      linear-gradient(180deg, var(--wood-deep) 0%, var(--wood) 16%, var(--wood-mid) 50%, var(--wood) 82%, var(--wood-deep) 100%);
    border: 4px solid var(--ink);
    border-radius: var(--radius-lg);
    box-shadow: 7px 7px 0 var(--ink);
    padding: 18px 14px 20px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .taproom-environment > *{ position: relative; }
  .taproom-zone{ margin-bottom: 22px; }
  .taproom-zone:last-child{ margin-bottom: 0; }

  /* ---- Back Bar: the hanging sign + shelves ---- */
  .taproom-backbar{ text-align: center; padding: 6px 0 4px; }
  .taproom-backbar-shelf{
    height: 3px;
    max-width: 320px;
    margin: 0 auto 14px;
    background: linear-gradient(90deg, transparent, var(--brass) 20%, var(--brass-light) 50%, var(--brass) 80%, transparent);
    opacity: .55;
    border-radius: 2px;
  }
  .taproom-backbar-bottles{
    font-size: 20px;
    letter-spacing: 10px;
    opacity: .3;
    filter: grayscale(.4);
    margin-bottom: 6px;
    user-select: none;
  }
  .taproom-sign{
    display: inline-block;
    position: relative;
    background: linear-gradient(165deg, var(--wood-mid), var(--wood-deep));
    border: 3px solid var(--brass);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop-sm), 0 0 40px 4px rgba(240,184,78,.18);
    padding: 14px 26px 16px;
  }
  .taproom-sign::before, .taproom-sign::after{
    content: '';
    position: absolute;
    top: -14px;
    width: 3px; height: 14px;
    background: var(--brass);
  }
  .taproom-sign::before{ left: 22%; }
  .taproom-sign::after{ right: 22%; }
  .taproom-sign-title{
    font-family: var(--font-display);
    font-size: 30px;
    letter-spacing: 1.5px;
    color: var(--amber);
    text-shadow: 2px 2px 0 var(--wood-deep);
  }
  .taproom-sign-est{
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--brass-light);
    opacity: .8;
    margin-top: 2px;
  }
  .taproom-sign-tagline{ font-style: italic; font-weight: 700; color: var(--chalk); margin-top: 6px; font-size: 13px; }

  /* ---- Bar counter: coaster-style actions ---- */
  .taproom-bartop{
    position: relative;
    background: linear-gradient(180deg, var(--wood-light) 0%, var(--wood) 70%);
    border-radius: var(--radius-md);
    border: 3px solid var(--wood-deep);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.18), var(--shadow-pop-sm);
    padding: 16px 14px;
  }
  .taproom-bartop-label{
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 10px;
  }
  .taproom-coaster-row{ display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .taproom-coaster{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    width: 92px;
    padding: 12px 8px 10px;
    background: var(--cream);
    border: 3px solid var(--wood-deep);
    border-radius: 50%;
    box-shadow: 0 3px 0 var(--wood-deep), var(--shadow-pop-sm);
    font-weight: 800;
    font-size: 11px;
    color: var(--ink);
    text-align: center;
    cursor: pointer;
    transition: transform .15s ease;
  }
  .taproom-coaster:hover{ transform: translateY(-3px) rotate(-2deg); }
  .taproom-coaster:active{ transform: translateY(0); }
  .taproom-coaster-icon{ font-size: 22px; }
  .taproom-coaster.live{ background: linear-gradient(160deg, #ffd7c9, var(--cream)); border-color: #8a2626; }

  /* ---- Behind the Bar: framed portrait ---- */
  .taproom-portrait{ text-align: center; }
  .taproom-portrait-label{
    font-family: var(--font-display);
    font-size: 18px;
    letter-spacing: .5px;
    color: var(--chalk);
    margin-bottom: 10px;
  }
  .taproom-portrait-frame{
    position: relative;
    display: block;
    width: 100%;
    box-sizing: border-box;
    background: linear-gradient(165deg, rgba(255,255,255,.08), rgba(0,0,0,.12)), var(--card);
    border: 10px solid var(--brass);
    border-radius: var(--radius-md);
    box-shadow: 0 0 0 3px var(--wood-deep), 0 0 50px 8px rgba(240,184,78,.28), var(--shadow-pop);
    padding: 18px 16px 14px;
  }
  .taproom-portrait-frame::before, .taproom-portrait-frame::after,
  .taproom-portrait-frame-corner-tl, .taproom-portrait-frame-corner-br{ content: none; }
  .taproom-portrait-frame .dynasty-hero-subtitle{
    display: inline-block;
    margin-top: 12px;
    padding: 6px 14px;
    background: linear-gradient(180deg, var(--brass-light), var(--brass));
    border: 2px solid var(--wood-deep);
    border-radius: 6px;
    color: var(--wood-deep);
    font-style: normal;
    font-weight: 800;
    font-size: 11.5px;
    letter-spacing: .3px;
  }
  .taproom-portrait-empty{ color: var(--chalk); font-weight: 700; }

  /* ---- Today's Regulars: chalkboard ---- */
  .taproom-chalkboard{
    background:
      radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 9px 9px,
      var(--chalkboard);
    border: 8px solid var(--wood-deep);
    border-radius: 6px;
    box-shadow: var(--shadow-pop-sm);
    padding: 18px 16px;
    color: var(--chalk);
    height: 100%;
    box-sizing: border-box;
  }
  .taproom-chalkboard .taproom-section-title{ color: var(--chalk); text-align: center; margin-bottom: 10px; }
  .taproom-chalkboard-row{
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: 'Caveat', cursive;
    font-size: 21px;
    font-weight: 700;
    padding: 4px 0;
    border-bottom: 1px dashed rgba(245,240,230,.22);
  }
  .taproom-chalkboard-row:nth-child(odd){ transform: rotate(-.3deg); }
  .taproom-chalkboard-row:nth-child(even){ transform: rotate(.3deg); }
  .taproom-chalkboard-row:last-of-type{ border-bottom: none; }
  .taproom-chalkboard-dots{ flex: 1 1 auto; overflow: hidden; white-space: nowrap; opacity: .3; letter-spacing: 2px; }
  .taproom-chalkboard-xp{ font-family: var(--font-body); font-weight: 800; font-size: 13px; }
  .taproom-chalkboard-note{
    margin-top: 10px;
    font-style: italic;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--amber);
    text-align: center;
    border-top: 1px dashed rgba(245,240,230,.22);
    padding-top: 8px;
  }

  /* ---- Our Table: wood tabletop with items sitting on it ---- */
  .taproom-table{
    position: relative;
    background: linear-gradient(180deg, var(--wood-mid) 0%, var(--wood) 100%);
    border-radius: var(--radius-md);
    border: 3px solid var(--wood-deep);
    box-shadow: inset 0 4px 14px rgba(0,0,0,.28), var(--shadow-pop-sm);
    padding: 18px 16px 16px;
  }
  .taproom-table.live{ box-shadow: inset 0 4px 14px rgba(0,0,0,.28), var(--shadow-pop-sm), 0 0 34px 6px rgba(255,120,70,.35); }
  .taproom-table-label{
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--font-display);
    font-size: 19px;
    color: var(--chalk);
    margin-bottom: 12px;
  }
  .taproom-live-dot{
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #ff6b45;
    box-shadow: 0 0 8px 2px rgba(255,107,69,.7);
  }
  .taproom-coaster-tag{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--cream);
    border: 2px solid var(--wood-deep);
    border-radius: 999px;
    padding: 4px 12px;
    font-weight: 800;
    font-size: 11.5px;
    color: var(--ink);
    box-shadow: 0 2px 0 rgba(0,0,0,.25);
    transform: rotate(-1.5deg);
  }
  .taproom-location-tag{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--amber);
    border: 2px solid var(--wood-deep);
    border-radius: 4px;
    padding: 4px 12px;
    font-weight: 800;
    font-size: 11.5px;
    color: var(--wood-deep);
    box-shadow: 0 2px 0 rgba(0,0,0,.25);
    transform: rotate(1.2deg);
    margin-left: 8px;
  }
  .taproom-table-tags{ text-align: center; margin-bottom: 12px; }
  .taproom-seats{ display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .taproom-seat{ display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .taproom-seat:nth-child(odd){ transform: translateY(-3px); }
  .taproom-seat:nth-child(even){ transform: translateY(3px); }
  .taproom-seat-name{ font-size: 10.5px; font-weight: 800; color: var(--chalk); }
  .taproom-table-stats{ display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* ---- Beer Fridge preview: glass-door shelf ---- */
  .taproom-fridge{
    background: linear-gradient(165deg, var(--fridge-glass) 0%, var(--fridge-glass-deep) 100%);
    border: 3px solid #0d1318;
    border-radius: var(--radius-md);
    box-shadow: inset 0 0 30px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.08), var(--shadow-pop-sm);
    padding: 14px;
    height: 100%;
    box-sizing: border-box;
  }
  .taproom-fridge .taproom-section-title{ color: var(--cream); }
  .taproom-fridge .grid{ position: relative; }
  .taproom-fridge .poem-card, .taproom-fridge .person-card{ position: relative; }
  .taproom-fridge .person-card::before{
    content: '🏷️';
    position: absolute;
    top: -8px; right: 10px;
    font-size: 16px;
    transform: rotate(12deg);
  }

  /* ---- On The Wall: uneven gallery ---- */
  .taproom-wall{
    background: linear-gradient(165deg, rgba(255,255,255,.04), rgba(0,0,0,.10));
    border-radius: var(--radius-md);
    padding: 16px 14px;
    height: 100%;
    box-sizing: border-box;
  }
  .taproom-wall .taproom-section-title{ color: var(--chalk); }
  .taproom-wall-grid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px; margin-top: 12px; }
  .taproom-frame{
    text-align: center;
    padding: 12px 10px;
    color: var(--cream);
    box-shadow: var(--shadow-pop-sm);
  }
  .taproom-frame-label{ font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; color: var(--amber); }
  .taproom-frame-value{ font-family: var(--font-display); font-size: 15px; margin-top: 4px; }
  .taproom-frame-sub{ font-size: 11px; font-weight: 700; color: var(--chalk); margin-top: 2px; opacity: .9; }
  .taproom-frame-0{ background: linear-gradient(165deg, var(--wood-light), var(--wood)); border: 3px solid var(--brass); border-radius: var(--radius-md); transform: rotate(-1.5deg); }
  .taproom-frame-1{ background: linear-gradient(165deg, var(--wood-light), var(--wood)); border: 4px double var(--brass-light); border-radius: 50%; transform: rotate(1deg); padding: 18px 12px; }
  .taproom-frame-2{ background: linear-gradient(165deg, var(--wood-mid), var(--wood-deep)); border: 3px solid var(--wood-deep); box-shadow: var(--shadow-pop-sm), inset 0 0 0 2px var(--brass); clip-path: polygon(50% 0%, 100% 20%, 100% 85%, 50% 100%, 0% 85%, 0% 20%); transform: rotate(-1deg); }

  /* ---- Last Call: notice board ---- */
  .taproom-noticeboard{
    background: var(--wood-deep);
    border-radius: var(--radius-md);
    padding: 14px 12px 10px;
  }
  .taproom-noticeboard .taproom-section-title{ color: var(--chalk); text-align: center; margin-bottom: 10px; }
  .taproom-note{
    position: relative;
    display: inline-block;
    width: 100%;
    box-sizing: border-box;
    background: var(--cream);
    border-radius: 3px;
    box-shadow: var(--shadow-pop-sm);
    padding: 8px 12px;
    margin-bottom: 8px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .taproom-note:nth-child(odd){ transform: rotate(-.6deg); }
  .taproom-note:nth-child(even){ transform: rotate(.6deg); }
  .taproom-note::before{
    content: '';
    position: absolute;
    top: -4px; left: 50%;
    transform: translateX(-50%);
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: var(--shadow-pop-sm);
  }
  .taproom-note-time{ display: block; font-size: 10.5px; font-weight: 700; color: #a68a6f; margin-top: 2px; }

  .taproom-section-title{
    font-family: var(--font-display);
    font-size: 19px;
    letter-spacing: .5px;
    color: var(--ink);
  }

  /* generic small parchment card, used where content still needs to
     read as an ordinary readable panel (empty states etc.) */
  .taproom-card{
    background: var(--cream);
    border: 3px solid var(--wood);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop-sm);
  }
  .taproom-plaque{
    background: linear-gradient(165deg, var(--wood-light), var(--wood));
    border: 3px solid var(--brass);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop-sm);
    padding: 14px;
    color: var(--cream);
    text-align: center;
  }

  .taproom-composition-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: stretch; }
  .taproom-composition-grid > *{ min-width: 0; }

  .taproom-nav{
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .taproom-nav-card{
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 84px;
    padding: 10px 14px;
    background: var(--card);
    border: var(--outline-thin);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop-sm);
    font-weight: 800;
    font-size: 12px;
    color: var(--ink);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .taproom-nav-card:hover{ transform: translateY(-2px); }
  .taproom-nav-card.active{ background: var(--wood); color: var(--cream); border-color: var(--ink); }
  .taproom-nav-emoji{ font-size: 20px; }

  @media (prefers-reduced-motion: no-preference){
    .taproom-portrait-frame:hover{ animation: taproom-crown-shimmer 1.2s ease-in-out; }
    @keyframes taproom-crown-shimmer{
      0%, 100%{ filter: brightness(1); }
      50%{ filter: brightness(1.18); }
    }
    .taproom-section-title.taproom-chalk-hoverable:hover{
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: var(--amber);
      text-underline-offset: 4px;
    }
    .taproom-live-dot{ animation: taproom-pulse 1.7s ease-in-out infinite; }
  }
  @media (prefers-reduced-motion: reduce){
    .taproom-live-dot{ opacity: .9; }
  }
  @keyframes taproom-pulse{
    0%, 100%{ opacity: 1; transform: scale(1); }
    50%{ opacity: .5; transform: scale(1.3); }
  }

  @media (max-width: 900px){
    .taproom-composition-grid{ grid-template-columns: 1fr; }
  }
  @media (max-width: 640px){
    .taproom-sign-title{ font-size: 23px; }
    .taproom-coaster{ width: 78px; padding: 10px 6px 8px; }
    .taproom-nav-card{ min-width: 72px; padding: 8px 10px; }
    .taproom-wall-grid{ grid-template-columns: repeat(2, 1fr); }
  }

  /* ---- Abt Dynasty HERO: the single most prestigious section on the
     Leaderboards page — deliberately bigger/richer than every other
     card on the page (thicker outline, bigger shadow, warm gradient,
     subtle glow pulse) so it reads as THE headline, not just another
     leaderboard. ---- */
  .dynasty-hero{
    position: relative;
    background: linear-gradient(165deg, var(--yellow) 0%, var(--peach) 45%, var(--pink) 80%, var(--lilac) 100%);
    border: 4px solid var(--ink);
    border-radius: var(--radius-lg);
    box-shadow: 7px 7px 0 var(--ink);
    padding: 28px 20px 24px;
    margin-bottom: 24px;
    animation: dynasty-hero-glow 4s ease-in-out infinite;
  }
  @keyframes dynasty-hero-glow{
    0%, 100%{ box-shadow: 7px 7px 0 var(--ink), 0 0 0 rgba(255,201,60,0); }
    50%{ box-shadow: 7px 7px 0 var(--ink), 0 0 34px rgba(255,201,60,.55); }
  }
  .dynasty-hero-header{ text-align: center; margin-bottom: 18px; }
  .dynasty-hero-crown{
    font-size: 62px;
    line-height: 1;
    animation: floaty 3s ease-in-out infinite;
  }
  .dynasty-hero-title{
    font-family: var(--font-display);
    font-size: 30px;
    letter-spacing: 1.5px;
    text-shadow: 3px 3px 0 rgba(255,255,255,.5);
    margin-top: 4px;
  }
  .dynasty-hero-tagline{
    font-style: italic;
    font-weight: 700;
    font-size: 13px;
    color: #6b4d1f;
    margin-top: 4px;
  }
  .dynasty-hero-lord{
    text-align: center;
    background: rgba(255,255,255,.55);
    border: var(--outline);
    border-radius: var(--radius-lg);
    padding: 22px 18px;
    margin-bottom: 18px;
  }
  .dynasty-hero-avatar{ display:flex; justify-content:center; margin-bottom: 10px; }
  .dynasty-hero-avatar .avatar-emoji, .dynasty-hero-avatar .avatar-img{
    border-width: 4px;
    box-shadow: var(--shadow-pop);
  }
  .dynasty-hero-name{ font-family: var(--font-display); font-size: 30px; }
  .dynasty-hero-subtitle{
    font-style: italic;
    font-size: 13.5px;
    font-weight: 700;
    color: #6b4d1f;
    margin-top: 4px;
  }
  .dynasty-hero-level{
    display:inline-block;
    margin-top: 10px;
    padding: 5px 16px;
    background: rgba(255,255,255,.7);
    border: var(--outline-thin);
    border-radius: 999px;
    font-weight: 800;
    font-size: 13px;
  }
  .dynasty-hero-xp{
    font-family: var(--font-display);
    font-size: 44px;
    margin-top: 14px;
    color: #6b4d1f;
  }
  .dynasty-hero-xp span{
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 800;
    display: block;
    margin-top: -4px;
  }
  .dynasty-hero-stats{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
    margin-top: 18px;
  }
  .dynasty-hero-stats .dynasty-hero-stat{
    background: rgba(255,255,255,.75);
    border: var(--outline-thin);
    border-radius: var(--radius-md);
    padding: 12px 6px;
  }
  .dynasty-hero-stats .num{ font-family: var(--font-display); font-size: 20px; }
  .dynasty-hero-stats .label{
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .3px;
    color: #6b4d1f;
  }
  .dynasty-hero-lead{
    margin-top: 16px;
    font-weight: 800;
    font-size: 13.5px;
    color: #6b4d1f;
  }
  .dynasty-hero-lead.danger{
    color: #8a2e0e;
    animation: wiggle 1.4s ease-in-out infinite;
  }
  .dynasty-hero .fallen-abt-badge{ margin-top: 14px; }
  .dynasty-hero .section{ margin-bottom: 14px; }
  .dynasty-hero .section:last-child{ margin-bottom: 0; }

  /* =========================================================
     11b. POETRY WALL — paper-card look, kept light so it still
     reads as the same cartoon app: a faint lined-paper texture,
     a serif poem body, small pen/feather accents. Reuses
     .vote-btn/.vote-row/.lore-type-toggle/.stat-chip as-is for
     mood picker + the 9 reaction chips.
  ========================================================= */
  .poem-card{
    cursor: pointer;
    text-align: left;
    background:
      repeating-linear-gradient(180deg, transparent 0 27px, rgba(43,35,32,.05) 27px 28px),
      linear-gradient(165deg, #fffdf6 0%, #fff8ef 100%);
    position: relative;
    transition: transform .15s ease;
  }
  .poem-card:hover{ transform: translateY(-2px); }
  .poem-card::before{
    content: '🖋️';
    position: absolute;
    top: -10px;
    right: 14px;
    font-size: 20px;
    transform: rotate(18deg);
  }
  .poem-card-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .poem-title{
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 19px;
    margin-bottom: 6px;
  }
  .poem-title-detail{
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 26px;
    margin: 8px 0 2px;
  }
  .poem-body{
    font-family: 'Lora', serif;
    font-size: 15px;
    line-height: 1.75;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    color: var(--ink);
  }
  .poem-body-preview{
    color: #4a3f38;
    max-height: 4.6em;
    overflow: hidden;
  }
  .poem-read-more{
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 18px;
    color: var(--peach-deep);
    margin-top: 2px;
  }
  .poem-context{
    font-family: 'Caveat', cursive;
    font-size: 18px;
    font-weight: 600;
    color: #6b5c4d;
    margin-top: 14px;
  }
  .poem-mood-badge{ background: var(--lilac); }
  .poem-textarea{
    resize: vertical;
    min-height: 140px;
    font-family: 'Lora', serif;
    line-height: 1.6;
  }

  .potm-banner{
    background: linear-gradient(160deg, var(--yellow) 0%, var(--peach) 100%);
    border: var(--outline);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    padding: 16px 16px 4px;
  }
  .potm-banner-label{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 1px;
    text-align: center;
    margin-bottom: 10px;
  }
  .potm-banner .poem-card{ box-shadow: none; cursor: pointer; }

  .laureate-card{
    text-align: center;
    background: linear-gradient(165deg, var(--lilac) 0%, var(--sky) 100%);
    border: var(--outline);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    padding: 22px 18px 18px;
  }
  .laureate-label{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
  }
  .laureate-name{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-family: var(--font-display);
    font-size: 26px;
    margin-bottom: 10px;
  }
  .laureate-stats{
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px;
    font-weight: 800;
    font-size: 12.5px;
    color: #4a3f6b;
    margin-bottom: 10px;

<script>
/* =============================================================
   OFFICE LORE — APP FUNDAMENT
   -------------------------------------------------------------
   Modulaire opzet:
   - APP_DATA        : placeholder "database" (later te vervangen
                        door echte opslag / API calls)
   - MODULES         : één object per navigatie-item, elk met een
                        eigen render(data) functie die HTML teruggeeft.
                        Nieuwe features toevoegen = nieuwe module
                        schrijven of bestaande module uitbreiden,
                        zonder de rest te raken.
   - CURRENT_USER     : wie er "actief" is via de profiel-switcher.
   - Simpele router: leest state.activePage, toont bijhorende page.
   ============================================================= */

/* ---------- 1. DATA (Supabase-backed) ----------
   APP_DATA has the exact same shape the app always used (camelCase,
   nested usageLog/votes/reactions/entries arrays) so every render
   function below keeps working completely unchanged. The difference
   is that it now starts empty and gets populated by loadAppData()
   (see the SUPABASE DATA LAYER section right below) instead of being
   hardcoded here. */
let APP_DATA = {
  users: [],
  nicknames: [],
  quotes: [],
  anecdotes: [],
  counters: [],
  beers: [],
  beerSessions: [],
  abtReigns: [],
  standaloneBeerEntries: [],
  poems: [],
  poemReactions: [],
  poetLaureateReigns: [],
  nicknameBattles: [],
  nicknameBattleVotes: [],
  nicknameBattleVoteCounts: [],
  poetryPrompts: [],
  dailyPoetryChallenges: [],
  terraceLocations: [],
  terraceLocationFavorites: [],
  terraceEvents: [],
  terraceEventOptions: [],
  terraceAvailability: [],
  terraceLocationVotes: [],
  terraceAttendance: [],
  terraceLocationRatings: [],
  poemComments: [],
};

/* ---------- 1b. SUPABASE CONFIG + CLIENT ----------
   The anon/public key is safe to expose in client code by design —
   Row Level Security (see supabase/0001_schema.sql) is the actual
   security boundary, not secrecy of this key. */
const SUPABASE_URL = 'https://pldhdsopdwmgvuvwdsta.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_BqEilTRoa09-UtJ_fNPheA_mhXqapM_';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* Same Supabase project is shared with an unrelated second app
   (QuestNest). This identifies which app's signup/membership a given
   auth user belongs to -- see supabase/0015_app_memberships.sql. */
const APP_ID = 'officelore';

/* ---------- 1c. SUPABASE DATA LAYER ----------
   Fetches every table and reassembles APP_DATA in the exact shape the
   rest of the app expects. Called once after login, then again after
   every mutation and on every realtime event (see bottom of file). */
async function loadAppData(){
  // eerst: garandeer dat vandaag's Daily Challenge bestaat, VOORDAT de
  // rest parallel opgehaald wordt -- anders zou de parallelle select
  // op daily_poetry_challenges hieronder een race kunnen hebben met
  // deze insert (Promise.all start alles tegelijk, geen garantie dat
  // de RPC's insert al gecommit is als de select uitgevoerd wordt)
  const dailyChallengeRpcRes = await sb.rpc('get_or_create_daily_challenge');
  if (dailyChallengeRpcRes.error){ console.error('Supabase load error:', dailyChallengeRpcRes.error); throw dailyChallengeRpcRes.error; }

  const [
    profilesRes, nicknamesRes, nicknameEventsRes, nicknameVotesRes,
    quotesRes, quoteReactionsRes, anecdotesRes, anecdoteReactionsRes,
    countersRes, counterEventsRes,
    beersRes, beerSessionsRes, participantsRes, ratingsRes, consumptionRes, pourRes,
    abtReignsRes,
    poemsRes, poemReactionsRes, poetLaureateReignsRes,
    nicknameBattlesRes, nicknameBattleVotesRes, nicknameBattleVoteCountsRes,
    poetryPromptsRes, dailyPoetryChallengesRes,
    terraceLocationsRes, terraceLocationFavoritesRes, terraceEventsRes, terraceEventOptionsRes,
    terraceAvailabilityRes, terraceLocationVotesRes, terraceAttendanceRes, terraceLocationRatingsRes,
    poemCommentsRes,
  ] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('nicknames').select('*'),
    sb.from('nickname_events').select('*'),
    sb.from('nickname_votes').select('*'),
    sb.from('quotes').select('*'),
    sb.from('quote_reactions').select('*'),
    sb.from('anecdotes').select('*'),
    sb.from('anecdote_reactions').select('*'),
    sb.from('counters').select('*'),
    sb.from('counter_events').select('*'),
    sb.from('beers').select('*'),
    sb.from('beer_sessions').select('*'),
    sb.from('beer_session_participants').select('*'),
    sb.from('beer_ratings').select('*'),
    sb.from('beer_consumption').select('*'),
    sb.from('perfect_pours').select('*'),
    sb.from('abt_reigns').select('*'),
    sb.from('poems').select('*'),
    sb.from('poem_reactions').select('*'),
    sb.from('poet_laureate_reigns').select('*'),
    sb.from('nickname_battles').select('*'),
    sb.from('nickname_battle_votes').select('*'),
    sb.from('nickname_battle_vote_counts').select('*'),
    sb.from('poetry_prompts').select('*'),
    sb.from('daily_poetry_challenges').select('*'),
    sb.from('terrace_locations').select('*'),
    sb.from('terrace_location_favorites').select('*'),
    sb.from('terrace_events').select('*'),
    sb.from('terrace_event_options').select('*'),
    sb.from('terrace_availability').select('*'),
    sb.from('terrace_location_votes').select('*'),
    sb.from('terrace_attendance').select('*'),
    sb.from('terrace_location_ratings').select('*'),
    sb.from('poem_comments').select('*'),
  ]);

  for (const res of [
    profilesRes, nicknamesRes, nicknameEventsRes, nicknameVotesRes,
    quotesRes, quoteReactionsRes, anecdotesRes, anecdoteReactionsRes,
    countersRes, counterEventsRes,
    beersRes, beerSessionsRes, participantsRes, ratingsRes, consumptionRes, pourRes,
    abtReignsRes,
    poemsRes, poemReactionsRes, poetLaureateReignsRes,
    nicknameBattlesRes, nicknameBattleVotesRes, nicknameBattleVoteCountsRes,
    poetryPromptsRes, dailyPoetryChallengesRes,
    terraceLocationsRes, terraceLocationFavoritesRes, terraceEventsRes, terraceEventOptionsRes,
    terraceAvailabilityRes, terraceLocationVotesRes, terraceAttendanceRes, terraceLocationRatingsRes,

/* Debounced "refetch everything + redraw" — used after every mutation
   and by the realtime subscription. Simple over granular on purpose. */
let refreshInFlight = null;
async function refreshAppData(){
  if (!refreshInFlight) refreshInFlight = loadAppData().finally(() => { refreshInFlight = null; });
  await refreshInFlight;
}

/* ---------- 1d. REALTIME ----------
   One channel across every domain table. Any insert/update/delete on
   any of them -> debounce ~150ms -> refetch everything -> redraw the
   current page. Simple over granular, on purpose (see SUPABASE_SETUP.md). */
const REALTIME_TABLES = [
  'nicknames', 'nickname_events', 'nickname_votes',
  'quotes', 'quote_reactions', 'anecdotes', 'anecdote_reactions',
  'counters', 'counter_events',
  'beers', 'beer_sessions', 'beer_session_participants', 'beer_ratings', 'beer_consumption', 'perfect_pours',
  'abt_reigns',
  'poems', 'poem_reactions', 'poet_laureate_reigns',
  'nickname_battles', 'nickname_battle_votes',
  'poetry_prompts', 'daily_poetry_challenges',
  'terrace_locations', 'terrace_location_favorites', 'terrace_events', 'terrace_event_options',
  'terrace_availability', 'terrace_location_votes', 'terrace_attendance', 'terrace_location_ratings',
  'poem_comments',
];
let realtimeChannel = null;
let realtimeDebounceTimer = null;

function subscribeRealtime(){
  if (realtimeChannel) return;
  realtimeChannel = sb.channel('office-lore-changes');
  REALTIME_TABLES.forEach(table => {
    realtimeChannel.on('postgres_changes', { event: '*', schema: 'public', table }, onRealtimeChange);
  });
  // dedicated listener: a reign row is only ever UPDATEd once, exactly
  // when it's closed by a dethronement (dethroned_by_user_id gets set
  // then and never touched again) — this only fires for genuinely live
  // events since the listener is registered after the initial load
  realtimeChannel.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'abt_reigns' }, onAbtReignClosed);
  realtimeChannel.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'nickname_battles' }, onNicknameBattleResolved);
  realtimeChannel.subscribe();
}

function unsubscribeRealtime(){
  if (!realtimeChannel) return;
  sb.removeChannel(realtimeChannel);
  realtimeChannel = null;
}

function onRealtimeChange(){
  clearTimeout(realtimeDebounceTimer);
  realtimeDebounceTimer = setTimeout(async () => {
    if (!STATE.activeUser) return;
    await refreshAppData();
    renderApp();
    refreshOpenNicknameDetailModal();
  }, 150);
}

/* live dethronement -> one-time full-screen "THE THRONE HAS FALLEN" moment.
   Only reacts to real-time events (registered after the initial load),
   so a page refresh/re-login never replays a past dethronement. */
let lastShownDethronementReignId = null;
async function onAbtReignClosed(payload){
  const row = payload.new;
  if (!row || !row.dethroned_by_user_id) return; // an edit unrelated to a dethronement
  if (lastShownDethronementReignId === row.id) return; // avoid duplicate realtime deliveries
  lastShownDethronementReignId = row.id;

  if (!STATE.activeUser) return;
  await refreshAppData();
  renderApp();
  showDethronementOverlay(row.user_id, row.dethroned_by_user_id, row.ending_beer_xp);
}

/* live battle reveal -> full-screen moment when a battle resolves.
   Shared between "I just cast the deciding vote" (toggleBattleVote
   calls checkAndShowBattleReveal directly) and "someone else just
   cast it" (this realtime listener) -- the lastShownBattleRevealId
   guard makes sure the two paths never double-show the same reveal
   when both fire for one resolution. Only takes over the screen if
   I currently have that specific battle open, never for battles I'm
   not looking at. */
let lastShownBattleRevealId = null;
function checkAndShowBattleReveal(battleId){
  const battle = APP_DATA.nicknameBattles.find(b => b.id === battleId);
  if (!battle || battle.status === 'open') return;
  if (lastShownBattleRevealId === battleId) return;
  lastShownBattleRevealId = battleId;
  showBattleRevealOverlay(battle);
}

async function onNicknameBattleResolved(payload){
  const row = payload.new;
  if (!row || row.status === 'open') return; // niet zopas afgerond
  if (!STATE.activeUser) return;
  await refreshAppData();
  renderApp();
  refreshOpenNicknameDetailModal();
  const openEl = document.querySelector(`[data-battle-detail-id="${row.id}"]`);
  if (openEl) checkAndShowBattleReveal(row.id);
}

/* ---------- 2. APP STATE ---------- */
const STATE = {
  activePage: 'home',
  activeUser: null, // null = nog niet ingelogd -> loginscherm wordt getoond
};

/* ---------- 2b. AUTH STATE + FLOW ----------
   activeUser is now driven by a real Supabase Auth session instead of
   the old local "Who enters the Lore?" picker. AUTH_STATE only tracks
   UI concerns (login form error, forgot-password mode, recovery mode);
   the actual session lives in Supabase and survives refresh/devices. */
const AUTH_STATE = {
  loading: true,       // true while we're checking for an existing session on first load
  error: '',
  mode: 'login',        // 'login' | 'signup' | 'forgot' | 'recovery'
  forgotSent: false,
  signupSent: false,    // true once signUp succeeded and we're waiting on email confirmation
  accessDenied: false,  // true once a signed-in session has been confirmed NOT an officelore member
};

async function initAuth(){
  // Supabase puts recovery tokens in the URL hash after a password-reset redirect.
  if (window.location.hash.includes('type=recovery')) AUTH_STATE.mode = 'recovery';

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY'){ AUTH_STATE.mode = 'recovery'; renderApp(); return; }
    if (event === 'SIGNED_OUT'){ STATE.activeUser = null; AUTH_STATE.accessDenied = false; renderApp(); return; }
    if (session && event === 'SIGNED_IN'){
      // Supabase re-fires SIGNED_IN on token refresh, tab-refocus and
      // multi-tab session sync -- not just on a genuine new login. If
      // we're already signed in as this exact user, this is a
      // redundant re-fire, not a real login, and must NOT re-run the
      // login bootstrap (which includes restoreNavState()) -- doing
      // so was silently yanking the user back to whatever page was
      // last saved, mid-session, for no reason visible to them.
      if (STATE.activeUser === session.user.id) return;
      handleSignedIn(session);
    }
  });

  const { data: { session } } = await sb.auth.getSession();
  AUTH_STATE.loading = false;
  if (session && AUTH_STATE.mode !== 'recovery'){
    await handleSignedIn(session);
  } else {
    renderApp();
  }
}

/* ---------- PERSISTENT NAVIGATION STATE ----------
   Remembers which page (and, for Beer Club, which subtab) the user
   was on, so a refresh/re-open/data-reload returns them there instead
   of always dumping them back on Home. Saved on every renderPage()
   call (so it always reflects whatever's actually on screen, and
   realtime-triggered re-renders never change it since they never
   touch STATE.activePage themselves) and restored once, right after
   login, before the first render. Deep-link sub-views that depend on
   a specific record (beerDetail/sessionForm/sessionDetail, or a
   Counter's history view) are deliberately NOT persisted — those fall
   back to their parent list, since the record they pointed at may no
   longer exist by the time the user comes back. */
const NAV_STATE_STORAGE_KEY = 'officeLoreNavState';
const PERSISTABLE_PAGES = ['home', 'nicknames', 'lore', 'counters', 'beerclub', 'poetrywall', 'terrace', 'leaderboards', 'myprofile'];
const PERSISTABLE_BEER_VIEWS = ['taproom', 'database', 'sessions', 'leaderboards'];
const PERSISTABLE_NICKNAME_TABS = ['nicknames', 'battles'];

/* deep-link views normaliseren naar hun bovenliggende tab (het record
   waar ze naar wijzen bestaat mogelijk niet meer bij terugkomst) */
function normalizeBeerViewForPersistence(view){
  if (view === 'beerDetail') return 'database';
  if (view === 'sessionDetail' || view === 'sessionForm') return 'sessions';
  return PERSISTABLE_BEER_VIEWS.includes(view) ? view : 'taproom';
}

function saveNavState(){
  if (!PERSISTABLE_PAGES.includes(STATE.activePage)) return;
  const navState = { page: STATE.activePage };
  if (STATE.activePage === 'beerclub'){
    navState.beerView = normalizeBeerViewForPersistence(BEER_STATE.view);
  }
  if (STATE.activePage === 'nicknames'){
    navState.nicknameTab = NICKNAME_PAGE_STATE.tab;
  }
  try { localStorage.setItem(NAV_STATE_STORAGE_KEY, JSON.stringify(navState)); } catch (e) { /* storage unavailable (private browsing etc.) -> just skip persisting */ }
}

function restoreNavState(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(NAV_STATE_STORAGE_KEY)); } catch (e) { saved = null; }

  if (saved && PERSISTABLE_PAGES.includes(saved.page) && MODULES[saved.page]){
    STATE.activePage = saved.page;
    if (saved.page === 'beerclub' && PERSISTABLE_BEER_VIEWS.includes(saved.beerView)){
      BEER_STATE.view = saved.beerView;
    }
    if (saved.page === 'nicknames' && PERSISTABLE_NICKNAME_TABS.includes(saved.nicknameTab)){
      NICKNAME_PAGE_STATE.tab = saved.nicknameTab;
    }
  } else {
    STATE.activePage = 'home'; // onbekende/niet-meer-bestaande route -> terug naar Home
  }
}

function clearNavState(){
  try { localStorage.removeItem(NAV_STATE_STORAGE_KEY); } catch (e) { /* ignore */ }
}

async function isOfficeLoreMember(userId){
  const { data, error } = await sb
    .from('app_memberships')
    .select('id')
    .eq('user_id', userId)
    .eq('app_id', APP_ID)
    .eq('is_active', true)
    .limit(1);
  if (error){ console.error('Membership check failed:', error); return false; }
  return (data || []).length > 0;
}

async function handleSignedIn(session){
  AUTH_STATE.accessDenied = false;
  const isMember = await isOfficeLoreMember(session.user.id);
  if (!isMember){
    AUTH_STATE.accessDenied = true;
    STATE.activeUser = null;
    renderApp();
    return;
  }
  await refreshAppData();
  STATE.activeUser = session.user.id;
  restoreNavState();
  subscribeRealtime();
  renderApp();
}

async function submitLoginForm(event){
  event.preventDefault();
  const form = event.target;
  const email = form.email.value.trim();
  const password = form.password.value;
  AUTH_STATE.error = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ AUTH_STATE.error = 'Inloggen mislukt: e-mail of wachtwoord klopt niet.'; renderApp(); return; }
  // onAuthStateChange -> handleSignedIn() handles the rest
}

async function submitSignupForm(event){
  event.preventDefault();
  const form = event.target;
  const email = form.email.value.trim();
  const password = form.password.value;
  AUTH_STATE.error = '';
  if (password.length < 6){ AUTH_STATE.error = 'Wachtwoord moet minstens 6 tekens hebben.'; renderApp(); return; }
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: { app: APP_ID } } });
  if (error){ AUTH_STATE.error = 'Registreren mislukt: ' + (error.message === 'User already registered' ? 'dit e-mailadres heeft al een account.' : 'probeer opnieuw.'); renderApp(); return; }
  if (data.session){
    // e-mailbevestiging staat uit in dit project -> meteen ingelogd
    await handleSignedIn(data.session);
  } else {
    // e-mailbevestiging staat aan -> pas ingelogd na het klikken van de link in de mail
    AUTH_STATE.signupSent = true;
    renderApp();
  }
}

async function submitForgotPasswordForm(event){
  event.preventDefault();
  const form = event.target;
  const email = form.email.value.trim();
  AUTH_STATE.error = '';
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  if (error){ AUTH_STATE.error = 'Kon geen reset-mail versturen. Controleer het e-mailadres.'; renderApp(); return; }
  AUTH_STATE.forgotSent = true;
  renderApp();
}

async function submitNewPasswordForm(event){
  event.preventDefault();
  const form = event.target;
  const password = form.password.value;
  AUTH_STATE.error = '';
  const { error } = await sb.auth.updateUser({ password });
  if (error){ AUTH_STATE.error = 'Kon wachtwoord niet bijwerken. Probeer opnieuw.'; renderApp(); return; }
  window.location.hash = '';
  AUTH_STATE.mode = 'login';
  const { data: { session } } = await sb.auth.getSession();
  if (session) await handleSignedIn(session);
  else renderApp();
}

function el(html){

function emptyState(msg){

function escapeHtml(str){
  if (str === null || str === undefined) return '';
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function truncate(str, n){
  if (!str) return '';
  return str.length > n ? str.slice(0, n).trim() + '…' : str;
}

/* Veilig een vrije-tekstwaarde (bv. personRealName) binnen een
   inline onclick="...('...')"-string plaatsen. */
function escapeJs(str){
  if (str === null || str === undefined) return '';
  return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

/* Deterministisch, puur visueel "avatarje" op basis van een vrije
   naam-string — niets wordt hiervoor opgeslagen, alleen berekend op
   basis van de tekst zelf (zelfde naam = zelfde kleur/letter). */
function initialsAvatarHtml(name, size){
  const safeName = (name || '?').trim();
  const letter = safeName.charAt(0).toUpperCase() || '?';
  let hash = 0;
  for (let i = 0; i < safeName.length; i++) hash = (hash * 31 + safeName.charCodeAt(i)) >>> 0;
  const color = AVATAR_COLORS[hash % AVATAR_COLORS.length].value;
  return `<div class="avatar-emoji" style="width:${size}px;height:${size}px;background:${color};font-size:${Math.round(size * 0.42)}px;font-family:'Fredoka',sans-serif;font-weight:600;">${letter}</div>`;
}

/* Lore Score = som van alle sub-systemen die een user heeft
   BIJGEDRAGEN aan Office Lore: nickname-XP, quote-punten,
   anekdote-punten en counter-events die hij/zij zelf toevoegde
   (createdByUserId / addedBy / createdBy). Nicknames/quotes/
   anekdotes/counters gaan over collega's (vrije tekst), niet over
   de 3 users — de Lore Score meet dus wie het meest bijdraagt aan de
   lore, niet over wie de meeste lore gaat. */
function computeLoreScore(person){
  const nicknamePoints = getUserNicknames(person.id).reduce((sum, n) => sum + n.xp, 0);
  const quotePoints = getUserQuotes(person.id).reduce((sum, q) => sum + q.points, 0);
  const anecdotePoints = getUserAnecdotes(person.id).reduce((sum, a) => sum + a.points, 0);
  const counterPoints = getUserCounters(person.id).reduce((sum, c) => sum + c.total, 0);
  return nicknamePoints + quotePoints + anecdotePoints + counterPoints;
}
