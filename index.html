/* ---- The Abt Lord: overdreven ceremoniële troon voor Home ---- */
function renderAbtLordThrone(){
  const lordId = ABT_LORD_STATE.currentLordId;
  if (!lordId){
    return emptyState('Nog niemand heeft Beer XP verdiend. Log een Beer Session om de troon te claimen! 👑');
  }
  const u = findUser(lordId);
  const xp = computeBeerXp(lordId);
  const { level } = getBeerLevelInfo(xp);
  const stats = getBeerUserStats(lordId);
  const fallen = (ABT_LORD_STATE.fallenAbtId && ABT_LORD_STATE.fallenAbtId !== lordId) ? findUser(ABT_LORD_STATE.fallenAbtId) : null;

  const currentReign = APP_DATA.abtReigns.find(r => r.userId === lordId && !r.endedAt);
  const reignDays = currentReign ? getReignDays(currentReign) : 0;
  const longestReign = getLongestReignEver(lordId);
  const captures = getThroneCaptureCount(lordId);
  const totalDaysInPower = getTotalDaysInPower(lordId);

  const runnerUp = APP_DATA.users
    .filter(x => x.id !== lordId)
    .map(x => ({ user: x, xp: computeBeerXp(x.id) }))
    .sort((a, b) => b.xp - a.xp)[0];
  const lead = runnerUp ? xp - runnerUp.xp : null;
  const throneInDanger = lead !== null && lead < 10;

  return `
    <div class="abt-throne">
      <div class="abt-throne-crown">👑</div>
      <div class="abt-throne-title">✦ THE ABT LORD ✦</div>
      <div class="abt-throne-avatar">${userAvatarHtml(u, 100)}</div>
      <div class="abt-throne-name">${u.avatarEmoji} ${escapeHtml(u.displayName)}</div>
      <div class="abt-throne-subtitle">"May their glass never run dry."</div>
      ${currentReign ? `<div class="abt-throne-reigning">Reigning for ${reignDays} day${reignDays === 1 ? '' : 's'}</div>` : ''}
      <div class="abt-throne-level">${level.icon} ${level.label}</div>
      <div class="abt-throne-stats">
        <div class="abt-stat"><div class="num">${xp}</div><div class="label">🍺 Beer XP</div></div>
        <div class="abt-stat"><div class="num">${stats.totalQuantity}</div><div class="label">Bieren</div></div>
        <div class="abt-stat"><div class="num">${stats.uniqueBeers}</div><div class="label">Verschillend</div></div>
        <div class="abt-stat"><div class="num">${stats.avgRating !== null ? stats.avgRating : '—'}</div><div class="label">Gem. rating</div></div>
        <div class="abt-stat"><div class="num">${stats.perfectPours}</div><div class="label">Perfect Pours</div></div>
      </div>
      <div class="abt-throne-stats abt-throne-dynasty-stats">
        <div class="abt-stat"><div class="num">🏰 ${longestReign}d</div><div class="label">Longest Reign</div></div>
        <div class="abt-stat"><div class="num">⚔️ ${captures}×</div><div class="label">Throne Captured</div></div>
        <div class="abt-stat"><div class="num">👑 ${totalDaysInPower}d</div><div class="label">Total Days in Power</div></div>
      </div>
      ${runnerUp ? `
        <div class="abt-throne-lead ${throneInDanger ? 'danger' : ''}">
          ${throneInDanger ? '⚠️ THE THRONE IS IN DANGER — ' : '⚔️ '}Lead over ${escapeHtml(runnerUp.user.displayName)}: +${lead} XP
        </div>
      ` : ''}
      ${fallen ? `
        <div class="fallen-abt-badge">
          <span class="badge peach">💀 The Fallen Abt: ${fallen.avatarEmoji} ${escapeHtml(fallen.displayName)}</span>
        </div>
      ` : ''}
    </div>
  `;
}

/* Best beoordeeld bier BINNEN één specifieke sessie (i.p.v. over-all) --
   zelfde soort per-bier-gemiddelde als getBeerAverageScore, maar enkel
   over de entries van deze ene sessie. */
function getBestRatedBeerInSession(session){
  const byBeer = {};
  session.entries.forEach(e => {
    if (typeof e.score !== 'number') return;
    (byBeer[e.beerId] = byBeer[e.beerId] || []).push(e.score);
  });
  let best = null;
  Object.entries(byBeer).forEach(([beerId, scores]) => {
    const avg = Math.round((scores.reduce((a, b) => a + b, 0) / scores.length) * 10) / 10;
    if (!best || avg > best.avg) best = { beer: APP_DATA.beers.find(b => b.id === beerId), avg };
  });
  return (best && best.beer) ? best : null;
}

/* ---- The Beer Fridge: search + style-filter + Top Rated sort +
   Bottles/List view, zelfde partial-rerender-op-een-mount-punt en
   localStorage-view-voorkeur-patroon als de Nicknames Cards/Compact-
   en zoek/filter-UI (NICKNAME_FILTER_STATE/NICKNAME_VIEW_STATE) --
   geen nieuw patroon, hergebruikt. ---- */
const BEER_FRIDGE_FILTER_STATE = { search: '', style: 'all', topRatedOnly: false };
const BEER_FRIDGE_VIEW_MODE_STORAGE_KEY = 'officeLoreBeerFridgeViewMode';
function loadBeerFridgeViewMode(){
  try {
    const saved = localStorage.getItem(BEER_FRIDGE_VIEW_MODE_STORAGE_KEY);
    if (saved === 'bottles' || saved === 'list') return saved;
  } catch (e) { /* private browsing etc. */ }
  return 'bottles';
}
const BEER_FRIDGE_VIEW_STATE = { mode: loadBeerFridgeViewMode() };

function switchBeerFridgeViewMode(mode){
  BEER_FRIDGE_VIEW_STATE.mode = mode;
  try { localStorage.setItem(BEER_FRIDGE_VIEW_MODE_STORAGE_KEY, mode); } catch (e) { /* private browsing etc. */ }
  rerenderBeerFridgeResults();
}

function updateBeerFridgeSearch(value){
  BEER_FRIDGE_FILTER_STATE.search = value;
  rerenderBeerFridgeResults();
}
function updateBeerFridgeStyleFilter(style){
  BEER_FRIDGE_FILTER_STATE.style = style;
  rerenderBeerFridgeResults();
}
function toggleBeerFridgeTopRated(){
  BEER_FRIDGE_FILTER_STATE.topRatedOnly = !BEER_FRIDGE_FILTER_STATE.topRatedOnly;
  rerenderBeerFridgeResults();
}

function getFilteredBeers(){
  const q = BEER_FRIDGE_FILTER_STATE.search.trim().toLowerCase();
  let beers = APP_DATA.beers.filter(b => {
    if (BEER_FRIDGE_FILTER_STATE.style !== 'all' && b.style !== BEER_FRIDGE_FILTER_STATE.style) return false;
    if (q && !(`${b.name} ${b.brewery} ${b.style}`.toLowerCase().includes(q))) return false;
    return true;
  });
  if (BEER_FRIDGE_FILTER_STATE.topRatedOnly){
    beers = beers.filter(b => getBeerAverageScore(b.id) !== null).sort((a, b) => getBeerAverageScore(b.id) - getBeerAverageScore(a.id));
  }
  return beers;
}

function renderBeerFridgeResultsHtml(){
  const beers = getFilteredBeers();
  if (!beers.length) return emptyState('Geen bieren gevonden. Pas je zoekopdracht of filter aan.');
  if (BEER_FRIDGE_VIEW_STATE.mode === 'list') return `<div class="row-list">${beers.map(renderBeerListRow).join('')}</div>`;
  return `<div class="grid cols-wide-lg">${beers.map(renderBeerCard).join('')}</div>`;
}

function rerenderBeerFridgeResults(){
  const mount = document.getElementById('beer-fridge-results-mount');
  if (mount) mount.innerHTML = renderBeerFridgeResultsHtml();
}

  openModal(renderBeerFormHtml(mode, beer));
}

function handleBeerPhotoUpload(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    beerFormPhoto = e.target.result;
    const clearBtn = document.getElementById('beer-clear-photo-btn');
    if (clearBtn) clearBtn.style.display = 'inline-flex';
    const preview = document.getElementById('beer-photo-preview');
    if (preview) preview.innerHTML = beerPhotoHtml(beerFormPhoto, 72);
  };
  reader.readAsDataURL(file);
}

function clearBeerPhoto(){
  beerFormPhoto = null;
  const clearBtn = document.getElementById('beer-clear-photo-btn');
  if (clearBtn) clearBtn.style.display = 'none';
  const preview = document.getElementById('beer-photo-preview');
  if (preview) preview.innerHTML = beerPhotoHtml(null, 72);
}

async function submitBeerForm(event){
  event.preventDefault();
  const form = event.target;
  const mode = form.dataset.mode;
  const editId = form.dataset.id;

  const name = document.getElementById('bf-name').value.trim();
  const brewery = document.getElementById('bf-brewery').value.trim();
  const style = document.getElementById('bf-style').value.trim();
  const abvRaw = document.getElementById('bf-abv').value;
  const abv = abvRaw === '' ? null : Math.max(0, parseFloat(abvRaw));
  const country = document.getElementById('bf-country').value.trim();
  const errorEl = document.getElementById('bf-error');

  if (!name || !brewery || !style){
    errorEl.textContent = 'Vul minstens naam, brouwerij en type in.';
    return false;
  }
  // Een bier mag maar één keer als uniek bier voorkomen (zelfde naam + brouwerij).
  if (isDuplicateBeer(name, brewery, mode === 'edit' ? editId : null)){
    errorEl.textContent = 'Dit bier (zelfde naam + brouwerij) staat al in de Beer Database.';
    return false;
  }
  errorEl.textContent = '';

  let error;
  if (mode === 'edit'){
    ({ error } = await sb.from('beers').update({
      name, brewery, beer_style: style, alcohol_percentage: abv, country, image_url: beerFormPhoto,
    }).eq('id', editId));
  } else {
    ({ error } = await sb.from('beers').insert({
      name, brewery, beer_style: style, alcohol_percentage: abv, country, image_url: beerFormPhoto,
      created_by_user_id: STATE.activeUser,
    }));
  }

  if (error){
    errorEl.textContent = error.code === '23505' ? 'Dit bier (zelfde naam + brouwerij) staat al in de Beer Database.' : 'Opslaan mislukt, probeer opnieuw.';
    return false;
  }

  await refreshAppData();
  closeModal();
  renderPage();
  return false;
}

async function confirmDeleteBeer(id){
  const b = APP_DATA.beers.find(x => x.id === id);
  if (!b) return;

  const [{ count: consumptionCount }, { count: ratingCount }] = await Promise.all([
    sb.from('beer_consumption').select('id', { count: 'exact', head: true }).eq('beer_id', id),
    sb.from('beer_ratings').select('id', { count: 'exact', head: true }).eq('beer_id', id),
  ]);
  const sessionCount = new Set(
    APP_DATA.beerSessions.filter(s => s.beerIds.includes(id)).map(s => s.id)
  ).size;
  const inUse = (consumptionCount || 0) > 0 || (ratingCount || 0) > 0;

  openModal(`
    <h3>🗑️ Bier verwijderen?</h3>
    ${inUse ? `
      <p>"${escapeHtml(b.name)}" is al ${consumptionCount || 0}× geregistreerd${sessionCount ? ` in ${sessionCount} sessie${sessionCount === 1 ? '' : 's'}` : ''} met ${ratingCount || 0} rating${ratingCount === 1 ? '' : 's'}. Verwijderen wist al die consumptie, ratings en de bijhorende XP definitief. Dit kan niet ongedaan gemaakt worden.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
        <button type="button" class="btn btn-danger" onclick="performDeleteBeer('${id}')">Bier en alle gerelateerde data verwijderen</button>
      </div>
    ` : `
      <p>"${escapeHtml(b.name)}" wordt definitief verwijderd. Dit bier is nog niet gebruikt in een sessie of rating.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
        <button type="button" class="btn btn-danger" onclick="performDeleteBeer('${id}')">Ja, verwijderen</button>
      </div>
    `}
  `);
}

async function performDeleteBeer(id){
  await sb.from('beers').delete().eq('id', id);
  await refreshAppData();
  closeModal();
  if (BEER_STATE.beerDetailId === id){
    BEER_STATE.view = 'database';
    BEER_STATE.beerDetailId = null;
  }
  renderPage();
}

function openStandaloneRatingForm(beerId){

          <input class="form-input" id="sr-score" type="number" min="0" max="10" step="0.5" value="7" required>
        </div>
        <div class="form-field">

        </div>

      <div class="form-actions">

        <button type="submit" class="btn btn-primary">Rating toevoegen</button>
      </div>

  `);

async function submitStandaloneRatingForm(event){
  event.preventDefault();
  const form = event.target;
  const beerId = form.dataset.beerId;
  const errorEl = document.getElementById('sr-error');

  const score = Math.max(0, Math.min(10, parseFloat(document.getElementById('sr-score').value)));
  const date = document.getElementById('sr-date').value;
  const review = document.getElementById('sr-review').value.trim();
  const quantityRaw = document.getElementById('sr-quantity').value;
  const quantity = quantityRaw === '' ? 0 : Math.max(0, parseInt(quantityRaw, 10) || 0);
  const context = document.getElementById('sr-context').value.trim();

  if (!score || !date){
    errorEl.textContent = 'Vul minstens een score en datum in.';
    return false;
  }
  errorEl.textContent = '';

  const { error: ratingError } = await sb.from('beer_ratings').insert({
    beer_id: beerId, session_id: null, user_id: STATE.activeUser,
    rating: score, review, rated_at: date, context: context || null,
  });
  if (ratingError){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return false; }

  if (quantity > 0){
    await sb.from('beer_consumption').insert({ beer_id: beerId, session_id: null, user_id: STATE.activeUser, quantity });
  }

  await refreshAppData();
  closeModal();
  renderPage();
  return false;
}

function confirmDeleteStandaloneRating(ratingId, beerId){
  openModal(`
    <h3>🗑️ Losse rating verwijderen?</h3>
    <p>Deze rating (en het bijhorende aantal, indien ingevuld) wordt definitief verwijderd. Dit kan niet ongedaan gemaakt worden.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
      <button type="button" class="btn btn-danger" onclick="performDeleteStandaloneRating('${ratingId}','${beerId}')">Ja, verwijderen</button>
    </div>
  `);
}

async function performDeleteStandaloneRating(ratingId, beerId){
  const entry = APP_DATA.standaloneBeerEntries.find(e => e.kind === 'rating' && e.id === ratingId);
  await sb.from('beer_ratings').delete().eq('id', ratingId);
  // best-effort: ook de gekoppelde losse consumptie-registratie opruimen (zelfde matching als bij het laden)
  if (entry && entry.quantity > 0){
    await sb.from('beer_consumption')
      .delete()
      .eq('beer_id', beerId)
      .eq('user_id', entry.userId)
      .is('session_id', null)
      .eq('quantity', entry.quantity)
      .gte('created_at', new Date(new Date(entry.createdAt).getTime() - 5000).toISOString())
      .lte('created_at', new Date(new Date(entry.createdAt).getTime() + 5000).toISOString());
  }
  await refreshAppData();
  closeModal();
  renderPage();
}

/* ---- nieuwe-sessie-formulier / bewerk-formulier (eigen pagina, geen modal) ----
   Zelfde formulier voor 'add' en 'edit': BEER_STATE.sessionFormMode +
   .sessionFormEditId bepalen welke modus, zelfde patroon als
   openBeerForm(mode, id). Bij edit wordt SESSION_DRAFT vooraf gevuld
   vanuit de bestaande sessie zodat de matrix meteen alles toont. */
function openSessionForm(mode, sessionId, terracePrefill){
  const editMode = mode === 'edit';
  const session = editMode ? APP_DATA.beerSessions.find(s => s.id === sessionId) : null;
  if (editMode && !session){
    BEER_STATE.view = 'sessions';
    renderPage();
    return;
  }

  BEER_STATE.sessionFormMode = editMode ? 'edit' : 'add';
  BEER_STATE.sessionFormEditId = editMode ? sessionId : null;

  if (editMode){
    const perParticipant = {};
    session.participantIds.forEach(userId => {
      perParticipant[userId] = session.entries
        .filter(e => e.userId === userId)
        .map(e => ({ beerId: e.beerId, quantity: e.quantity || 0, score: e.score || 0, review: e.review || '', persisted: true }));
    });
    SESSION_DRAFT = { participantIds: [...session.participantIds], perParticipant, prefillDate: null, prefillLocation: null, terraceEventId: null };
  } else if (terracePrefill){
    SESSION_DRAFT = {
      participantIds: [...terracePrefill.participantIds],
      perParticipant: {},
      prefillDate: terracePrefill.date || null,
      prefillLocation: terracePrefill.location || null,
      terraceEventId: terracePrefill.terraceEventId || null,
    };
  } else {
    SESSION_DRAFT = { participantIds: [], perParticipant: {}, prefillDate: null, prefillLocation: null, terraceEventId: null };
  }

  BEER_STATE.view = 'sessionForm';
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelSessionForm(){
  if (BEER_STATE.sessionFormMode === 'edit' && BEER_STATE.sessionFormEditId){
    BEER_STATE.view = 'sessionDetail';
    BEER_STATE.sessionDetailId = BEER_STATE.sessionFormEditId;
  } else {
    BEER_STATE.view = 'sessions';
  }
  renderPage();
}

function toggleSessionParticipant(userId, btn){
  const idx = SESSION_DRAFT.participantIds.indexOf(userId);
  if (idx === -1){
    SESSION_DRAFT.participantIds.push(userId);
    if (!SESSION_DRAFT.perParticipant[userId]) SESSION_DRAFT.perParticipant[userId] = [];
    btn.classList.toggle('btn-primary');
    btn.classList.toggle('btn-ghost');
    renderParticipantBeerLists();
    return;
  }

  // deelnemer met al bestaande (persisted) sessiedata mag niet zomaar
  // stilzwijgend verdwijnen -> bevestiging met échte aantallen tonen
  const lines = SESSION_DRAFT.perParticipant[userId] || [];
  const hasPersistedData = lines.some(l => l.persisted);
  if (hasPersistedData && BEER_STATE.sessionFormMode === 'edit'){
    confirmRemoveParticipant(userId);
    return;
  }

  SESSION_DRAFT.participantIds.splice(idx, 1);
  btn.classList.toggle('btn-primary');
  btn.classList.toggle('btn-ghost');
  renderParticipantBeerLists();
}

function confirmRemoveParticipant(userId){
  const u = findUser(userId);
  const lines = SESSION_DRAFT.perParticipant[userId] || [];
  const beerCount = lines.reduce((sum, l) => sum + (l.quantity || 0), 0);
  const ratingCount = lines.filter(l => l.score > 0).length;

  openModal(`
    <h3>🗑️ Deelnemer verwijderen?</h3>
    <p>${escapeHtml(u.displayName)} heeft al ${beerCount} bier${beerCount === 1 ? '' : 'en'} en ${ratingCount} rating${ratingCount === 1 ? '' : 's'} in deze sessie. Als je ${escapeHtml(u.displayName)} verwijdert, verdwijnt al die data mee — dit kan niet ongedaan gemaakt worden.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
      <button type="button" class="btn btn-danger" onclick="performRemoveParticipant('${userId}')">${escapeHtml(u.displayName)} en hun data verwijderen</button>
    </div>
  `);
}

async function performRemoveParticipant(userId){
  const sessionId = BEER_STATE.sessionFormEditId;
  await sb.from('beer_session_participants').delete().eq('session_id', sessionId).eq('user_id', userId);
  await sb.from('beer_ratings').delete().eq('session_id', sessionId).eq('user_id', userId);
  await sb.from('beer_consumption').delete().eq('session_id', sessionId).eq('user_id', userId);

  await refreshAppData();
  closeModal();

  const idx = SESSION_DRAFT.participantIds.indexOf(userId);
  if (idx !== -1) SESSION_DRAFT.participantIds.splice(idx, 1);
  delete SESSION_DRAFT.perParticipant[userId];

  renderPage();
}

/* Per-deelnemer kaarten met hun eigen bierregels + "+ Add beer for X"
   -- bewust GEEN bier×deelnemer-matrix meer. Een bierregel bestaat
   alleen als hij expliciet voor die ene deelnemer is toegevoegd, dus
   een bier toevoegen voor Nick kan nooit een regel voor Elien/Atti
   aanmaken (de bug die dit vervangt). */
function buildParticipantBeerListsHtml(){
  if (!SESSION_DRAFT.participantIds.length){
    return emptyState('Kies minstens één deelnemer om bieren te registreren.');
  }

  return SESSION_DRAFT.participantIds.map(userId => {
    const u = findUser(userId);
    const lines = SESSION_DRAFT.perParticipant[userId] || [];
    const isMe = userId === STATE.activeUser;
    return `
      <div class="sticker-card" style="text-align:left; margin-bottom:12px;">

/* ---- "+ Add beer for X" / bierregel bewerken -- altijd voor precies
   één deelnemer, nooit voor de rest van de sessie. lineIndex meegeven
   = bestaande regel rechtstreeks bewerken (zet de waarden); weglaten
   = "voeg bier toe"-modus, die het aantal VERHOOGT i.p.v. een

function openAddBeerLineModal(userId, lineIndex){
  const u = findUser(userId);
  const isEdit = typeof lineIndex === 'number';
  const line = isEdit ? SESSION_DRAFT.perParticipant[userId][lineIndex] : null;

  openModal(`
    <h3>🍺 ${isEdit ? 'Bier bewerken' : 'Bier toevoegen'} — ${escapeHtml(u.displayName)}</h3>
    <form data-user-id="${userId}" data-line-index="${isEdit ? lineIndex : ''}" onsubmit="return submitAddBeerLine(event)">
      <div class="form-field">
        <label class="form-label" for="abl-beer">Bier *</label>
        <select class="form-input" id="abl-beer" required>
          <option value="" ${!line ? 'selected' : ''} disabled>— kies een bier —</option>
          ${APP_DATA.beers.map(b => `<option value="${b.id}" ${line && line.beerId === b.id ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
        </select>
        ${!APP_DATA.beers.length ? emptyState('Voeg eerst een bier toe via de Beer Database.') : ''}
      </div>
      <div class="form-grid" style="margin-top:10px;">
        <div class="form-field">
          <label class="form-label" for="abl-quantity">Aantal *</label>
          <input class="form-input" id="abl-quantity" type="number" min="${isEdit ? 0 : 1}" step="1" value="${isEdit ? line.quantity : 1}" required>
          ${isEdit ? '<div class="form-hint" style="font-size:11.5px; color:#8a7a6b; margin-top:4px;">0 invullen verwijdert dit bier uit de sessie.</div>' : ''}
        </div>
        <div class="form-field">
          <label class="form-label" for="abl-score">Score (0-10)</label>
          <input class="form-input" id="abl-score" type="number" min="0" max="10" step="0.5" value="${isEdit && line.score > 0 ? line.score : ''}" placeholder="Optioneel">
        </div>
      </div>
      <div class="form-field" style="margin-top:10px;">
        <label class="form-label" for="abl-review">Review</label>
        <input class="form-input" id="abl-review" type="text" value="${isEdit ? escapeHtml(line.review) : ''}" placeholder="Optioneel">
      </div>
      <div id="abl-error" class="form-error"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
        <button type="submit" class="btn btn-primary">${isEdit ? 'Opslaan' : 'Toevoegen'}</button>
      </div>
    </form>
  `);
}

function submitAddBeerLine(event){
  event.preventDefault();
  const form = event.target;
  const userId = form.dataset.userId;
  const lineIndexRaw = form.dataset.lineIndex;
  const isEdit = lineIndexRaw !== '';
  const errorEl = document.getElementById('abl-error');

  const beerId = document.getElementById('abl-beer').value;
  const quantityInput = parseInt(document.getElementById('abl-quantity').value, 10);
  const quantity = isNaN(quantityInput) ? (isEdit ? 0 : 1) : Math.max(0, quantityInput);
  const scoreRaw = document.getElementById('abl-score').value;
  const score = scoreRaw === '' ? 0 : Math.max(0, Math.min(10, parseFloat(scoreRaw) || 0));
  const review = document.getElementById('abl-review').value.trim();

  if (!beerId){ errorEl.textContent = 'Kies een bier.'; return false; }

  if (!SESSION_DRAFT.perParticipant[userId]) SESSION_DRAFT.perParticipant[userId] = [];
  const lines = SESSION_DRAFT.perParticipant[userId];

  if (isEdit){
    const idx = parseInt(lineIndexRaw, 10);
    const existingLine = lines[idx];
    if (quantity === 0){
      // aantal op 0 zetten is hetzelfde als verwijderen: voor een
      // reeds opgeslagen regel via de bevestigde delete-flow, voor een
      // nog niet opgeslagen regel gewoon lokaal weg (niets te verliezen)
      closeModal();
      if (existingLine && existingLine.persisted){
        confirmRemoveBeerLine(BEER_STATE.sessionFormEditId, userId, existingLine.beerId);
      } else if (existingLine){
        lines.splice(idx, 1);
        renderParticipantBeerLists();
      }
      return false;
    }
    lines[idx] = { ...existingLine, beerId, quantity, score, review };
  } else {
    if (quantity < 1){ errorEl.textContent = 'Vul een aantal in.'; return false; }
    const existingIdx = lines.findIndex(l => l.beerId === beerId);
    if (existingIdx !== -1){
      // zelfde bier nogmaals toegevoegd voor deze ene deelnemer -> aantal verhogen, geen duplicaat
      lines[existingIdx] = {
        beerId, quantity: lines[existingIdx].quantity + quantity,
        score: score > 0 ? score : lines[existingIdx].score,
        review: review || lines[existingIdx].review,
      };
    } else {
      lines.push({ beerId, quantity, score, review });
    }
  }

  closeModal();
  renderParticipantBeerLists();
  return false;
}

function removeBeerLine(userId, lineIndex){
  const lines = SESSION_DRAFT.perParticipant[userId];
  if (!lines || !lines[lineIndex]) return;
  const line = lines[lineIndex];

  // een regel die al in de DB staat mag niet zomaar stilzwijgend
  // verdwijnen -> bevestigen en meteen verwijderen (los van "Wijzigingen
  // opslaan"), een nog niet opgeslagen regel mag gewoon lokaal weg
  if (line.persisted){
    confirmRemoveBeerLine(BEER_STATE.sessionFormEditId, userId, line.beerId);
    return;
  }
  lines.splice(lineIndex, 1);
  renderParticipantBeerLists();
}

function confirmRemoveBeerLine(sessionId, userId, beerId){
  const u = findUser(userId);
  const beer = APP_DATA.beers.find(b => b.id === beerId);
  const session = APP_DATA.beerSessions.find(s => s.id === sessionId);
  const entry = session ? session.entries.find(e => e.userId === userId && e.beerId === beerId) : null;
  const hasRating = !!entry && typeof entry.score === 'number' && entry.score > 0;

  openModal(`
    <h3>🗑️ Bier verwijderen uit sessie?</h3>
    <p>Weet je zeker dat je <strong>${beer ? escapeHtml(beer.name) : 'dit bier'}</strong> wilt verwijderen uit ${escapeHtml(u.displayName)}'s consumptie in deze sessie?</p>
    ${hasRating ? `
      <label style="display:flex; align-items:center; gap:8px; margin:12px 0; font-size:13px; font-weight:700;">
        <input type="checkbox" id="rbl-remove-rating"> Ook de sessie-rating verwijderen (${entry.score}/10)
      </label>
    ` : ''}
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
      <button type="button" class="btn btn-danger" onclick="performRemoveBeerLine('${sessionId}','${userId}','${beerId}')">Verwijderen</button>
    </div>
  `);
}

async function performRemoveBeerLine(sessionId, userId, beerId){
  const removeRatingCheckbox = document.getElementById('rbl-remove-rating');
  const alsoRemoveRating = removeRatingCheckbox ? removeRatingCheckbox.checked : false;

  await sb.from('beer_consumption').delete().eq('session_id', sessionId).eq('user_id', userId).eq('beer_id', beerId);
  if (alsoRemoveRating){
    await sb.from('beer_ratings').delete().eq('session_id', sessionId).eq('user_id', userId).eq('beer_id', beerId);
  }

  await refreshAppData();
  closeModal();

  // draft-regels van deze ene deelnemer herbouwen vanuit de verse data,
  // zodat een bewaarde rating (checkbox uit) correct als losse regel
  // blijft staan i.p.v. de hele regel lokaal te laten verdwijnen
  const freshSession = APP_DATA.beerSessions.find(s => s.id === sessionId);
  if (freshSession){
    SESSION_DRAFT.perParticipant[userId] = freshSession.entries
      .filter(e => e.userId === userId)
      .map(e => ({ beerId: e.beerId, quantity: e.quantity || 0, score: e.score || 0, review: e.review || '', persisted: true }));
  }

  renderPage();
}

async function submitSessionForm(){
  const errorEl = document.getElementById('sf-error');
  const date = document.getElementById('sf-date').value;
  const location = document.getElementById('sf-location').value.trim();

  if (!date){
    errorEl.textContent = 'Kies een datum.';
    return;
  }
  if (!SESSION_DRAFT.participantIds.length){
    errorEl.textContent = 'Kies minstens één deelnemer.';
    return;
  }
  errorEl.textContent = '';

  const editMode = BEER_STATE.sessionFormMode === 'edit';
  const editId = BEER_STATE.sessionFormEditId;

  if (editMode){
    const ok = await saveEditedSession(editId, date, location);
    if (!ok){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return; }
    await refreshAppData();
    BEER_STATE.sessionFormMode = null;
    BEER_STATE.sessionFormEditId = null;
    BEER_STATE.view = 'sessionDetail';
    BEER_STATE.sessionDetailId = editId;
    renderPage();
    return;
  }

  const { data: session, error: sessionError } = await sb.from('beer_sessions').insert({
    session_date: date, location, created_by_user_id: STATE.activeUser,
  }).select().single();
  if (sessionError){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return; }

  await sb.from('beer_session_participants').insert(
    SESSION_DRAFT.participantIds.map(userId => ({ session_id: session.id, user_id: userId }))
  );

  const ratingRows = [];
  const consumptionRows = [];
  SESSION_DRAFT.participantIds.forEach(userId => {
    (SESSION_DRAFT.perParticipant[userId] || []).forEach(line => {
      if (line.score > 0) ratingRows.push({ beer_id: line.beerId, user_id: userId, rating: line.score, review: line.review });
      if (line.quantity > 0) consumptionRows.push({ beer_id: line.beerId, user_id: userId, quantity: line.quantity });
    });
  });
  if (ratingRows.length){
    await sb.from('beer_ratings').insert(ratingRows.map(r => ({ ...r, session_id: session.id })));
  }
  if (consumptionRows.length){
    await sb.from('beer_consumption').insert(consumptionRows.map(c => ({ ...c, session_id: session.id })));
  }

  if (SESSION_DRAFT.terraceEventId){
    await sb.from('terrace_events').update({ linked_beer_session_id: session.id }).eq('id', SESSION_DRAFT.terraceEventId);
  }

  await refreshAppData();
  BEER_STATE.view = 'sessions';
  renderPage();
}

/* ---- bestaande sessie bewerken: diff PER DEELNEMER tegen wat er al
   in de DB staat (nooit globaal per bier), zodat:
   - een bierregel die alleen voor deelnemer X bestond nooit records
     voor andere deelnemers aanmaakt of verwijdert (de kern van deze bugfix)
   - XP nooit dubbel toegekend wordt:
     - nieuwe rating/consumptie -> insert (triggert bestaande XP-regels)
     - bestaande rating gewijzigd -> update, GEEN nieuwe rating-XP
     - bestaand aantal gewijzigd -> update, delta-XP-trigger kent
       alleen het verschil toe (zie 0005_beer_session_editing.sql)
     - regel verwijderd -> delete (ruimt ook de bijhorende XP op, zie
       0003_xp_cleanup_triggers.sql)
   - deelnemer volledig uit de sessie gehaald -> al zijn/haar rijen
     voor deze sessie verwijderen (nooit die van anderen) */
async function saveEditedSession(sessionId, date, location){
  const existingSession = APP_DATA.beerSessions.find(s => s.id === sessionId);
  if (!existingSession) return false;

  const { error: updateErr } = await sb.from('beer_sessions')
    .update({ session_date: date, location })
    .eq('id', sessionId);
  if (updateErr) return false;

  const oldParticipants = existingSession.participantIds;
  const newParticipants = SESSION_DRAFT.participantIds;
  const removedParticipants = oldParticipants.filter(id => !newParticipants.includes(id));
  const addedParticipants = newParticipants.filter(id => !oldParticipants.includes(id));

  if (removedParticipants.length){
    await sb.from('beer_session_participants').delete().eq('session_id', sessionId).in('user_id', removedParticipants);
    await sb.from('beer_ratings').delete().eq('session_id', sessionId).in('user_id', removedParticipants);
    await sb.from('beer_consumption').delete().eq('session_id', sessionId).in('user_id', removedParticipants);
  }
  if (addedParticipants.length){
    await sb.from('beer_session_participants').insert(addedParticipants.map(userId => ({ session_id: sessionId, user_id: userId })));
  }

  for (const userId of newParticipants){
    const draftLines = SESSION_DRAFT.perParticipant[userId] || [];
    const existingLines = existingSession.entries.filter(e => e.userId === userId);

    // bieren die deze ene deelnemer niet meer heeft -> enkel HAAR/ZIJN rij verwijderen
    const removedBeerIds = existingLines.map(e => e.beerId).filter(bid => !draftLines.some(l => l.beerId === bid));
    if (removedBeerIds.length){
      await sb.from('beer_ratings').delete().eq('session_id', sessionId).eq('user_id', userId).in('beer_id', removedBeerIds);
      await sb.from('beer_consumption').delete().eq('session_id', sessionId).eq('user_id', userId).in('beer_id', removedBeerIds);
    }

    for (const line of draftLines){
      const existingEntry = existingLines.find(e => e.beerId === line.beerId);
      const hadRating = !!existingEntry && typeof existingEntry.score === 'number' && existingEntry.score > 0;
      const hadConsumption = !!existingEntry && existingEntry.quantity > 0;

      if (line.score > 0 && !hadRating){
        await sb.from('beer_ratings').insert({ beer_id: line.beerId, session_id: sessionId, user_id: userId, rating: line.score, review: line.review });
      } else if (line.score > 0 && hadRating){
        if (line.score !== existingEntry.score || line.review !== (existingEntry.review || '')){
          await sb.from('beer_ratings').update({ rating: line.score, review: line.review }).eq('beer_id', line.beerId).eq('session_id', sessionId).eq('user_id', userId);
        }
      } else if (line.score <= 0 && hadRating){
        await sb.from('beer_ratings').delete().eq('beer_id', line.beerId).eq('session_id', sessionId).eq('user_id', userId);
      }

      if (line.quantity > 0 && !hadConsumption){
        await sb.from('beer_consumption').insert({ beer_id: line.beerId, session_id: sessionId, user_id: userId, quantity: line.quantity });
      } else if (line.quantity > 0 && hadConsumption && line.quantity !== existingEntry.quantity){
        await sb.from('beer_consumption').update({ quantity: line.quantity }).eq('beer_id', line.beerId).eq('session_id', sessionId).eq('user_id', userId);
      } else if (line.quantity <= 0 && hadConsumption){
        await sb.from('beer_consumption').delete().eq('beer_id', line.beerId).eq('session_id', sessionId).eq('user_id', userId);
      }
    }
  }

  return true;
}

function confirmDeleteSession(sessionId){

const POEM_MOODS = [

  { id: 'melancholic',   icon: '🥀', label: 'Melancholic' },

  { id: 'dramatic',      icon: '🎭', label: 'Dramatic' },

];

const POEM_REACTION_TYPES = [
  { id: 'charming',              icon: '🥰', label: 'Charming' },
  { id: 'creative',              icon: '🎨', label: 'Creative' },
  { id: 'tragic',                icon: '🥀', label: 'Tragic' },
  { id: 'comedy_gold',           icon: '😂', label: 'Comedy Gold' },
  { id: 'deep',                  icon: '🧠', label: 'Deep' },
  { id: 'beer_inspired',         icon: '🍺', label: 'Beer Inspired' },
  { id: 'what_did_i_just_read',  icon: '🤨', label: 'What Did I Just Read?' },
  { id: 'actually_good',         icon: '🔥', label: 'Actually Good' },
  { id: 'emotional_damage',      icon: '💀', label: 'Emotional Damage' },
];

const POEM_XP_RULES = {
  published: 5,          // gedicht publiceren (nooit opnieuw bij bewerken, alleen bij INSERT)
  reactionReceived: 1,    // elke ontvangen reaction, ongeacht type
  actuallyGoodBonus: 5,   // eenmalig: beide andere users gaven Actually Good
};

const POEM_LEVELS = [
  { min: 0,   max: 19,       label: 'The Scribbler',          icon: '✏️' },
  { min: 20,  max: 49,       label: 'The Poet',                icon: '📜' },
  { min: 50,  max: 99,       label: 'Wordsmith',               icon: '🪶' },
  { min: 100, max: 199,      label: 'The Bard',                icon: '🎭' },
  { min: 200, max: Infinity, label: 'Poet Laureate Material',  icon: '👑' },
];

function getPoemLevelInfo(xp){
  const idx = POEM_LEVELS.findIndex(l => xp >= l.min && xp <= l.max);
  const level = POEM_LEVELS[idx === -1 ? POEM_LEVELS.length - 1 : idx];
  const next = POEM_LEVELS[POEM_LEVELS.indexOf(level) + 1] || null;
  if (!next) return { level, next: null, progressPct: 100, xpToNext: 0 };
  const span = next.min - level.min;
  const progressPct = Math.max(0, Math.min(100, Math.round(((xp - level.min) / span) * 100)));
  return { level, next, progressPct, xpToNext: next.min - xp };
}

function computePoemXp(userId){
  let xp = 0;
  APP_DATA.poems.filter(p => p.authorUserId === userId).forEach(p => {
    xp += POEM_XP_RULES.published;
    xp += POEM_REACTION_TYPES.reduce((sum, r) => sum + (p.reactions[r.id] || []).length, 0) * POEM_XP_RULES.reactionReceived;
    if (p.actuallyGoodBonusAwarded) xp += POEM_XP_RULES.actuallyGoodBonus;
  });
  return xp;
}

function countReceivedReactions(userId, reactionType){
  return APP_DATA.poems.filter(p => p.authorUserId === userId)
    .reduce((sum, p) => sum + (p.reactions[reactionType] || []).length, 0);
}

function getMostReceivedReaction(userId){
  const totals = POEM_REACTION_TYPES.map(r => ({ ...r, count: countReceivedReactions(userId, r.id) }))
    .filter(r => r.count > 0)
    .sort((a, b) => b.count - a.count);
  return totals[0] || null;
}

/* ---------- Poem of the Month ----------
   Puur afgeleid, zelfde filosofie als getQuoteOfTheWeek/
   getNicknameOfTheMonth: geen opslag, dus "POTM-status verwijderen"
   bij het weggooien van een gedicht gebeurt vanzelf bij de volgende
   herberekening. */
function getPoemOfTheMonth(){
  const monthPrefix = todayISO().slice(0, 7);
  const candidates = APP_DATA.poems.filter(p => p.createdAt.slice(0, 7) === monthPrefix);
  if (!candidates.length) return null;
  const scored = candidates.map(p => {
    let score = 0;
    const uniqueUsers = new Set();
    POEM_REACTION_TYPES.forEach(r => {
      const perPoint = (r.id === 'actually_good' || r.id === 'creative') ? 2 : 1;
      (p.reactions[r.id] || []).forEach(uid => { score += perPoint; uniqueUsers.add(uid); });
    });
    return { poem: p, score, uniqueUserCount: uniqueUsers.size };
  });
  scored.sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    if (b.uniqueUserCount !== a.uniqueUserCount) return b.uniqueUserCount - a.uniqueUserCount;
    return a.poem.createdAt.localeCompare(b.poem.createdAt); // tie -> oudste gedicht van de maand wint
  });
  return scored[0].poem;
}

/* =============================================================
   POETRY CHALLENGES — schrijfopdrachten bovenop de Poetry Wall.
   Prompts leven in een echte tabel (poetry_prompts, later eventueel
   zelf toe te voegen door de 3 users), niet hardcoded in JS. Een
   challenge-gedicht is gewoon een normaal gedicht met prompt_id +
   een bevroren snapshot van de prompt-tekst/categorie (zelfde
   "denormaliseer naast de FK"-patroon als nickname_battles, zodat de
   weergave klopt blijft ook als de prompt later wijzigt/verdwijnt).
   Challenge-XP zit in de bestaande poem-publish-trigger (0012), dus
   hier is geen aparte XP-boekhouding nodig.
   ============================================================= */
const POETRY_CHALLENGE_CATEGORIES = [
  { id: 'romantic',          icon: '❤️', label: 'Romantic' },
  { id: 'tragic',            icon: '🥀', label: 'Tragic' },
  { id: 'office_nonsense',   icon: '🏢', label: 'Office Nonsense' },
  { id: 'beer_inspired',     icon: '🍺', label: 'Beer Inspired' },
  { id: 'absolute_nonsense', icon: '🤪', label: 'Absolute Nonsense' },
  { id: 'dramatic',          icon: '🎭', label: 'Dramatic' },
  { id: 'abt_dynasty',       icon: '👑', label: 'Abt Dynasty' },
  { id: 'deep_thoughts',     icon: '🧠', label: 'Deep Thoughts' },
  { id: 'wholesome',         icon: '✨', label: 'Wholesome' },
];

function getChallengeCategoryDef(categoryId){
  return POETRY_CHALLENGE_CATEGORIES.find(c => c.id === categoryId) || { id: categoryId, icon: '📝', label: categoryId || 'Onbekend' };
}

/* huidig getoonde prompt op de Wall -- puur sessie-state, wordt nooit
   door refreshAppData/realtime aangeraakt (zelfde als BEER_STATE etc.) */
const POETRY_CHALLENGE_STATE = { currentPrompt: null };

/* voorkomt dat dezelfde prompt telkens opnieuw verschijnt binnen één
   sessie -- niet persistent, hoeft niet meer te zijn dan dat */
let recentlyShownPromptIds = [];
function getRandomPrompt(pool){
  if (!pool.length) return null;
  const eligible = pool.filter(p => !recentlyShownPromptIds.includes(p.id));
  const choices = eligible.length ? eligible : pool;
  const picked = choices[Math.floor(Math.random() * choices.length)];
  recentlyShownPromptIds.push(picked.id);
  if (recentlyShownPromptIds.length > 5) recentlyShownPromptIds.shift();
  return picked;
}

function shufflePoetryChallenge(){
  const pool = APP_DATA.poetryPrompts.filter(p => p.isActive);
  POETRY_CHALLENGE_STATE.currentPrompt = getRandomPrompt(pool);
  rerenderPoetryChallengeCard();
}

function surprisePoetryChallenge(){
  const pool = APP_DATA.poetryPrompts.filter(p => p.isActive && p.isSurpriseEligible);
  POETRY_CHALLENGE_STATE.currentPrompt = getRandomPrompt(pool);
  rerenderPoetryChallengeCard();
}

function rerenderPoetryChallengeCard(){
  const mount = document.getElementById('poetry-challenge-card-mount');
  if (mount) mount.innerHTML = renderPoetryChallengeCardHtml();
}

/* Vandaag's Daily Challenge -- écht gedeeld en opgeslagen (niet puur
   client-side afgeleid): get_or_create_daily_challenge() (aangeroepen
   in loadAppData(), vóór de rest parallel opgehaald wordt) garandeert
   dat er altijd al een rij voor vandaag bestaat tegen de tijd dat dit
   gelezen wordt, dus alle clients zien exact dezelfde rij -- geen
   race, geen her-generatie bij refresh/realtime/opnieuw inloggen. */
function getTodaysDailyChallenge(){
  const todayPrefix = todayISO();
  return APP_DATA.dailyPoetryChallenges.find(c => c.challengeDate === todayPrefix) || null;
}

/* wie van de 3 users al een gedicht schreef voor déze specifieke
   daily challenge-rij (werkt voor elke datum, niet enkel vandaag --
   nodig om ook een oudere Daily Challenge's status correct te tonen) */
function getDailyChallengeCompletion(dailyChallenge){
  if (!dailyChallenge) return [];
  return APP_DATA.users.map(u => {
    const poem = APP_DATA.poems.find(p => p.authorUserId === u.id && p.isDailyChallenge && p.dailyChallengeId === dailyChallenge.id);
    return { user: u, completed: !!poem, poem };
  });
}

/* eigen inzending voor een specifieke daily challenge, indien die
   bestaat -- bepaalt of "Write Today's Poem" of "View/Edit My Entry"
   getoond wordt */
function getMyDailyChallengeEntry(dailyChallengeId){
  if (!dailyChallengeId) return null;
  return APP_DATA.poems.find(p => p.dailyChallengeId === dailyChallengeId && p.authorUserId === STATE.activeUser) || null;
}

function getChallengeStats(userId){
  const challengePoems = APP_DATA.poems.filter(p => p.authorUserId === userId && p.isChallengePoem);
  const completed = challengePoems.length;

  const byCategory = {};
  challengePoems.forEach(p => {
    if (!p.promptCategorySnapshot) return;
    byCategory[p.promptCategorySnapshot] = (byCategory[p.promptCategorySnapshot] || 0) + 1;
  });
  const favouriteCategory = Object.entries(byCategory).sort((a, b) => b[1] - a[1])[0]?.[0] || null;

  const reactionCount = (p) => POEM_REACTION_TYPES.reduce((sum, r) => sum + (p.reactions[r.id] || []).length, 0);
  const reactionsReceived = challengePoems.reduce((sum, p) => sum + reactionCount(p), 0);
  const mostSuccessful = [...challengePoems].sort((a, b) => reactionCount(b) - reactionCount(a))[0] || null;

  return { completed, favouriteCategory, reactionsReceived, mostSuccessful };
}

function getChallengeLeaderboard(){
  const reactionCount = (p) => POEM_REACTION_TYPES.reduce((sum, r) => sum + (p.reactions[r.id] || []).length, 0);
  const countByCategory = (userId, categories) => APP_DATA.poems.filter(p => p.authorUserId === userId && p.isChallengePoem && categories.includes(p.promptCategorySnapshot)).length;

  const mostCompleted = APP_DATA.users
    .map(u => ({ user: u, value: getChallengeStats(u.id).completed }))
    .filter(e => e.value > 0).sort((a, b) => b.value - a.value);

  const bestChallengePoem = APP_DATA.poems
    .filter(p => p.isChallengePoem && reactionCount(p) > 0)
    .sort((a, b) => reactionCount(b) - reactionCount(a));

  const masterOfNonsense = APP_DATA.users.map(u => ({ user: u, value: countByCategory(u.id, ['absolute_nonsense']) })).filter(e => e.value > 0).sort((a, b) => b.value - a.value);
  const officeTragedian = APP_DATA.users.map(u => ({ user: u, value: countByCategory(u.id, ['tragic', 'office_nonsense']) })).filter(e => e.value > 0).sort((a, b) => b.value - a.value);
  const drunkenBard = APP_DATA.users.map(u => ({ user: u, value: countByCategory(u.id, ['beer_inspired']) })).filter(e => e.value > 0).sort((a, b) => b.value - a.value);

  return { mostCompleted, bestChallengePoem, masterOfNonsense, officeTragedian, drunkenBard };
}

/* ---- kaart op de Wall: preview + "Read full poem" bij langere tekst ---- */
function renderPoemCard(poem){
  const author = findUser(poem.authorUserId);
  const mood = POEM_MOODS.find(m => m.id === poem.mood) || POEM_MOODS[POEM_MOODS.length - 1];
  const topReactions = POEM_REACTION_TYPES
    .map(r => ({ ...r, count: (poem.reactions[r.id] || []).length }))
    .filter(r => r.count > 0)
    .sort((a, b) => b.count - a.count)
    .slice(0, 3);
  const commentCount = APP_DATA.poemComments.filter(c => c.poemId === poem.id).length;
  const isPotm = getPoemOfTheMonth()?.id === poem.id;
  const lines = poem.content.split('\n');
  const isTruncated = lines.length > 3 || poem.content.length > 220;
  const preview = lines.slice(0, 3).join('\n').slice(0, 220);

  return `
    <div class="sticker-card poem-card" onclick="openPoemDetail('${poem.id}')">
      <div class="poem-card-top">
        <span class="badge poem-mood-badge">${mood.icon} ${mood.label}</span>
        ${isPotm ? `<span class="badge yellow">🏆 Poem of the Month</span>` : ''}
        ${poem.isDailyChallenge ? `<span class="badge lilac">📜 Daily Challenge</span>` : (poem.isChallengePoem ? `<span class="badge lilac">🎯 Challenge Poem</span>` : '')}
      </div>
      <div class="poem-title">${escapeHtml(poem.title)}</div>
      <div class="poem-body poem-body-preview">${escapeHtml(preview)}${isTruncated ? '…' : ''}</div>
      ${isTruncated ? `<div class="poem-read-more">Read full poem →</div>` : ''}
      <div class="nickname-person" style="margin-top:10px;">
        ${author ? avatarHtml(author, 22) : ''}
        <span>${author ? escapeHtml(author.displayName) : 'onbekend'}</span>
      </div>
      <div class="nickname-meta-row">
        <span class="stat-chip">📅 ${poem.createdAt.slice(0, 10)}</span>
        ${topReactions.map(r => `<span class="stat-chip">${r.icon} ${r.count}</span>`).join('')}
        <span class="stat-chip clickable" onclick="event.stopPropagation(); openPoemDetail('${poem.id}', true)">💬 ${commentCount}</span>
      </div>
    </div>
  `;
}

function formatRelativeTime(iso){
  const diffSec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (diffSec < 30) return 'just now';
  if (diffSec < 60) return `${diffSec}s ago`;
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHour = Math.floor(diffMin / 60);
  if (diffHour < 24) return `${diffHour}h ago`;
  const diffDay = Math.floor(diffHour / 24);
  if (diffDay < 7) return `${diffDay}d ago`;
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

async function togglePoemReaction(poemId, reactionType){

  if (!poem || poem.authorUserId === STATE.activeUser) return;
  const givers = poem.reactions[reactionType] || [];
  const alreadyGiven = givers.includes(STATE.activeUser);

  if (alreadyGiven){
    await sb.from('poem_reactions').delete().eq('poem_id', poemId).eq('user_id', STATE.activeUser).eq('reaction_type', reactionType);
  } else {
    const distinctGiven = POEM_REACTION_TYPES.filter(r => (poem.reactions[r.id] || []).includes(STATE.activeUser)).length;
    if (distinctGiven >= 3) return; // UI-side spiegel van de DB's max-3-trigger
    await sb.from('poem_reactions').insert({ poem_id: poemId, user_id: STATE.activeUser, reaction_type: reactionType });
  }
  await refreshAppData();
  renderPage();
}

/* ---------- 5b. TERRACE PLANNER ----------
   One "option" row = one full (date, time, location) candidate slot.
   The simple flow creates exactly one. "Multiple locations" adds
   options that share the same date/time but vary location (voted via
   terrace_location_votes, one pick per user). "Multiple date/time
   alternatives" adds options sharing the same location but varying
   date/time (voted via per-option terrace_availability rows). The
   simple, single-option case always uses option_id = null on
   terrace_availability -- a plain whole-event RSVP. */

const TERRACE_STATE = {
  view: 'list', // 'list' | 'eventForm' | 'eventDetail' | 'locations'
  activeEventId: null,
  locationSort: 'visits',
};

let TERRACE_DRAFT = null;

/* ---- date/time formatting ---- */
function formatTerraceShortDate(iso){
  if (!iso) return 'TBD';
  return new Date(`${iso}T00:00:00`).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}
function formatTerraceFullDate(iso){
  if (!iso) return 'TBD';
  return new Date(`${iso}T00:00:00`).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}
function formatTerraceTime(t){
  return t ? t.slice(0, 5) : '';
}

/* ---- lookups ---- */
function getTerraceEventOptions(eventId){
  return APP_DATA.terraceEventOptions
    .filter(o => o.terraceEventId === eventId)
    .sort((a, b) => (a.eventDate + (a.eventTime || '')).localeCompare(b.eventDate + (b.eventTime || '')));
}
function getTerraceOptionLocationLabel(option){
  if (!option) return 'TBD';
  if (option.manualLocation) return option.manualLocation;
  const loc = APP_DATA.terraceLocations.find(l => l.id === option.locationId);
  return loc ? loc.name : 'TBD';
}
/* Welke as varieert tussen de opties van dit event -- 'date' als alle
   opties dezelfde locatie delen maar data/tijden verschillen, anders
   'location'. null als er maar 1 optie is (het simpele geval). */
function terraceVariesBy(event){
  const options = getTerraceEventOptions(event.id);
  if (options.length <= 1) return null;
  const firstKey = options[0].locationId + '|' + (options[0].manualLocation || '');
  const sameLocation = options.every(o => (o.locationId + '|' + (o.manualLocation || '')) === firstKey);
  return sameLocation ? 'date' : 'location';
}
function getTerracePrimaryOption(event){
  const options = getTerraceEventOptions(event.id);
  if (event.confirmedOptionId){
    const opt = options.find(o => o.id === event.confirmedOptionId);
    if (opt) return opt;
  }
  return options[0] || null;
}
function getTerraceEventAvailability(eventId, optionId){
  return APP_DATA.terraceAvailability.filter(a => a.terraceEventId === eventId && a.optionId === (optionId || null));
}
function getTerraceMyAvailability(eventId, optionId){
  return getTerraceEventAvailability(eventId, optionId).find(a => a.userId === STATE.activeUser);
}
function getTerraceEventPrimaryDate(event){
  const opt = getTerracePrimaryOption(event);
  return opt ? opt.eventDate : null;
}
function isTerracePastEvent(event){
  const date = getTerraceEventPrimaryDate(event);
  return date ? date < todayISO() : false;
}
function getUpcomingTerraceEvents(){
  return (APP_DATA.terraceEvents || [])
    .filter(e => e.status !== 'cancelled' && !isTerracePastEvent(e))
    .sort((a, b) => (getTerraceEventPrimaryDate(a) || '9999').localeCompare(getTerraceEventPrimaryDate(b) || '9999'));
}
function getPastTerraceEvents(){
  return (APP_DATA.terraceEvents || [])
    .filter(e => e.status === 'cancelled' || isTerracePastEvent(e))
    .sort((a, b) => (getTerraceEventPrimaryDate(b) || '').localeCompare(getTerraceEventPrimaryDate(a) || ''));
}

/* "Waiting"/"Looks good" zijn nooit opgeslagen -- puur afgeleid van
   live availability terwijl status='proposed'. Enkel confirmed/
   cancelled zijn echte, expliciete states. */
function computeTerraceStatus(event){
  if (event.status === 'confirmed') return { icon: '✅', label: 'Confirmed', cls: 'mint' };
  if (event.status === 'cancelled') return { icon: '❌', label: 'Cancelled', cls: 'peach' };
  const varies = terraceVariesBy(event);
  let yesCount = 0;
  if (varies === 'date'){
    getTerraceEventOptions(event.id).forEach(o => {
      const c = getTerraceEventAvailability(event.id, o.id).filter(a => a.status === 'yes').length;
      if (c > yesCount) yesCount = c;
    });
  } else {
    yesCount = getTerraceEventAvailability(event.id, null).filter(a => a.status === 'yes').length;
  }
  if (yesCount >= 2) return { icon: '🟢', label: 'Looks good', cls: 'sky' };
  return { icon: '🟡', label: 'Waiting for answers', cls: 'yellow' };
}

/* Nav-badge: aantal proposed events waarop de huidige user nog niet
   (volledig) gereageerd heeft. */
function getTerracePendingVoteCount(){
  if (!STATE.activeUser) return 0;
  let count = 0;
  (APP_DATA.terraceEvents || []).forEach(e => {
    if (e.status !== 'proposed' || !e.invitedUserIds.includes(STATE.activeUser)) return;
    if (terraceVariesBy(e) === 'date'){
      const missing = getTerraceEventOptions(e.id).some(o => !getTerraceMyAvailability(e.id, o.id));
      if (missing) count++;
    } else if (!getTerraceMyAvailability(e.id, null)){
      count++;
    }
  });
  return count;
}

              <div class="avatar-emoji" style="width:34px;height:34px;background:var(--mint);font-size:16px;">${s.location.hasTerrace ? '🍀' : '☀️'}</div>
              <div class="info">
                <div class="name">${escapeHtml(s.location.name)}</div>
                <div class="sub">${s.visits} visit${s.visits === 1 ? '' : 's'}${s.overall !== null ? ' · ' + s.overall.toFixed(1) + '/10' : ''}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </section>
    ` : ''}

    <section class="section">
      <div class="section-head"><h3>🕰️ Past</h3></div>
      ${past.length ? `<div class="grid cols-auto">${past.map(e => renderTerraceEventCard(e, { past: true })).join('')}</div>` : emptyState('Nog geen eerdere terrasmomenten.')}
    </section>

    <section class="section">
      <div class="section-head"><h3>🍻 Terrace Stats</h3></div>
      <div class="grid cols-auto">
        ${TERRACE_LEADERBOARD_DEFS.map(def => `
          <div class="sticker-card" style="text-align:left;">
            <div class="lore-item-title" style="margin-bottom:8px;">${def.icon} ${def.title}</div>
            ${renderPodium(def.build().slice(0, 3), { compact: true, restLimit: 0 })}
          </div>
        `).join('')}
      </div>
    </section>
  `;
}

function renderTerraceEventCard(event, opts = {}){
  const options = getTerraceEventOptions(event.id);
  const varies = terraceVariesBy(event);
  const primaryOption = getTerracePrimaryOption(event);
  const status = computeTerraceStatus(event);
  const linkedSession = event.linkedBeerSessionId ? APP_DATA.beerSessions.find(s => s.id === event.linkedBeerSessionId) : null;
  const myAvailability = getTerraceMyAvailability(event.id, null);
  const pendingForMe = event.status === 'proposed' && event.invitedUserIds.includes(STATE.activeUser)
    && (varies === 'date' ? options.some(o => !getTerraceMyAvailability(event.id, o.id)) : !myAvailability);

  const attendance = APP_DATA.terraceAttendance.filter(a => a.terraceEventId === event.id);

  return `
    <div class="sticker-card terrace-card clickable" onclick="openTerraceEventDetail('${event.id}')">
      <div class="terrace-card-top">
        <div class="lore-item-title">🍻 ${escapeHtml(event.title || 'Terrace Plan')}</div>
        <span class="badge ${status.cls}">${status.icon} ${status.label}</span>
      </div>
      <div class="terrace-card-meta">📅 ${formatTerraceShortDate(primaryOption?.eventDate)}${primaryOption?.eventTime ? ' · ' + formatTerraceTime(primaryOption.eventTime) : ''}</div>
      <div class="terrace-card-meta">📍 ${escapeHtml(getTerraceOptionLocationLabel(primaryOption))}</div>
      ${opts.past ? `
        <div class="terrace-card-meta">👥 ${(attendance.length ? attendance.filter(a => a.attended).map(a => resolveUserLabel(a.userId)) : event.invitedUserIds.map(id => resolveUserLabel(id))).join(', ')}</div>
      ` : varies === 'date' ? `
        <div class="terrace-card-meta">🗓️ ${options.length} tijdsopties — stemmen kan</div>
      ` : `
        <div class="row-list" style="margin-top:8px;">
          ${event.invitedUserIds.map(uid => {
            const u = findUser(uid);
            if (!u) return '';
            const vote = getTerraceEventAvailability(event.id, null).find(a => a.userId === uid);
            return renderTerraceAvailabilityRow(u, vote);
          }).join('')}
        </div>
      `}
      ${linkedSession ? `<div class="badge mint" style="margin-top:8px;">🍺 Beer Session linked</div>` : ''}
      ${pendingForMe ? `<div class="terrace-card-nudge">👉 ${resolveUserLabel(event.createdByUserId)} is waiting for your answer.</div>` : ''}
    </div>
  `;
}

function renderTerraceAvailabilityRow(user, vote){
  const icon = !vote ? '⏳' : vote.status === 'yes' ? '✅' : vote.status === 'maybe' ? '🤔' : '❌';
  const label = !vote ? 'Not attempted' : vote.status === 'yes' ? "I'm in" : vote.status === 'maybe' ? 'Maybe' : "Can't";
  return `
    <div class="row-item" style="cursor:default;">
      ${avatarHtml(user, 26)}
      <div class="info"><div class="name">${escapeHtml(user.displayName)}</div></div>
      <div class="value">${icon} ${label}${vote && vote.needsReconfirmation ? ' <span class="badge peach" style="margin-left:4px;">Needs reconfirmation</span>' : ''}</div>
    </div>
  `;
}

/* ---- event detail ---- */
function openTerraceEventDetail(id){
  STATE.activePage = 'terrace';
  TERRACE_STATE.view = 'eventDetail';
  TERRACE_STATE.activeEventId = id;
  renderNav();
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToTerraceList(){
  TERRACE_STATE.view = 'list';
  TERRACE_STATE.activeEventId = null;
  renderPage();
}

function renderTerraceEventDetailPage(data){
  const event = data.terraceEvents.find(e => e.id === TERRACE_STATE.activeEventId);
  if (!event){ TERRACE_STATE.view = 'list'; return renderTerracePage(data); }

  const options = getTerraceEventOptions(event.id);
  const varies = terraceVariesBy(event);
  const primaryOption = getTerracePrimaryOption(event);
  const status = computeTerraceStatus(event);
  const isPast = isTerracePastEvent(event);
  const linkedSession = event.linkedBeerSessionId ? APP_DATA.beerSessions.find(s => s.id === event.linkedBeerSessionId) : null;

  const headerSection = `
    <section class="section">
      <button type="button" class="btn btn-ghost btn-sm" onclick="backToTerraceList()">← Terug naar Terrace Planner</button>
      <div class="detail-header" style="margin-top:8px;">
        <div>
          <h2 style="font-size:24px;">🍻 ${escapeHtml(event.title || 'Terrace Plan')}</h2>
          <div class="detail-subline">📅 ${formatTerraceFullDate(primaryOption?.eventDate)}${primaryOption?.eventTime ? ' · ' + formatTerraceTime(primaryOption.eventTime) : ''} · 📍 ${escapeHtml(getTerraceOptionLocationLabel(primaryOption))}</div>
        </div>
        <div class="detail-actions">
          <button type="button" class="btn btn-secondary btn-sm" onclick="openTerraceEventForm('edit', '${event.id}')">✏️ Edit</button>
          <button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteTerraceEvent('${event.id}')">🗑️ Delete</button>
        </div>
      </div>
      <div class="detail-meta-row">
        <span class="badge ${status.cls}">${status.icon} ${status.label}</span>
        <span class="badge lilac">👤 ${resolveUserLabel(event.createdByUserId)}</span>
        ${event.note ? `<span class="badge peach">📝 ${escapeHtml(event.note)}</span>` : ''}
      </div>
      ${event.status === 'proposed' ? `
        <div class="form-actions" style="justify-content:flex-start; margin-top:12px;">
          <button type="button" class="btn btn-primary btn-sm" onclick="confirmTerraceOptionPrompt('${event.id}')">✅ Confirm Terrace</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="cancelTerraceEvent('${event.id}')">❌ Cancel</button>
        </div>
      ` : ''}

  const availabilitySection = varies === 'date'
    ? renderTerraceMultiDateSection(event, options)
    : renderTerraceSimpleAvailabilitySection(event);

  const locationVoteSection = varies === 'location' ? renderTerraceLocationVoteSection(event, options) : '';

  const attendanceSection = isPast ? renderTerraceAttendanceSection(event) : '';

  const beerSessionSection = `
    <section class="section">
      <div class="section-head"><h3>🍺 Beer Club</h3></div>
      ${linkedSession ? `
        <div class="badge mint" style="margin-bottom:10px;">🍺 Beer Session linked</div>
        <button type="button" class="btn btn-secondary btn-sm" onclick="viewLinkedBeerSession('${linkedSession.id}')">View Beer Session</button>
      ` : (isPast && event.status === 'confirmed') ? `
        <button type="button" class="btn btn-primary btn-sm" onclick="createBeerSessionFromTerrace('${event.id}')">🍺 Create Beer Session</button>
      ` : emptyState('Wordt beschikbaar zodra dit terras bevestigd is en achter de rug is.')}
    </section>
  `;

  const recapSection = (isPast && event.status === 'confirmed') ? renderTerraceRecapSection(event) : '';

  return headerSection + availabilitySection + locationVoteSection + attendanceSection + recapSection + beerSessionSection;
}

  const iAmInvited = event.invitedUserIds.includes(STATE.activeUser);
  return `
    <section class="section">

      ${iAmInvited ? `
        <div class="terrace-vote-buttons">
          <button type="button" class="btn btn-lg ${myVote?.status === 'yes' ? 'btn-primary' : 'btn-ghost'}" onclick="submitTerraceAvailability('${event.id}', null, 'yes')">✅ I'M IN</button>
          <button type="button" class="btn btn-lg ${myVote?.status === 'maybe' ? 'btn-primary' : 'btn-ghost'}" onclick="submitTerraceAvailability('${event.id}', null, 'maybe')">🤔 MAYBE</button>
          <button type="button" class="btn btn-lg ${myVote?.status === 'no' ? 'btn-primary' : 'btn-ghost'}" onclick="submitTerraceAvailability('${event.id}', null, 'no')">❌ CAN'T</button>
        </div>
        ${myVote?.needsReconfirmation ? `<div class="terrace-card-nudge">⚠️ Needs reconfirmation — details changed since you last answered.</div>` : ''}
      ` : ''}
      <div class="row-list" style="margin-top:14px;">
        ${event.invitedUserIds.map(uid => {
          const u = findUser(uid);
          if (!u) return '';
          const vote = getTerraceEventAvailability(event.id, null).find(a => a.userId === uid);
          return renderTerraceAvailabilityRow(u, vote);
        }).join('')}
      </div>
    </section>
  `;
}

function renderTerraceMultiDateSection(event, options){
  const iAmInvited = event.invitedUserIds.includes(STATE.activeUser);
  return `
    <section class="section">
      <div class="section-head"><h3>When works?</h3></div>
      ${options.map(o => {
        const myVote = getTerraceMyAvailability(event.id, o.id);
        const votes = getTerraceEventAvailability(event.id, o.id);
        const isConfirmed = event.confirmedOptionId === o.id;
        return `
          <div class="sticker-card" style="margin-bottom:10px; ${isConfirmed ? 'border-color: var(--pink-deep);' : ''}">

            ${iAmInvited ? `
              <div class="terrace-vote-buttons">
                <button type="button" class="btn btn-lg ${myVote?.status === 'yes' ? 'btn-primary' : 'btn-ghost'}" onclick="submitTerraceAvailability('${event.id}', '${o.id}', 'yes')">✅ Yes</button>
                <button type="button" class="btn btn-lg ${myVote?.status === 'maybe' ? 'btn-primary' : 'btn-ghost'}" onclick="submitTerraceAvailability('${event.id}', '${o.id}', 'maybe')">🤔 Maybe</button>
                <button type="button" class="btn btn-lg ${myVote?.status === 'no' ? 'btn-primary' : 'btn-ghost'}" onclick="submitTerraceAvailability('${event.id}', '${o.id}', 'no')">❌ No</button>
              </div>
            ` : ''}
            <div class="row-list" style="margin-top:8px;">
              ${event.invitedUserIds.map(uid => {
                const u = findUser(uid);
                if (!u) return '';
                const vote = votes.find(v => v.userId === uid);
                return renderTerraceAvailabilityRow(u, vote);
              }).join('')}
            </div>
          </div>

      }).join('')}

async function submitTerraceAvailability(eventId, optionId, status){
  const existing = getTerraceMyAvailability(eventId, optionId);
  if (existing){
    await sb.from('terrace_availability').update({ status, needs_reconfirmation: false }).eq('id', existing.id);
  } else {
    await sb.from('terrace_availability').insert({ terrace_event_id: eventId, option_id: optionId, user_id: STATE.activeUser, status });
  }
  await refreshAppData();
  renderPage();
}

function renderTerraceLocationVoteSection(event, options){
  const myVote = APP_DATA.terraceLocationVotes.find(v => v.terraceEventId === event.id && v.userId === STATE.activeUser);
  const canVote = event.status === 'proposed';
  return `
    <section class="section">
      <div class="section-head"><h3>Where?</h3></div>
      <div class="row-list">
        ${options.map(o => {
          const count = APP_DATA.terraceLocationVotes.filter(v => v.terraceEventId === event.id && v.optionId === o.id).length;
          const isMine = myVote && myVote.optionId === o.id;
          const isConfirmed = event.confirmedOptionId === o.id;
          return `
            <div class="row-item" style="cursor:default;">
              <div class="avatar-emoji" style="width:30px;height:30px;background:var(--mint);font-size:15px;">📍</div>
              <div class="info">
                <div class="name">${escapeHtml(getTerraceOptionLocationLabel(o))}${isConfirmed ? ' ✅' : ''}</div>
                <div class="sub">${count} vote${count === 1 ? '' : 's'}</div>
              </div>
              ${canVote ? `<button type="button" class="btn ${isMine ? 'btn-primary' : 'btn-ghost'} btn-sm" onclick="submitTerraceLocationVote('${event.id}', '${o.id}')">👍</button>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </section>
  `;
}

async function submitTerraceLocationVote(eventId, optionId){
  await sb.from('terrace_location_votes').upsert(
    { terrace_event_id: eventId, option_id: optionId, user_id: STATE.activeUser },
    { onConflict: 'terrace_event_id,user_id' }
  );

}

function renderTerraceAttendanceSection(event){

      <div class="row-list">
        ${event.invitedUserIds.map(uid => {

            <div class="row-item" style="cursor:default;">

async function setTerraceAttendance(eventId, userId, attended){

  renderPage();
}

      <div class="detail-meta-row">
        <span class="badge lilac">👥 ${attendees.map(id => resolveUserLabel(id)).join(' · ')}</span>
        <span class="badge mint">💬 ${quotesLinked.length} quote${quotesLinked.length === 1 ? '' : 's'} recorded</span>
        <span class="badge peach">🏷️ ${nicknamesLinked.length} new nickname${nicknamesLinked.length === 1 ? '' : 's'}</span>
      </div>
      <div class="form-actions" style="justify-content:flex-start; margin-top:10px;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="openLoreForm('add','quote', null, null, '${event.id}')">+ Quote</button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="openNicknameForm('add', null, null, '${event.id}')">+ Nickname</button>

/* ---- confirm / cancel / delete ---- */
function confirmTerraceOptionPrompt(eventId){
  const options = getTerraceEventOptions(eventId);
  if (options.length <= 1){
    performConfirmTerrace(eventId, options[0]?.id || null);
    return;
  }
  openModal(`
    <h3>✅ Confirm Terrace</h3>
    <p>Which option are you confirming?</p>
    <div class="row-list">
      ${options.map(o => `
        <div class="row-item" onclick="performConfirmTerrace('${eventId}', '${o.id}')">
          <div class="info">
            <div class="name">${formatTerraceShortDate(o.eventDate)}${o.eventTime ? ' · ' + formatTerraceTime(o.eventTime) : ''}</div>
            <div class="sub">📍 ${escapeHtml(getTerraceOptionLocationLabel(o))}</div>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>
  `);
}

async function performConfirmTerrace(eventId, optionId){
  await sb.from('terrace_events').update({ status: 'confirmed', confirmed_option_id: optionId }).eq('id', eventId);
  await refreshAppData();
  closeModal();
  renderPage();
}

async function cancelTerraceEvent(eventId){
  await sb.from('terrace_events').update({ status: 'cancelled' }).eq('id', eventId);
  await refreshAppData();
  renderPage();
}

function confirmDeleteTerraceEvent(id){
  const event = APP_DATA.terraceEvents.find(e => e.id === id);
  if (!event) return;
  const hasLinkedSession = !!event.linkedBeerSessionId;
  openModal(`
    <h3>🗑️ Delete this terrace plan?</h3>
    <p>This will permanently remove the plan, its options, votes and attendance records.</p>
    ${hasLinkedSession ? `<p class="form-meta">⚠️ This terrace is linked to an existing Beer Session. Deleting the terrace plan will not delete the Beer Session.</p>` : ''}
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button type="button" class="btn btn-danger" onclick="performDeleteTerraceEvent('${id}')">Delete</button>
    </div>
  `);
}

async function performDeleteTerraceEvent(id){
  await sb.from('terrace_events').delete().eq('id', id);
  await refreshAppData();
  closeModal();
  TERRACE_STATE.view = 'list';
  TERRACE_STATE.activeEventId = null;
  renderPage();
}

/* ---- create / edit form ---- */
function defaultTerraceInvitedIds(){
  return APP_DATA.users.map(u => u.id);
}

function openTerraceEventForm(mode, eventId){
  const editMode = mode === 'edit';
  const event = editMode ? APP_DATA.terraceEvents.find(e => e.id === eventId) : null;
  if (editMode && !event) return;

  if (editMode){
    const options = getTerraceEventOptions(event.id);
    TERRACE_DRAFT = {
      mode: 'edit',
      eventId: event.id,
      title: event.title || '',
      note: event.note || '',
      invitedUserIds: [...event.invitedUserIds],
      options: options.map(o => ({ id: o.id, eventDate: o.eventDate, eventTime: o.eventTime || '', locationId: o.locationId, manualLocation: o.manualLocation || '' })),
      varyMode: terraceVariesBy(event),
      wasConfirmed: event.status === 'confirmed',
    };
  } else {
    TERRACE_DRAFT = {
      mode: 'add',
      eventId: null,
      title: '',
      note: '',
      invitedUserIds: defaultTerraceInvitedIds(),
      options: [{ id: null, eventDate: todayISO(), eventTime: '18:00', locationId: null, manualLocation: '' }],
      varyMode: null,
      wasConfirmed: false,
    };
  }

  STATE.activePage = 'terrace';
  TERRACE_STATE.view = 'eventForm';
  renderNav();
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelTerraceEventForm(){
  if (TERRACE_DRAFT?.mode === 'edit' && TERRACE_DRAFT.eventId){
    TERRACE_STATE.view = 'eventDetail';
    TERRACE_STATE.activeEventId = TERRACE_DRAFT.eventId;
  } else {
    TERRACE_STATE.view = 'list';
  }
  TERRACE_DRAFT = null;
  renderPage();
}

/* Leest de niet-gecontroleerde velden (title/note + elke optie-rij)
   terug uit de DOM in TERRACE_DRAFT, VOOR een structurele wijziging
   (optie toevoegen/verwijderen) het formulier opnieuw rendert --
   anders zou al ingevulde tekst verloren gaan. */
function syncTerraceOptionsFromDom(){
  if (!TERRACE_DRAFT) return;
  TERRACE_DRAFT.options.forEach((opt, i) => {
    const dateEl = document.getElementById(`tf-opt-${i}-date`);
    const timeEl = document.getElementById(`tf-opt-${i}-time`);
    const locSelectEl = document.getElementById(`tf-opt-${i}-location-select`);
    const locManualEl = document.getElementById(`tf-opt-${i}-location-manual`);
    if (dateEl) opt.eventDate = dateEl.value;
    if (timeEl) opt.eventTime = timeEl.value;
    if (locSelectEl) opt.locationId = locSelectEl.value || null;
    if (locManualEl) opt.manualLocation = locManualEl.value;
  });
  const titleEl = document.getElementById('tf-title');
  const noteEl = document.getElementById('tf-note');
  if (titleEl) TERRACE_DRAFT.title = titleEl.value;
  if (noteEl) TERRACE_DRAFT.note = noteEl.value;
}

function addTerraceDateOption(){
  syncTerraceOptionsFromDom();
  const base = TERRACE_DRAFT.options[0];
  TERRACE_DRAFT.varyMode = 'date';
  TERRACE_DRAFT.options.push({ id: null, eventDate: base.eventDate, eventTime: base.eventTime, locationId: base.locationId, manualLocation: base.manualLocation });
  renderPage();
}
function addTerraceLocationOption(){
  syncTerraceOptionsFromDom();
  const base = TERRACE_DRAFT.options[0];
  TERRACE_DRAFT.varyMode = 'location';
  TERRACE_DRAFT.options.push({ id: null, eventDate: base.eventDate, eventTime: base.eventTime, locationId: null, manualLocation: '' });
  renderPage();
}
function removeTerraceOption(index){
  syncTerraceOptionsFromDom();
  TERRACE_DRAFT.options.splice(index, 1);
  if (TERRACE_DRAFT.options.length <= 1) TERRACE_DRAFT.varyMode = null;
  renderPage();
}
function onTerraceLocationSelectChange(index, selectEl){
  const manualEl = document.getElementById(`tf-opt-${index}-location-manual`);
  if (!manualEl) return;
  if (selectEl.value){ manualEl.value = ''; manualEl.disabled = true; }
  else { manualEl.disabled = false; }
}
function toggleTerraceInvited(userId, btn){
  const idx = TERRACE_DRAFT.invitedUserIds.indexOf(userId);
  if (idx === -1) TERRACE_DRAFT.invitedUserIds.push(userId);
  else TERRACE_DRAFT.invitedUserIds.splice(idx, 1);
  btn.classList.toggle('btn-primary');
  btn.classList.toggle('btn-ghost');
}

async function submitTerraceEventForm(){
  syncTerraceOptionsFromDom();
  const errorEl = document.getElementById('tf-error');
  if (!TERRACE_DRAFT.invitedUserIds.length){
    errorEl.textContent = 'Nodig minstens 1 persoon uit.';
    return;
  }
  if (TERRACE_DRAFT.options.some(o => !o.eventDate)){
    errorEl.textContent = 'Kies een datum voor elke optie.';
    return;
  }
  errorEl.textContent = '';

  const editMode = TERRACE_DRAFT.mode === 'edit';

  if (editMode){
    const event = APP_DATA.terraceEvents.find(e => e.id === TERRACE_DRAFT.eventId);
    const { error: updateErr } = await sb.from('terrace_events').update({
      title: TERRACE_DRAFT.title || null,
      note: TERRACE_DRAFT.note || null,
      invited_user_ids: TERRACE_DRAFT.invitedUserIds,
    }).eq('id', event.id);
    if (updateErr){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return; }

    const existingOptions = getTerraceEventOptions(event.id);
    const keptIds = TERRACE_DRAFT.options.filter(o => o.id).map(o => o.id);
    const removedOptions = existingOptions.filter(o => !keptIds.includes(o.id));
    if (removedOptions.length){
      await sb.from('terrace_event_options').delete().in('id', removedOptions.map(o => o.id));
    }
    for (const o of TERRACE_DRAFT.options){
      const payload = {
        event_date: o.eventDate, event_time: o.eventTime || null,
        location_id: o.locationId || null, manual_location: o.locationId ? null : (o.manualLocation || null),
      };
      if (o.id){
        await sb.from('terrace_event_options').update(payload).eq('id', o.id);
      } else {
        await sb.from('terrace_event_options').insert({ ...payload, terrace_event_id: event.id });
      }
    }
    await refreshAppData();
    TERRACE_STATE.view = 'eventDetail';
    TERRACE_STATE.activeEventId = event.id;
    TERRACE_DRAFT = null;
    renderPage();
    return;
  }

  const { data: event, error } = await sb.from('terrace_events').insert({
    title: TERRACE_DRAFT.title || null,
    note: TERRACE_DRAFT.note || null,
    created_by_user_id: STATE.activeUser,
    invited_user_ids: TERRACE_DRAFT.invitedUserIds,
  }).select().single();
  if (error){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return; }

  await sb.from('terrace_event_options').insert(
    TERRACE_DRAFT.options.map(o => ({
      terrace_event_id: event.id, event_date: o.eventDate, event_time: o.eventTime || null,
      location_id: o.locationId || null, manual_location: o.locationId ? null : (o.manualLocation || null),
    }))
  );

  await refreshAppData();
  TERRACE_STATE.view = 'eventDetail';
  TERRACE_STATE.activeEventId = event.id;
  TERRACE_DRAFT = null;
  renderPage();
}

/* ---- Favourite Spots ---- */
function getTerraceLocationStats(){
  return APP_DATA.terraceLocations.map(loc => {
    const ratings = APP_DATA.terraceLocationRatings.filter(r => r.locationId === loc.id);
    const avg = (field) => {
      const vals = ratings.map(r => r[field]).filter(v => typeof v === 'number');
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    };
    const terraceAvg = avg('terraceRating');
    const beerAvg = avg('beerSelectionRating');
    const vibeAvg = avg('vibeRating');
    const overallVals = [terraceAvg, beerAvg, vibeAvg].filter(v => v !== null);
    const overall = overallVals.length ? overallVals.reduce((a, b) => a + b, 0) / overallVals.length : null;
    const eventIdsAtLocation = new Set(APP_DATA.terraceEventOptions.filter(o => o.locationId === loc.id).map(o => o.terraceEventId));
    const visits = APP_DATA.terraceEvents.filter(e => eventIdsAtLocation.has(e.id) && e.status === 'confirmed' && isTerracePastEvent(e)).length;
    const favoritedBy = APP_DATA.terraceLocationFavorites.filter(f => f.locationId === loc.id).map(f => f.userId);
    return { location: loc, terraceAvg, beerAvg, vibeAvg, overall, visits, favoritedBy };
  });
}
