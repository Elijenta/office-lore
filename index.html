        <div class="beer-stat"><div class="num">#${beerRank}</div><div class="label">Beer Rank</div></div>
        <div class="beer-stat"><div class="num">${beerLevel.icon}</div><div class="label">${beerLevel.label}</div></div>

/* ---- Abt History: personal reign record, on the user's own Lore page ---- */
function renderUserAbtHistorySection(user){
  const reigns = getUserReignHistory(user.id);
  const captures = reigns.length;

  if (!captures){
    return `
      <section class="section">
        <div class="section-head"><h3>👑 Abt History</h3></div>
        ${emptyState('Never claimed the throne... yet.')}
      </section>
    `;
  }

  const longest = getLongestReignEver(user.id);
  const totalDays = getTotalDaysInPower(user.id);
  const slayerCount = getTimesDethronedOthers(user.id);
  const dethronedCount = getTimesDethroned(user.id);

  return `
    <section class="section">
      <div class="section-head"><h3>👑 Abt History</h3></div>
      <div class="beer-stats">
        <div class="beer-stat"><div class="num">👑 ${captures}</div><div class="label">Reign${captures === 1 ? '' : 's'}</div></div>
        <div class="beer-stat"><div class="num">🏰 ${longest}</div><div class="label">Longest (days)</div></div>
        <div class="beer-stat"><div class="num">⏳ ${totalDays}</div><div class="label">Total rule (days)</div></div>
        <div class="beer-stat"><div class="num">⚔️ ${slayerCount}</div><div class="label">Dethronements caused</div></div>
        <div class="beer-stat"><div class="num">💀 ${dethronedCount}</div><div class="label">Times dethroned</div></div>
      </div>
      <div class="dynasty-timeline" style="margin-top:16px;">
        ${reigns.map(r => {
          const isCurrent = !r.endedAt;
          const days = getReignDays(r);
          return `
            <div class="dynasty-entry ${isCurrent ? 'current' : ''}">
              <div class="dynasty-avatar">${userAvatarHtml(user, 40)}</div>
              <div class="dynasty-info">
                <div class="dynasty-length">👑 ${isCurrent ? 'Current reign' : `${days} day${days === 1 ? '' : 's'}`}</div>
                <div class="dynasty-dates">${formatNiceDate(r.startedAt)} → ${isCurrent ? 'Present' : formatNiceDate(r.endedAt)}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </section>
  `;
}

/* ---- avatar-editor: rechtstreekse DOM-updates, geen re-render,
   zodat al ingetypte formuliervelden niet verloren gaan. Enige
   gebruiker van dit patroon is nu het My Profile-formulier. ---- */
function updateAvatarPreview(){
  const mount = document.getElementById('avatar-preview');
  if (!mount) return;
  mount.innerHTML = avatarHtml({ avatarPhoto: formDraft.avatarPhoto, avatarEmoji: formDraft.avatarEmoji, avatarColor: formDraft.avatarColor, displayName: '' }, 72);
}

function selectAvatarEmoji(emoji, btn){
  formDraft.avatarEmoji = emoji;
  formDraft.avatarPhoto = null;
  document.querySelectorAll('.avatar-swatch').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  const clearBtn = document.getElementById('clear-photo-btn');
  if (clearBtn) clearBtn.style.display = 'none';
  updateAvatarPreview();
}

function selectAvatarColor(color, btn){
  formDraft.avatarColor = color;
  document.querySelectorAll('.color-swatch').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  updateAvatarPreview();
}

function handlePhotoUpload(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    formDraft.avatarPhoto = e.target.result;
    document.querySelectorAll('.avatar-swatch').forEach(b => b.classList.remove('selected'));
    const clearBtn = document.getElementById('clear-photo-btn');
    if (clearBtn) clearBtn.style.display = 'inline-flex';
    updateAvatarPreview();
  };
  reader.readAsDataURL(file);
}

function clearAvatarPhoto(){
  formDraft.avatarPhoto = null;
  const clearBtn = document.getElementById('clear-photo-btn');
  if (clearBtn) clearBtn.style.display = 'none';
  updateAvatarPreview();
}

async function submitMyProfileForm(event){
  event.preventDefault();

  const displayName = document.getElementById('mp-displayName').value.trim();
  const profileNickname = document.getElementById('mp-nickname').value.trim();
  const businessUnit = document.getElementById('mp-businessUnit').value.trim();
  const jobTitle = document.getElementById('mp-jobTitle').value.trim();
  const bio = document.getElementById('mp-bio').value.trim();
  const errorEl = document.getElementById('mp-error');

  if (!displayName){
    errorEl.textContent = 'Vul minstens een weergavenaam in.';
    return false;
  }
  errorEl.textContent = '';

  const { error } = await sb.from('profiles').update({
    display_name: displayName,
    profile_nickname: profileNickname || null,
    business_unit: businessUnit || null,
    job_title: jobTitle || null,
    bio,
    avatar_emoji: formDraft.avatarEmoji,
    accent_color: formDraft.avatarColor,
    avatar_photo: formDraft.avatarPhoto,
  }).eq('id', STATE.activeUser);

  if (error){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return false; }

  await refreshAppData();
  renderUserSwitcher(); // profielmenu-knop toont meteen de nieuwe naam/avatar
  goToPage('home');
  return false;
}

   capped at 420px, deliberately plain/reusable — this is a one-off,
   full-screen, ceremonial moment. */

  document.getElementById('dynasty-overlay-root').innerHTML = `<div class="dynasty-overlay">${innerHtml}</div>`;
}

function closeDramaticOverlay(){
  document.getElementById('dynasty-overlay-root').innerHTML = '';
}

function showDethronementOverlay(oldLordId, newLordId, oldLordEndingXp){
  const oldLord = findUser(oldLordId);
  const newLord = findUser(newLordId);
  if (!oldLord || !newLord) return;
  const newLordXp = computeBeerXp(newLordId);
  const confettiEmojis = ['👑', '🍺', '🍻', '⚜️', '🫧'];
  const confettiHtml = Array.from({ length: 18 }, (_, i) => `
    <span class="dynasty-confetti-piece" style="left:${Math.round(Math.random() * 100)}%; animation-delay:${(Math.random() * 0.6).toFixed(2)}s;">${confettiEmojis[i % confettiEmojis.length]}</span>
  `).join('');

  openDramaticOverlay(`
    <div class="dynasty-overlay-confetti">${confettiHtml}</div>
    <div class="dynasty-overlay-card">
      <div class="dynasty-overlay-crown">👑</div>
      <h2 class="dynasty-overlay-title">THE THRONE HAS FALLEN</h2>
      <p class="dynasty-overlay-headline">${newLord.avatarEmoji} ${escapeHtml(newLord.displayName).toUpperCase()} HAS DETHRONED ${escapeHtml(oldLord.displayName).toUpperCase()}</p>
      <div class="dynasty-overlay-battle">
        <div class="dynasty-overlay-side winner">🍺 ${escapeHtml(newLord.displayName)} — ${newLordXp} XP</div>
        <div class="dynasty-overlay-side loser">💀 ${escapeHtml(oldLord.displayName)} — ${oldLordEndingXp ?? 0} XP</div>
      </div>
      <p class="dynasty-overlay-tagline">A NEW REIGN BEGINS.</p>
      <div class="dynasty-overlay-newlord">👑 ${escapeHtml(newLord.displayName).toUpperCase()} IS THE NEW ABT LORD</div>
      <p class="dynasty-overlay-subtitle">"May their glass never run dry."</p>
      <button type="button" class="btn btn-primary dynasty-overlay-btn" onclick="closeDramaticOverlay()">LONG LIVE THE ABT LORD</button>
    </div>
  `);
}

function renderNicknameCard(n, opts = {}){
  const compact = !!opts.compact;
  const { level, next, progressPct, xpToNext } = getNicknameLevelInfo(n.xp);
  const funnyScore = n.votes.funny.length;
  const accurateScore = n.votes.accurate.length;
  const savageScore = n.votes.savage.length;
  const statusClass = statusBadgeClass(n.status);

  return `
    <div class="sticker-card nickname-card ${compact ? 'nickname-card-compact' : ''}">
      <div class="nickname-card-top">

function rerenderNicknamesResults(){

  if (mount) mount.innerHTML = renderNicknamesResultsHtml();
}

function updateNicknameSearch(value){
  NICKNAME_FILTER_STATE.search = value;
  rerenderNicknamesResults();
}

  NICKNAME_FILTER_STATE[field] = value;
  rerenderNicknamesResults();
}

  NICKNAME_FILTER_STATE.search = '';

async function submitNicknameForm(event){
  event.preventDefault();
  const form = event.target;
  const mode = form.dataset.mode;
  const editId = form.dataset.id;

  const personRealName = document.getElementById('nf-realname').value.trim();
  const businessUnit = document.getElementById('nf-businessunit').value.trim();
  const text = document.getElementById('nf-text').value.trim();
  const description = document.getElementById('nf-origin').value.trim();
  const anecdote = document.getElementById('nf-anecdote').value.trim();
  const status = document.getElementById('nf-status').value;
  const errorEl = document.getElementById('nf-error');

  if (!personRealName || !text){
    errorEl.textContent = 'Vul de echte naam van de persoon en een nickname in.';
    return false;
  }
  errorEl.textContent = '';

  let error;
  if (mode === 'edit'){
    ({ error } = await sb.from('nicknames').update({
      person_real_name: personRealName, business_unit: businessUnit || null,
      nickname: text, description, anecdote, status,
    }).eq('id', editId));
  } else {
    ({ error } = await sb.from('nicknames').insert({
      person_real_name: personRealName, business_unit: businessUnit || null,
      nickname: text, description, anecdote,
      status: status || 'Actief',
      created_by_user_id: STATE.activeUser,
    }));
  }

  if (error){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return false; }

  await refreshAppData();
  closeModal();
  renderPage();
  return false;
}

    <p>"${escapeHtml(n.text)}" wordt definitief verwijderd, inclusief stemmen en gebruiksgeschiedenis. Dit kan niet ongedaan gemaakt worden.</p>

async function logNicknameUsage(nicknameId, typeId){
  const n = APP_DATA.nicknames.find(x => x.id === nicknameId);
  const type = USAGE_TYPES.find(t => t.id === typeId);
  if (!n || !type) return;
  await sb.from('nickname_events').insert({
    nickname_id: nicknameId, event_type: type.id, xp_value: type.xp, created_by_user_id: STATE.activeUser,
  });
  await refreshAppData();
  closeModal();
  renderPage();
}

/* ---- stemmen: max 1 stem per user per categorie, togglebaar ---- */
async function toggleNicknameVote(nicknameId, category){
  const n = APP_DATA.nicknames.find(x => x.id === nicknameId);
  if (!n) return;
  const alreadyVoted = n.votes[category].includes(STATE.activeUser);
  if (alreadyVoted){
    await sb.from('nickname_votes').delete().eq('nickname_id', nicknameId).eq('user_id', STATE.activeUser).eq('vote_type', category);
  } else {
    await sb.from('nickname_votes').insert({ nickname_id: nicknameId, user_id: STATE.activeUser, vote_type: category });
  }
  await refreshAppData();
  renderPage();
}

   al ingevulde naam te verliezen. */
function switchLoreFormType(kind){
  const currentName = document.getElementById('lf-realname')?.value;
  openModal(renderLoreFormHtml('add', kind, null, currentName));
}

async function submitLoreForm(event){
  event.preventDefault();
  const form = event.target;
  const mode = form.dataset.mode;
  const kind = form.dataset.kind;
  const editId = form.dataset.id;
  const errorEl = document.getElementById('lf-error');
  const personRealName = document.getElementById('lf-realname').value.trim();
  const businessUnit = document.getElementById('lf-businessunit').value.trim();

  if (!personRealName){
    errorEl.textContent = 'Vul de echte naam van de persoon in.';
    return false;
  }

  let error;
  if (kind === 'quote'){
    const text = document.getElementById('lf-text').value.trim();
    const context = document.getElementById('lf-context').value.trim();
    if (!text){
      errorEl.textContent = 'Vul de exacte quote in.';
      return false;
    }
    errorEl.textContent = '';
    if (mode === 'edit'){
      ({ error } = await sb.from('quotes').update({
        person_real_name: personRealName, business_unit: businessUnit || null, quote: text, context,
      }).eq('id', editId));
    } else {
      ({ error } = await sb.from('quotes').insert({
        person_real_name: personRealName, business_unit: businessUnit || null, quote: text, context,
        created_by_user_id: STATE.activeUser,
      }));
    }
  } else {
    const title = document.getElementById('lf-title').value.trim();
    const description = document.getElementById('lf-description').value.trim();
    if (!title || !description){
      errorEl.textContent = 'Vul titel en beschrijving in.';
      return false;
    }
    errorEl.textContent = '';
    if (mode === 'edit'){
      ({ error } = await sb.from('anecdotes').update({
        person_real_name: personRealName, business_unit: businessUnit || null, title, description,
      }).eq('id', editId));
    } else {
      ({ error } = await sb.from('anecdotes').insert({
        person_real_name: personRealName, business_unit: businessUnit || null, title, description,
        created_by_user_id: STATE.activeUser,
      }));
    }
  }

  if (error){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return false; }

  await refreshAppData();
  closeModal();
  renderPage();
  return false;
}

/* ---- verwijderen (met modal-bevestiging) ---- */

async function performDeleteLoreItem(kind, id){
  await sb.from(kind === 'quote' ? 'quotes' : 'anecdotes').delete().eq('id', id);
  await refreshAppData();
  closeModal();
  renderPage();
}

/* ---- reacties: togglebaar, net als nickname-stemmen ---- */
async function toggleLoreReaction(kind, itemId, category){
  const list = kind === 'quote' ? APP_DATA.quotes : APP_DATA.anecdotes;
  const item = list.find(x => x.id === itemId);
  if (!item) return;
  const table = kind === 'quote' ? 'quote_reactions' : 'anecdote_reactions';
  const idField = kind === 'quote' ? 'quote_id' : 'anecdote_id';
  const alreadyReacted = item.reactions[category].includes(STATE.activeUser);
  if (alreadyReacted){
    await sb.from(table).delete().eq(idField, itemId).eq('user_id', STATE.activeUser).eq('reaction_type', category);
  } else {
    await sb.from(table).insert({ [idField]: itemId, user_id: STATE.activeUser, reaction_type: category });
  }
  // all-three bonus (if any) is awarded server-side by a trigger on insert
  await refreshAppData();
  renderPage();
}

function openCounterForm(mode, counterId, presetRealName){
  const counter = mode === 'edit' ? APP_DATA.counters.find(c => c.id === counterId) : null;
  openModal(renderCounterFormHtml(mode, counter, presetRealName));
}

async function submitCounterForm(event){
  event.preventDefault();
  const form = event.target;
  const mode = form.dataset.mode;
  const editId = form.dataset.id;

  const name = document.getElementById('cf-name').value.trim();
  const personRealName = document.getElementById('cf-realname').value.trim();
  const businessUnit = document.getElementById('cf-businessunit').value.trim();
  const description = document.getElementById('cf-description').value.trim();
  const errorEl = document.getElementById('cf-error');

  if (!name || !personRealName){
    errorEl.textContent = 'Vul een naam voor de counter in en de echte naam van de persoon.';
    return false;
  }
  errorEl.textContent = '';

  let error;
  if (mode === 'edit'){
    ({ error } = await sb.from('counters').update({
      title: name, person_real_name: personRealName, business_unit: businessUnit || null, description,
    }).eq('id', editId));
  } else {
    const startEl = document.getElementById('cf-start');
    const start = startEl ? Math.max(0, parseInt(startEl.value, 10) || 0) : 0;
    const { data, error: insertError } = await sb.from('counters').insert({
      title: name, person_real_name: personRealName, business_unit: businessUnit || null, description,
      created_by_user_id: STATE.activeUser,
    }).select().single();
    error = insertError;
    if (!error && start > 0){
      ({ error } = await sb.from('counter_events').insert({
        counter_id: data.id, registered_by_user_id: STATE.activeUser, delta: start, note: 'Startwaarde',
      }));
    }
  }

  if (error){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return false; }

  await refreshAppData();
  closeModal();
  renderPage();
  return false;
}

/* Speelse podiumkaarten voor plaats 1-3 (1 in het midden, met
   optionele kroonbadge), en een gewone ranglijst voor de rest.
   entries = [{ avatar, title, subtitle, value, onClick }]. */
function renderPodium(entries, opts = {}){
  if (!entries.length) return emptyState('Nog geen data voor dit klassement.');

  const top3 = entries.slice(0, 3);
  const restLimit = opts.restLimit ?? 7;
  const rest = entries.slice(3, 3 + restLimit);
  const medals = ['🥇', '🥈', '🥉'];
  const displayOrder = [1, 0, 2].filter(i => top3[i]);

  const podiumHtml = displayOrder.map(i => {
    const e = top3[i];
    const place = i + 1;
    const isBeerifyWinner = place === 1 && opts.beerify;
    return `
      <div class="podium-spot podium-place-${place} ${isBeerifyWinner ? 'podium-beerify' : ''} ${e.onClick ? 'clickable' : ''}" ${e.onClick ? `onclick="${e.onClick}"` : ''}>
        ${place === 1 && opts.crown ? `<div class="podium-crown">👑</div>` : ''}
        ${isBeerifyWinner ? `
          <div class="podium-bubbles"><span></span><span></span><span></span><span></span></div>
          <div class="podium-trophy">🏆</div>
        ` : ''}
        <div class="podium-medal">${medals[place - 1]}</div>
        <div class="podium-avatar">${entryAvatarHtml(e, 54)}</div>
        <div class="podium-title">${escapeHtml(e.title)}</div>
        ${e.subtitle ? `<div class="podium-subtitle">${escapeHtml(e.subtitle)}</div>` : ''}
        <div class="podium-value">${e.value}</div>
      </div>
    `;
  }).join('');

  const restHtml = rest.length ? `
    <div class="row-list" style="margin-top:14px;">
      ${rest.map((e, idx) => `
        <div class="row-item ${e.onClick ? 'clickable' : ''}" ${e.onClick ? `onclick="${e.onClick}"` : ''}>
          <div class="rank">#${idx + 4}</div>
          ${entryAvatarHtml(e, 40)}
          <div class="info">
            <div class="name">${escapeHtml(e.title)}</div>
            ${e.subtitle ? `<div class="sub">${escapeHtml(e.subtitle)}</div>` : ''}
          </div>
          <div class="value">${e.value}</div>
        </div>
      `).join('')}
    </div>
  ` : '';

  return `<div class="podium ${opts.compact ? 'compact' : ''}">${podiumHtml}</div>${restHtml}`;
}

/* ---- The Abt Lord: overdreven ceremoniële troon voor Home ---- */
function renderAbtLordThrone(){
  const lordId = ABT_LORD_STATE.currentLordId;
  if (!lordId){
    return emptyState('Nog niemand heeft Beer XP verdiend. Log een Beer Session om de troon te claimen! 👑');
  }
  const u = findUser(lordId);
  const xp = computeBeerXp(lordId);
  const { level } = getBeerLevelInfo(xp);
  const stats = getBeerUserStats(lordId);
  const fallen = (ABT_LORD_STATE.fallenAbtId && ABT_LORD_STATE.fallenAbtId !== lordId) ? findUser(ABT_LORD_STATE.fallenAbtId) : null;

  const currentReign = APP_DATA.abtReigns.find(r => r.userId === lordId && !r.endedAt);
  const reignDays = currentReign ? getReignDays(currentReign) : 0;
  const longestReign = getLongestReignEver(lordId);
  const captures = getThroneCaptureCount(lordId);
  const totalDaysInPower = getTotalDaysInPower(lordId);

  const runnerUp = APP_DATA.users
    .filter(x => x.id !== lordId)
    .map(x => ({ user: x, xp: computeBeerXp(x.id) }))
    .sort((a, b) => b.xp - a.xp)[0];
  const lead = runnerUp ? xp - runnerUp.xp : null;
  const throneInDanger = lead !== null && lead < 10;

  return `
    <div class="abt-throne">
      <div class="abt-throne-crown">👑</div>
      <div class="abt-throne-title">✦ THE ABT LORD ✦</div>

      <div class="abt-throne-name">${u.avatarEmoji} ${escapeHtml(u.displayName)}</div>
      <div class="abt-throne-subtitle">"May their glass never run dry."</div>
      ${currentReign ? `<div class="abt-throne-reigning">Reigning for ${reignDays} day${reignDays === 1 ? '' : 's'}</div>` : ''}
      <div class="abt-throne-level">${level.icon} ${level.label}</div>
      <div class="abt-throne-stats">
        <div class="abt-stat"><div class="num">${xp}</div><div class="label">🍺 Beer XP</div></div>
        <div class="abt-stat"><div class="num">${stats.totalQuantity}</div><div class="label">Bieren</div></div>
        <div class="abt-stat"><div class="num">${stats.uniqueBeers}</div><div class="label">Verschillend</div></div>
        <div class="abt-stat"><div class="num">${stats.avgRating !== null ? stats.avgRating : '—'}</div><div class="label">Gem. rating</div></div>
        <div class="abt-stat"><div class="num">${stats.perfectPours}</div><div class="label">Perfect Pours</div></div>
      </div>
      <div class="abt-throne-stats abt-throne-dynasty-stats">
        <div class="abt-stat"><div class="num">🏰 ${longestReign}d</div><div class="label">Longest Reign</div></div>
        <div class="abt-stat"><div class="num">⚔️ ${captures}×</div><div class="label">Throne Captured</div></div>
        <div class="abt-stat"><div class="num">👑 ${totalDaysInPower}d</div><div class="label">Total Days in Power</div></div>
      </div>
      ${runnerUp ? `
        <div class="abt-throne-lead ${throneInDanger ? 'danger' : ''}">
          ${throneInDanger ? '⚠️ THE THRONE IS IN DANGER — ' : '⚔️ '}Lead over ${escapeHtml(runnerUp.user.displayName)}: +${lead} XP
        </div>
      ` : ''}

/* ---- de volledige Beer Leaderboards-tab: 12 klassementen ---- */
function renderBeerLeaderboardsPage(data){
  if (!data.beerSessions.length){
    return `<section class="section">${emptyState('Nog geen Beer Sessions gelogd. Klassementen verschijnen zodra er data is.')}</section>`;
  }

  const fmtXp = v => `${v} XP`;
  const fmtBeers = v => `${v} 🍺`;
  const fmtUnique = v => `${v} uniek`;
  const fmtRatings = v => `${v} ratings`;
  const fmtScore = v => v === null ? 'Nog geen score' : `${v}/10`;
  const fmtPours = v => `${v} 🏆`;

  const abtRows = APP_DATA.users.map(u => ({ user: u, value: computeBeerXp(u.id) })).sort((a, b) => b.value - a.value);
  const kingRows = APP_DATA.users.map(u => ({ user: u, value: getBeerUserStats(u.id).totalQuantity })).sort((a, b) => b.value - a.value);
  const explorerRows = APP_DATA.users.map(u => ({ user: u, value: getBeerUniqueTriedCount(u.id) })).sort((a, b) => b.value - a.value);
  const criticRows = APP_DATA.users.map(u => ({ user: u, value: getBeerRatingsGivenCount(u.id) })).sort((a, b) => b.value - a.value);
  const avgRows = APP_DATA.users.map(u => ({ user: u, value: getBeerUserStats(u.id).avgRating }));
  const snobRows = [...avgRows].sort((a, b) => (a.value ?? 99) - (b.value ?? 99));
  const easyRows = [...avgRows].sort((a, b) => (b.value ?? -1) - (a.value ?? -1));
  const pourRows = getMasterOfThePourRows().map(r => ({ user: r.user, value: r.total }));
  const loyalRows = APP_DATA.users
    .map(u => ({ user: u, loyalty: getUserBeerLoyalty(u.id) }))
    .map(r => ({ ...r, value: r.loyalty ? r.loyalty.quantity : 0 }))
    .sort((a, b) => b.value - a.value);

  const crowdFav = getExtremeRatedBeer('high');
  const neverAgain = getExtremeRatedBeer('low');
  const mostConsumed = getMostConsumedBeer();

  const suspiciousQuotes = getSuspiciousQuotes();
  const suspiciousPanel = suspiciousQuotes.length ? `
    <section class="section">
      <div class="suspicious-panel">
        <h3 style="margin:0 0 8px;">🕵️ Verdachte patronen</h3>
        ${suspiciousQuotes.map(q => `<p class="beer-fun-note">💬 ${q}</p>`).join('')}
      </div>
    </section>
  ` : '';

  const podiumSection = (icon, title, rows, formatValue) => `
    <section class="section">
      <div class="section-head"><h3>${icon} ${title}</h3></div>
      ${renderPodium(rows.map(r => userEntry(r.user, r.value, formatValue)))}
    </section>
  `;

  return `
    ${renderAbtDynastyHero()}
    ${suspiciousPanel}
    ${podiumSection('👑', 'The Abt Lord — hoogste Beer XP', abtRows, fmtXp)}
    ${podiumSection('🍺', 'Beer King/Queen — meeste bieren gedronken', kingRows, fmtBeers)}
    ${podiumSection('🧭', 'Beer Explorer — meeste verschillende bieren geprobeerd', explorerRows, fmtUnique)}
    ${podiumSection('📝', 'Beer Critic — meeste ratings gegeven', criticRows, fmtRatings)}
    <section class="section">
      <div class="section-head"><h3>🧐 Beer Snob — laagste gemiddelde rating</h3></div>
      ${renderPodium(snobRows.map(r => userEntry(r.user, r.value, fmtScore)))}
      ${getBeerSnobNote(snobRows) ? `<p class="beer-fun-note">💬 ${getBeerSnobNote(snobRows)}</p>` : ''}
    </section>
    <section class="section">
      <div class="section-head"><h3>😋 Easy Drinker — hoogste gemiddelde rating</h3></div>
      ${renderPodium(easyRows.map(r => userEntry(r.user, r.value, fmtScore)))}
      ${getEasyDrinkerNote(easyRows) ? `<p class="beer-fun-note">💬 ${getEasyDrinkerNote(easyRows)}</p>` : ''}
    </section>
    <section class="section">
      <div class="section-head">
        <h3>🏆 Master of the Pour — meeste Perfect Pours</h3>
        <span class="count-chip">${getTotalPerfectPoursEver()} ooit uitgereikt</span>
      </div>
      ${pourRows.some(r => r.value > 0)
        ? renderPodium(pourRows.map(r => userEntry(r.user, r.value, fmtPours)), { beerify: true, restLimit: 0 }) +
          `<p style="text-align:center; font-weight:800; margin-top:14px; font-size:13px;">🏆 ${escapeHtml(pourRows[0].user.displayName)} is momenteel Master of the Pour!</p>`
        : emptyState('Nog geen Perfect Pours uitgereikt. Stem tijdens of na een Beer Session op een sessiepagina.')}
    </section>
    ${renderFavouriteBeerSection()}
    ${crowdFav ? renderBeerSpotlightCard({
      icon: '🎉', title: 'Crowd Favourite — hoogste gemiddelde score', beer: crowdFav.beer,
      statLabel: 'Gem. score', statValue: `${crowdFav.avg}/10`, note: getCrowdFavouriteNote(crowdFav),
    }) : ''}
    ${neverAgain ? renderBeerSpotlightCard({
      icon: '🙈', title: 'Never Again — laagste gemiddelde score', beer: neverAgain.beer,
      statLabel: 'Gem. score', statValue: `${neverAgain.avg}/10`, note: getNeverAgainNote(neverAgain),
    }) : ''}
    ${mostConsumed ? renderBeerSpotlightCard({
      icon: '🥤', title: 'Most Consumed Beer', beer: mostConsumed.beer,
      statLabel: 'Totaal gedronken', statValue: `${mostConsumed.qty}×`, note: getMostConsumedNote(mostConsumed),
    }) : ''}
    <section class="section">
      <div class="section-head"><h3>🔁 Most Loyal Drinker — meeste van één bier</h3></div>
      ${loyalRows.some(r => r.value > 0)
        ? renderPodium(loyalRows.map(r => userEntry(r.user, r.value, v => `${v}×`, r.loyalty ? r.loyalty.beer.name : null)))
        : emptyState('Nog geen herhaalde bieren gelogd.')}
      ${getMostLoyalNote(loyalRows) ? `<p class="beer-fun-note">💬 ${getMostLoyalNote(loyalRows)}</p>` : ''}
    </section>
  `;
}

/* ---- The Abt Dynasty HERO: the single most prestigious/prominent
   section on the Leaderboards page — current lord's full ceremonial
   stat card, followed immediately by the timeline and records that
   already existed (reused as-is, just relocated + restyled around). ---- */
function renderAbtDynastyHero(){
  const lordId = ABT_LORD_STATE.currentLordId;
  return `
    <section class="dynasty-hero">
      <div class="dynasty-hero-header">
        <div class="dynasty-hero-crown">👑</div>
        <h2 class="dynasty-hero-title">THE ABT DYNASTY</h2>
        <p class="dynasty-hero-tagline">The most prestigious title in the Beer Club.</p>
      </div>
      ${lordId ? renderDynastyHeroCurrentLord(lordId) : emptyState('The throne stands empty. Log a Beer Session to begin the dynasty! 👑')}
      ${renderAbtDynastySection()}
      ${renderSacredRecordsSection()}
    </section>
  `;
}

function renderDynastyHeroCurrentLord(lordId){
  const u = findUser(lordId);
  const xp = computeBeerXp(lordId);
  const { level } = getBeerLevelInfo(xp);
  const currentReign = APP_DATA.abtReigns.find(r => r.userId === lordId && !r.endedAt);
  const reignDays = currentReign ? getReignDays(currentReign) : 0;
  const longestReign = getLongestReignEver(lordId);
  const captures = getThroneCaptureCount(lordId);
  const totalDaysInPower = getTotalDaysInPower(lordId);
  const fallen = (ABT_LORD_STATE.fallenAbtId && ABT_LORD_STATE.fallenAbtId !== lordId) ? findUser(ABT_LORD_STATE.fallenAbtId) : null;

  const runnerUp = APP_DATA.users
    .filter(x => x.id !== lordId)
    .map(x => ({ user: x, xp: computeBeerXp(x.id) }))
    .sort((a, b) => b.xp - a.xp)[0];
  const lead = runnerUp ? xp - runnerUp.xp : null;
  const throneInDanger = lead !== null && lead < 10;

  return `
    <div class="dynasty-hero-lord">
      <div class="dynasty-hero-avatar">${userAvatarHtml(u, 120)}</div>
      <div class="dynasty-hero-name">${u.avatarEmoji} ${escapeHtml(u.displayName)}</div>
      <div class="dynasty-hero-subtitle">"May their glass never run dry."</div>
      <div class="dynasty-hero-level">${level.icon} ${level.label}</div>
      <div class="dynasty-hero-xp">${xp} <span>Beer XP</span></div>
      <div class="dynasty-hero-stats">
        <div class="dynasty-hero-stat"><div class="num">👑 ${reignDays}d</div><div class="label">Current Reign</div></div>
        <div class="dynasty-hero-stat"><div class="num">🏰 ${longestReign}d</div><div class="label">Longest Reign</div></div>
        <div class="dynasty-hero-stat"><div class="num">⏳ ${totalDaysInPower}d</div><div class="label">Total on Throne</div></div>
        <div class="dynasty-hero-stat"><div class="num">⚔️ ${captures}×</div><div class="label">Throne Captures</div></div>
      </div>
      ${runnerUp ? `
        <div class="dynasty-hero-lead ${throneInDanger ? 'danger' : ''}">
          ${throneInDanger ? '⚠️ THE THRONE IS IN DANGER — ' : '⚔️ '}Lead over ${escapeHtml(runnerUp.user.displayName)}: +${lead} XP
        </div>
      ` : ''}
      ${fallen ? `
        <div class="fallen-abt-badge">
          <span class="badge peach">💀 The Fallen Abt: ${fallen.avatarEmoji} ${escapeHtml(fallen.displayName)}</span>
        </div>
      ` : ''}
    </div>
  `;
}

/* ---- The Abt Dynasty: vertical reign timeline, oldest -> present ---- */
function renderAbtDynastySection(){
  const reigns = getAllReignsSorted();
  if (!reigns.length){
    return `
      <section class="section">
        <div class="section-head"><h3>📖 Historical Reigns</h3></div>
        ${emptyState('The throne has not been claimed yet. Log a Beer Session to begin the dynasty!')}
      </section>
    `;
  }
  return `
    <section class="section">
      <div class="section-head"><h3>📖 Historical Reigns</h3></div>
      <div class="dynasty-timeline">
        ${reigns.map(r => {
          const user = findUser(r.userId);
          const isCurrent = !r.endedAt;
          const days = getReignDays(r);
          return `
            <div class="dynasty-entry ${isCurrent ? 'current' : ''}">
              <div class="dynasty-avatar">${userAvatarHtml(user, 46)}</div>
              <div class="dynasty-info">
                <div class="dynasty-name">${user.avatarEmoji} ${escapeHtml(user.displayName)}</div>
                <div class="dynasty-length">👑 ${isCurrent ? 'Current reign' : `${days} day${days === 1 ? '' : 's'}`}</div>
                <div class="dynasty-dates">${formatNiceDate(r.startedAt)} → ${isCurrent ? 'Present' : formatNiceDate(r.endedAt)}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </section>
  `;
}

function renderSacredRecordsSection(){
  const records = getAbtRecords();
  if (!records){

    { icon: '🏰', label: 'Longest Reign', entry: records.longestReign, unit: 'days' },

    { icon: '💀', label: 'Most Dethroned', entry: records.mostDethroned, unit: '×' },

          ${rows.map(r => `

function openBeerForm(mode, beerId){
  const beer = mode === 'edit' ? APP_DATA.beers.find(b => b.id === beerId) : null;
  beerFormPhoto = beer?.photo || null;
  openModal(renderBeerFormHtml(mode, beer));
}

function handleBeerPhotoUpload(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    beerFormPhoto = e.target.result;
    const clearBtn = document.getElementById('beer-clear-photo-btn');
    if (clearBtn) clearBtn.style.display = 'inline-flex';
    const preview = document.getElementById('beer-photo-preview');
    if (preview) preview.innerHTML = beerPhotoHtml(beerFormPhoto, 72);
  };
  reader.readAsDataURL(file);
}

function clearBeerPhoto(){
  beerFormPhoto = null;
  const clearBtn = document.getElementById('beer-clear-photo-btn');
  if (clearBtn) clearBtn.style.display = 'none';
  const preview = document.getElementById('beer-photo-preview');
  if (preview) preview.innerHTML = beerPhotoHtml(null, 72);
}

async function submitBeerForm(event){
  event.preventDefault();
  const form = event.target;
  const mode = form.dataset.mode;
  const editId = form.dataset.id;

  const name = document.getElementById('bf-name').value.trim();
  const brewery = document.getElementById('bf-brewery').value.trim();
  const style = document.getElementById('bf-style').value.trim();
  const abvRaw = document.getElementById('bf-abv').value;
  const abv = abvRaw === '' ? null : Math.max(0, parseFloat(abvRaw));
  const country = document.getElementById('bf-country').value.trim();
  const errorEl = document.getElementById('bf-error');

  if (!name || !brewery || !style){
    errorEl.textContent = 'Vul minstens naam, brouwerij en type in.';
    return false;
  }
  // Een bier mag maar één keer als uniek bier voorkomen (zelfde naam + brouwerij).
  if (isDuplicateBeer(name, brewery, mode === 'edit' ? editId : null)){
    errorEl.textContent = 'Dit bier (zelfde naam + brouwerij) staat al in de Beer Database.';
    return false;
  }
  errorEl.textContent = '';

  let error;
  if (mode === 'edit'){
    ({ error } = await sb.from('beers').update({
      name, brewery, beer_style: style, alcohol_percentage: abv, country, image_url: beerFormPhoto,
    }).eq('id', editId));
  } else {
    ({ error } = await sb.from('beers').insert({
      name, brewery, beer_style: style, alcohol_percentage: abv, country, image_url: beerFormPhoto,
      created_by_user_id: STATE.activeUser,
    }));
  }

  if (error){
    errorEl.textContent = error.code === '23505' ? 'Dit bier (zelfde naam + brouwerij) staat al in de Beer Database.' : 'Opslaan mislukt, probeer opnieuw.';
    return false;
  }

  await refreshAppData();
  closeModal();
  renderPage();
  return false;
}

async function confirmDeleteBeer(id){
  const b = APP_DATA.beers.find(x => x.id === id);
  if (!b) return;

  const [{ count: consumptionCount }, { count: ratingCount }] = await Promise.all([
    sb.from('beer_consumption').select('id', { count: 'exact', head: true }).eq('beer_id', id),
    sb.from('beer_ratings').select('id', { count: 'exact', head: true }).eq('beer_id', id),
  ]);
  const sessionCount = new Set(
    APP_DATA.beerSessions.filter(s => s.beerIds.includes(id)).map(s => s.id)
  ).size;
  const inUse = (consumptionCount || 0) > 0 || (ratingCount || 0) > 0;

  openModal(`
    <h3>🗑️ Bier verwijderen?</h3>
    ${inUse ? `
      <p>"${escapeHtml(b.name)}" is al ${consumptionCount || 0}× geregistreerd${sessionCount ? ` in ${sessionCount} sessie${sessionCount === 1 ? '' : 's'}` : ''} met ${ratingCount || 0} rating${ratingCount === 1 ? '' : 's'}. Verwijderen wist al die consumptie, ratings en de bijhorende XP definitief. Dit kan niet ongedaan gemaakt worden.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
        <button type="button" class="btn btn-danger" onclick="performDeleteBeer('${id}')">Bier en alle gerelateerde data verwijderen</button>
      </div>
    ` : `
      <p>"${escapeHtml(b.name)}" wordt definitief verwijderd. Dit bier is nog niet gebruikt in een sessie of rating.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
        <button type="button" class="btn btn-danger" onclick="performDeleteBeer('${id}')">Ja, verwijderen</button>
      </div>
    `}
  `);
}

async function performDeleteBeer(id){
  await sb.from('beers').delete().eq('id', id);
  await refreshAppData();
  closeModal();
  if (BEER_STATE.beerDetailId === id){
    BEER_STATE.view = 'database';
    BEER_STATE.beerDetailId = null;
  }
  renderPage();
}

async function submitStandaloneRatingForm(event){
  event.preventDefault();
  const form = event.target;
  const beerId = form.dataset.beerId;
  const errorEl = document.getElementById('sr-error');

  const score = Math.max(0, Math.min(10, parseFloat(document.getElementById('sr-score').value)));
  const date = document.getElementById('sr-date').value;
  const review = document.getElementById('sr-review').value.trim();
  const quantityRaw = document.getElementById('sr-quantity').value;
  const quantity = quantityRaw === '' ? 0 : Math.max(0, parseInt(quantityRaw, 10) || 0);
  const context = document.getElementById('sr-context').value.trim();

  if (!score || !date){
    errorEl.textContent = 'Vul minstens een score en datum in.';
    return false;
  }
  errorEl.textContent = '';

  const { error: ratingError } = await sb.from('beer_ratings').insert({
    beer_id: beerId, session_id: null, user_id: STATE.activeUser,
    rating: score, review, rated_at: date, context: context || null,
  });
  if (ratingError){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return false; }

  if (quantity > 0){
    await sb.from('beer_consumption').insert({ beer_id: beerId, session_id: null, user_id: STATE.activeUser, quantity });
  }

  await refreshAppData();
  closeModal();
  renderPage();
  return false;
}

function confirmDeleteStandaloneRating(ratingId, beerId){
  openModal(`
    <h3>🗑️ Losse rating verwijderen?</h3>
    <p>Deze rating (en het bijhorende aantal, indien ingevuld) wordt definitief verwijderd. Dit kan niet ongedaan gemaakt worden.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
      <button type="button" class="btn btn-danger" onclick="performDeleteStandaloneRating('${ratingId}','${beerId}')">Ja, verwijderen</button>
    </div>
  `);
}

async function performDeleteStandaloneRating(ratingId, beerId){
  const entry = APP_DATA.standaloneBeerEntries.find(e => e.kind === 'rating' && e.id === ratingId);
  await sb.from('beer_ratings').delete().eq('id', ratingId);
  // best-effort: ook de gekoppelde losse consumptie-registratie opruimen (zelfde matching als bij het laden)
  if (entry && entry.quantity > 0){
    await sb.from('beer_consumption')
      .delete()
      .eq('beer_id', beerId)
      .eq('user_id', entry.userId)
      .is('session_id', null)
      .eq('quantity', entry.quantity)
      .gte('created_at', new Date(new Date(entry.createdAt).getTime() - 5000).toISOString())
      .lte('created_at', new Date(new Date(entry.createdAt).getTime() + 5000).toISOString());
  }
  await refreshAppData();
  closeModal();
  renderPage();
}

/* ---- nieuwe-sessie-formulier / bewerk-formulier (eigen pagina, geen modal) ----
   Zelfde formulier voor 'add' en 'edit': BEER_STATE.sessionFormMode +
   .sessionFormEditId bepalen welke modus, zelfde patroon als
   openBeerForm(mode, id). Bij edit wordt SESSION_DRAFT vooraf gevuld
   vanuit de bestaande sessie zodat de matrix meteen alles toont. */
function openSessionForm(mode, sessionId){
  const editMode = mode === 'edit';
  const session = editMode ? APP_DATA.beerSessions.find(s => s.id === sessionId) : null;
  if (editMode && !session){
    BEER_STATE.view = 'sessions';
    renderPage();
    return;
  }

  BEER_STATE.sessionFormMode = editMode ? 'edit' : 'add';
  BEER_STATE.sessionFormEditId = editMode ? sessionId : null;

  if (editMode){
    const perParticipant = {};
    session.participantIds.forEach(userId => {
      perParticipant[userId] = session.entries
        .filter(e => e.userId === userId)
        .map(e => ({ beerId: e.beerId, quantity: e.quantity || 0, score: e.score || 0, review: e.review || '', persisted: true }));
    });
    SESSION_DRAFT = { participantIds: [...session.participantIds], perParticipant };
  } else {
    SESSION_DRAFT = { participantIds: [], perParticipant: {} };
  }

  BEER_STATE.view = 'sessionForm';
  renderPage();

function toggleSessionParticipant(userId, btn){
  const idx = SESSION_DRAFT.participantIds.indexOf(userId);
  if (idx === -1){
    SESSION_DRAFT.participantIds.push(userId);
    if (!SESSION_DRAFT.perParticipant[userId]) SESSION_DRAFT.perParticipant[userId] = [];
    btn.classList.toggle('btn-primary');
    btn.classList.toggle('btn-ghost');
    renderParticipantBeerLists();
    return;
  }

  // deelnemer met al bestaande (persisted) sessiedata mag niet zomaar
  // stilzwijgend verdwijnen -> bevestiging met échte aantallen tonen
  const lines = SESSION_DRAFT.perParticipant[userId] || [];
  const hasPersistedData = lines.some(l => l.persisted);
  if (hasPersistedData && BEER_STATE.sessionFormMode === 'edit'){
    confirmRemoveParticipant(userId);
    return;
  }

  SESSION_DRAFT.participantIds.splice(idx, 1);
  btn.classList.toggle('btn-primary');
  btn.classList.toggle('btn-ghost');
  renderParticipantBeerLists();
}

function confirmRemoveParticipant(userId){
  const u = findUser(userId);
  const lines = SESSION_DRAFT.perParticipant[userId] || [];
  const beerCount = lines.reduce((sum, l) => sum + (l.quantity || 0), 0);
  const ratingCount = lines.filter(l => l.score > 0).length;

  openModal(`
    <h3>🗑️ Deelnemer verwijderen?</h3>
    <p>${escapeHtml(u.displayName)} heeft al ${beerCount} bier${beerCount === 1 ? '' : 'en'} en ${ratingCount} rating${ratingCount === 1 ? '' : 's'} in deze sessie. Als je ${escapeHtml(u.displayName)} verwijdert, verdwijnt al die data mee — dit kan niet ongedaan gemaakt worden.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
      <button type="button" class="btn btn-danger" onclick="performRemoveParticipant('${userId}')">${escapeHtml(u.displayName)} en hun data verwijderen</button>
    </div>
  `);
}

async function performRemoveParticipant(userId){
  const sessionId = BEER_STATE.sessionFormEditId;
  await sb.from('beer_session_participants').delete().eq('session_id', sessionId).eq('user_id', userId);
  await sb.from('beer_ratings').delete().eq('session_id', sessionId).eq('user_id', userId);
  await sb.from('beer_consumption').delete().eq('session_id', sessionId).eq('user_id', userId);

  await refreshAppData();
  closeModal();

  const idx = SESSION_DRAFT.participantIds.indexOf(userId);
  if (idx !== -1) SESSION_DRAFT.participantIds.splice(idx, 1);
  delete SESSION_DRAFT.perParticipant[userId];

  renderPage();
}

/* Per-deelnemer kaarten met hun eigen bierregels + "+ Add beer for X"
   -- bewust GEEN bier×deelnemer-matrix meer. Een bierregel bestaat
   alleen als hij expliciet voor die ene deelnemer is toegevoegd, dus
   een bier toevoegen voor Nick kan nooit een regel voor Elien/Atti
   aanmaken (de bug die dit vervangt). */
function buildParticipantBeerListsHtml(){
  if (!SESSION_DRAFT.participantIds.length){
    return emptyState('Kies minstens één deelnemer om bieren te registreren.');
  }

  return SESSION_DRAFT.participantIds.map(userId => {
    const u = findUser(userId);
    const lines = SESSION_DRAFT.perParticipant[userId] || [];
    const isMe = userId === STATE.activeUser;
    return `
      <div class="sticker-card" style="text-align:left; margin-bottom:12px;">
        <div class="nickname-person" style="margin-bottom:10px;">${u.avatarEmoji}<span>${escapeHtml(u.displayName)}</span></div>
        ${lines.length ? `
          <div class="row-list" style="margin-bottom:10px;">
            ${lines.map((line, idx) => {
              const beer = APP_DATA.beers.find(b => b.id === line.beerId);
              return `
                <div class="row-item" style="cursor:pointer;" onclick="openAddBeerLineModal('${userId}', ${idx})">
                  <div class="avatar" style="background:var(--peach)">🍺</div>
                  <div class="info">
                    <div class="name">${beer ? escapeHtml(beer.name) : '(onbekend bier)'} — ${line.quantity}×${line.score > 0 ? ` · ${line.score}/10` : ''}</div>
                    <div class="sub">${line.review ? escapeHtml(line.review) : 'Klik om te bewerken'}</div>
                  </div>
                  <button type="button" class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); removeBeerLine('${userId}', ${idx})">🗑</button>

              `;
            }).join('')}

        ` : ''}
        <button type="button" class="btn btn-secondary btn-sm" onclick="openAddBeerLineModal('${userId}')">+ Add beer ${isMe ? 'I drank' : 'for ' + escapeHtml(u.displayName)}</button>
      </div>

}

function renderParticipantBeerLists(){
  const mount = document.getElementById('session-participant-beers');
  if (!mount) return;
  mount.innerHTML = buildParticipantBeerListsHtml();
}

/* ---- "+ Add beer for X" / bierregel bewerken -- altijd voor precies
   één deelnemer, nooit voor de rest van de sessie. lineIndex meegeven
   = bestaande regel rechtstreeks bewerken (zet de waarden); weglaten
   = "voeg bier toe"-modus, die het aantal VERHOOGT i.p.v. een
   duplicaat te maken als dat bier al op de lijst van deze deelnemer
   staat. ---- */
function openAddBeerLineModal(userId, lineIndex){
  const u = findUser(userId);
  const isEdit = typeof lineIndex === 'number';
  const line = isEdit ? SESSION_DRAFT.perParticipant[userId][lineIndex] : null;

  openModal(`
    <h3>🍺 ${isEdit ? 'Bier bewerken' : 'Bier toevoegen'} — ${escapeHtml(u.displayName)}</h3>
    <form data-user-id="${userId}" data-line-index="${isEdit ? lineIndex : ''}" onsubmit="return submitAddBeerLine(event)">
      <div class="form-field">
        <label class="form-label" for="abl-beer">Bier *</label>
        <select class="form-input" id="abl-beer" required>
          <option value="" ${!line ? 'selected' : ''} disabled>— kies een bier —</option>
          ${APP_DATA.beers.map(b => `<option value="${b.id}" ${line && line.beerId === b.id ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
        </select>
        ${!APP_DATA.beers.length ? emptyState('Voeg eerst een bier toe via de Beer Database.') : ''}
      </div>
      <div class="form-grid" style="margin-top:10px;">
        <div class="form-field">
          <label class="form-label" for="abl-quantity">Aantal *</label>
          <input class="form-input" id="abl-quantity" type="number" min="${isEdit ? 0 : 1}" step="1" value="${isEdit ? line.quantity : 1}" required>
          ${isEdit ? '<div class="form-hint" style="font-size:11.5px; color:#8a7a6b; margin-top:4px;">0 invullen verwijdert dit bier uit de sessie.</div>' : ''}
        </div>
        <div class="form-field">
          <label class="form-label" for="abl-score">Score (0-10)</label>
          <input class="form-input" id="abl-score" type="number" min="0" max="10" step="0.5" value="${isEdit && line.score > 0 ? line.score : ''}" placeholder="Optioneel">
        </div>
      </div>
      <div class="form-field" style="margin-top:10px;">
        <label class="form-label" for="abl-review">Review</label>
        <input class="form-input" id="abl-review" type="text" value="${isEdit ? escapeHtml(line.review) : ''}" placeholder="Optioneel">
      </div>
      <div id="abl-error" class="form-error"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
        <button type="submit" class="btn btn-primary">${isEdit ? 'Opslaan' : 'Toevoegen'}</button>
      </div>
    </form>
  `);
}

function submitAddBeerLine(event){
  event.preventDefault();
  const form = event.target;
  const userId = form.dataset.userId;
  const lineIndexRaw = form.dataset.lineIndex;
  const isEdit = lineIndexRaw !== '';
  const errorEl = document.getElementById('abl-error');

  const beerId = document.getElementById('abl-beer').value;
  const quantityInput = parseInt(document.getElementById('abl-quantity').value, 10);
  const quantity = isNaN(quantityInput) ? (isEdit ? 0 : 1) : Math.max(0, quantityInput);
  const scoreRaw = document.getElementById('abl-score').value;
  const score = scoreRaw === '' ? 0 : Math.max(0, Math.min(10, parseFloat(scoreRaw) || 0));
  const review = document.getElementById('abl-review').value.trim();

  if (!beerId){ errorEl.textContent = 'Kies een bier.'; return false; }

  if (!SESSION_DRAFT.perParticipant[userId]) SESSION_DRAFT.perParticipant[userId] = [];
  const lines = SESSION_DRAFT.perParticipant[userId];

  if (isEdit){
    const idx = parseInt(lineIndexRaw, 10);
    const existingLine = lines[idx];
    if (quantity === 0){
      // aantal op 0 zetten is hetzelfde als verwijderen: voor een
      // reeds opgeslagen regel via de bevestigde delete-flow, voor een
      // nog niet opgeslagen regel gewoon lokaal weg (niets te verliezen)
      closeModal();
      if (existingLine && existingLine.persisted){
        confirmRemoveBeerLine(BEER_STATE.sessionFormEditId, userId, existingLine.beerId);
      } else if (existingLine){
        lines.splice(idx, 1);
        renderParticipantBeerLists();
      }
      return false;
    }
    lines[idx] = { ...existingLine, beerId, quantity, score, review };
  } else {
    if (quantity < 1){ errorEl.textContent = 'Vul een aantal in.'; return false; }
    const existingIdx = lines.findIndex(l => l.beerId === beerId);
    if (existingIdx !== -1){
      // zelfde bier nogmaals toegevoegd voor deze ene deelnemer -> aantal verhogen, geen duplicaat
      lines[existingIdx] = {
        beerId, quantity: lines[existingIdx].quantity + quantity,
        score: score > 0 ? score : lines[existingIdx].score,
        review: review || lines[existingIdx].review,
      };
    } else {
      lines.push({ beerId, quantity, score, review });
    }
  }

  closeModal();
  renderParticipantBeerLists();
  return false;
}

function removeBeerLine(userId, lineIndex){
  const lines = SESSION_DRAFT.perParticipant[userId];
  if (!lines || !lines[lineIndex]) return;
  const line = lines[lineIndex];

  // een regel die al in de DB staat mag niet zomaar stilzwijgend
  // verdwijnen -> bevestigen en meteen verwijderen (los van "Wijzigingen
  // opslaan"), een nog niet opgeslagen regel mag gewoon lokaal weg
  if (line.persisted){
    confirmRemoveBeerLine(BEER_STATE.sessionFormEditId, userId, line.beerId);
    return;
  }
  lines.splice(lineIndex, 1);
  renderParticipantBeerLists();
}

function confirmRemoveBeerLine(sessionId, userId, beerId){
  const u = findUser(userId);
  const beer = APP_DATA.beers.find(b => b.id === beerId);
  const session = APP_DATA.beerSessions.find(s => s.id === sessionId);
  const entry = session ? session.entries.find(e => e.userId === userId && e.beerId === beerId) : null;
  const hasRating = !!entry && typeof entry.score === 'number' && entry.score > 0;

  openModal(`
    <h3>🗑️ Bier verwijderen uit sessie?</h3>
    <p>Weet je zeker dat je <strong>${beer ? escapeHtml(beer.name) : 'dit bier'}</strong> wilt verwijderen uit ${escapeHtml(u.displayName)}'s consumptie in deze sessie?</p>
    ${hasRating ? `
      <label style="display:flex; align-items:center; gap:8px; margin:12px 0; font-size:13px; font-weight:700;">
        <input type="checkbox" id="rbl-remove-rating"> Ook de sessie-rating verwijderen (${entry.score}/10)
      </label>
    ` : ''}
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuleren</button>
      <button type="button" class="btn btn-danger" onclick="performRemoveBeerLine('${sessionId}','${userId}','${beerId}')">Verwijderen</button>
    </div>
  `);
}

async function performRemoveBeerLine(sessionId, userId, beerId){
  const removeRatingCheckbox = document.getElementById('rbl-remove-rating');
  const alsoRemoveRating = removeRatingCheckbox ? removeRatingCheckbox.checked : false;

  await sb.from('beer_consumption').delete().eq('session_id', sessionId).eq('user_id', userId).eq('beer_id', beerId);
  if (alsoRemoveRating){
    await sb.from('beer_ratings').delete().eq('session_id', sessionId).eq('user_id', userId).eq('beer_id', beerId);
  }

  await refreshAppData();
  closeModal();

  // draft-regels van deze ene deelnemer herbouwen vanuit de verse data,
  // zodat een bewaarde rating (checkbox uit) correct als losse regel
  // blijft staan i.p.v. de hele regel lokaal te laten verdwijnen
  const freshSession = APP_DATA.beerSessions.find(s => s.id === sessionId);
  if (freshSession){
    SESSION_DRAFT.perParticipant[userId] = freshSession.entries
      .filter(e => e.userId === userId)
      .map(e => ({ beerId: e.beerId, quantity: e.quantity || 0, score: e.score || 0, review: e.review || '', persisted: true }));
  }

  renderPage();
}

async function submitSessionForm(){
  const errorEl = document.getElementById('sf-error');
  const date = document.getElementById('sf-date').value;
  const location = document.getElementById('sf-location').value.trim();

  if (!date){
    errorEl.textContent = 'Kies een datum.';
    return;
  }
  if (!SESSION_DRAFT.participantIds.length){
    errorEl.textContent = 'Kies minstens één deelnemer.';
    return;
  }
  errorEl.textContent = '';

  const editMode = BEER_STATE.sessionFormMode === 'edit';
  const editId = BEER_STATE.sessionFormEditId;

  if (editMode){
    const ok = await saveEditedSession(editId, date, location);
    if (!ok){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return; }
    await refreshAppData();
    BEER_STATE.sessionFormMode = null;
    BEER_STATE.sessionFormEditId = null;
    BEER_STATE.view = 'sessionDetail';
    BEER_STATE.sessionDetailId = editId;
    renderPage();
    return;
  }

  const { data: session, error: sessionError } = await sb.from('beer_sessions').insert({
    session_date: date, location, created_by_user_id: STATE.activeUser,
  }).select().single();
  if (sessionError){ errorEl.textContent = 'Opslaan mislukt, probeer opnieuw.'; return; }

  await sb.from('beer_session_participants').insert(
    SESSION_DRAFT.participantIds.map(userId => ({ session_id: session.id, user_id: userId }))
  );

  const ratingRows = [];
  const consumptionRows = [];
  SESSION_DRAFT.participantIds.forEach(userId => {
    (SESSION_DRAFT.perParticipant[userId] || []).forEach(line => {
      if (line.score > 0) ratingRows.push({ beer_id: line.beerId, user_id: userId, rating: line.score, review: line.review });
      if (line.quantity > 0) consumptionRows.push({ beer_id: line.beerId, user_id: userId, quantity: line.quantity });
    });
  });
  if (ratingRows.length){
    await sb.from('beer_ratings').insert(ratingRows.map(r => ({ ...r, session_id: session.id })));
  }
  if (consumptionRows.length){
    await sb.from('beer_consumption').insert(consumptionRows.map(c => ({ ...c, session_id: session.id })));
  }

  await refreshAppData();
  BEER_STATE.view = 'sessions';
  renderPage();
}

/* ---- bestaande sessie bewerken: diff PER DEELNEMER tegen wat er al
   in de DB staat (nooit globaal per bier), zodat:
   - een bierregel die alleen voor deelnemer X bestond nooit records
     voor andere deelnemers aanmaakt of verwijdert (de kern van deze bugfix)
   - XP nooit dubbel toegekend wordt:
     - nieuwe rating/consumptie -> insert (triggert bestaande XP-regels)
     - bestaande rating gewijzigd -> update, GEEN nieuwe rating-XP
     - bestaand aantal gewijzigd -> update, delta-XP-trigger kent
       alleen het verschil toe (zie 0005_beer_session_editing.sql)
     - regel verwijderd -> delete (ruimt ook de bijhorende XP op, zie
       0003_xp_cleanup_triggers.sql)
   - deelnemer volledig uit de sessie gehaald -> al zijn/haar rijen
     voor deze sessie verwijderen (nooit die van anderen) */
async function saveEditedSession(sessionId, date, location){
  const existingSession = APP_DATA.beerSessions.find(s => s.id === sessionId);
  if (!existingSession) return false;

  const { error: updateErr } = await sb.from('beer_sessions')
    .update({ session_date: date, location })
    .eq('id', sessionId);
  if (updateErr) return false;

  const oldParticipants = existingSession.participantIds;
  const newParticipants = SESSION_DRAFT.participantIds;
  const removedParticipants = oldParticipants.filter(id => !newParticipants.includes(id));
  const addedParticipants = newParticipants.filter(id => !oldParticipants.includes(id));

  if (removedParticipants.length){
    await sb.from('beer_session_participants').delete().eq('session_id', sessionId).in('user_id', removedParticipants);
    await sb.from('beer_ratings').delete().eq('session_id', sessionId).in('user_id', removedParticipants);
    await sb.from('beer_consumption').delete().eq('session_id', sessionId).in('user_id', removedParticipants);
  }
  if (addedParticipants.length){
    await sb.from('beer_session_participants').insert(addedParticipants.map(userId => ({ session_id: sessionId, user_id: userId })));
  }

  for (const userId of newParticipants){
    const draftLines = SESSION_DRAFT.perParticipant[userId] || [];
    const existingLines = existingSession.entries.filter(e => e.userId === userId);

    // bieren die deze ene deelnemer niet meer heeft -> enkel HAAR/ZIJN rij verwijderen
    const removedBeerIds = existingLines.map(e => e.beerId).filter(bid => !draftLines.some(l => l.beerId === bid));
    if (removedBeerIds.length){
      await sb.from('beer_ratings').delete().eq('session_id', sessionId).eq('user_id', userId).in('beer_id', removedBeerIds);
      await sb.from('beer_consumption').delete().eq('session_id', sessionId).eq('user_id', userId).in('beer_id', removedBeerIds);
    }

    for (const line of draftLines){
      const existingEntry = existingLines.find(e => e.beerId === line.beerId);
      const hadRating = !!existingEntry && typeof existingEntry.score === 'number' && existingEntry.score > 0;
      const hadConsumption = !!existingEntry && existingEntry.quantity > 0;

      if (line.score > 0 && !hadRating){
        await sb.from('beer_ratings').insert({ beer_id: line.beerId, session_id: sessionId, user_id: userId, rating: line.score, review: line.review });
      } else if (line.score > 0 && hadRating){
        if (line.score !== existingEntry.score || line.review !== (existingEntry.review || '')){
          await sb.from('beer_ratings').update({ rating: line.score, review: line.review }).eq('beer_id', line.beerId).eq('session_id', sessionId).eq('user_id', userId);
        }
      } else if (line.score <= 0 && hadRating){
        await sb.from('beer_ratings').delete().eq('beer_id', line.beerId).eq('session_id', sessionId).eq('user_id', userId);
      }

      if (line.quantity > 0 && !hadConsumption){
        await sb.from('beer_consumption').insert({ beer_id: line.beerId, session_id: sessionId, user_id: userId, quantity: line.quantity });
      } else if (line.quantity > 0 && hadConsumption && line.quantity !== existingEntry.quantity){
        await sb.from('beer_consumption').update({ quantity: line.quantity }).eq('beer_id', line.beerId).eq('session_id', sessionId).eq('user_id', userId);
      } else if (line.quantity <= 0 && hadConsumption){
        await sb.from('beer_consumption').delete().eq('beer_id', line.beerId).eq('session_id', sessionId).eq('user_id', userId);
      }
    }
  }

  return true;
}

function confirmDeleteSession(sessionId){
  openModal(`
    <h3>🗑️ Delete Beer Session?</h3>
    <p>This will remove the session and all consumption, session ratings, Perfect Pours and related session data. This cannot be undone.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button type="button" class="btn btn-danger" onclick="performDeleteSession('${sessionId}')">Delete Session</button>
    </div>
  `);
}

async function performDeleteSession(sessionId){
  await sb.from('beer_sessions').delete().eq('id', sessionId);
  await refreshAppData();
  closeModal();

  BEER_STATE.sessionFormMode = null;
  BEER_STATE.sessionFormEditId = null;
  BEER_STATE.sessionDetailId = null;
  BEER_STATE.view = 'sessions';
  renderPage();
}

      <div class="profile-menu-dropdown" id="profile-menu-dropdown">
        <button type="button" onclick="closeProfileMenu(); goToPage('myprofile');">🙋 My Profile</button>
        <button type="button" onclick="closeProfileMenu(); logout();">🚪 Log out</button>
      </div>
    </div>
  `;
}

function toggleProfileMenu(event){
  if (event) event.stopPropagation();
  const dd = document.getElementById('profile-menu-dropdown');
  if (dd) dd.classList.toggle('open');
}

function closeProfileMenu(){
  const dd = document.getElementById('profile-menu-dropdown');
  if (dd) dd.classList.remove('open');
}

/* dropdown sluiten bij een klik ergens anders op de pagina */
document.addEventListener('click', (e) => {
  if (!e.target.closest('.profile-menu')) closeProfileMenu();
});

/* ---------- 6b. RENDER: login / forgot-password / recovery ----------
   Wordt getoond in plaats van de volledige app zolang er geen actieve
   Supabase-sessie is (STATE.activeUser === null). Vervangt het oude
   lokale "Who enters the Lore?"-gate-scherm door echte Supabase Auth. */
function renderGateScreen(){
  const root = document.getElementById('page-root');

  if (AUTH_STATE.loading){
    root.innerHTML = `<div class="gate-screen"><p class="gate-sub">Bezig met laden…</p></div>`;
    return;
  }

  if (AUTH_STATE.mode === 'recovery'){
    root.innerHTML = `
      <div class="gate-screen">
        <div class="gate-header">
          <div class="logo-badge" style="margin:0 auto;">🗂️</div>
          <h1>Nieuw wachtwoord</h1>
          <p class="gate-sub">Kies een nieuw wachtwoord voor je account.</p>
        </div>
        <div class="modal-box" style="text-align:left; max-width:360px;">
          <form onsubmit="submitNewPasswordForm(event)">
            <div class="form-field">
              <label class="form-label">Nieuw wachtwoord</label>
              <input class="form-input" type="password" name="password" required minlength="6" autocomplete="new-password" />
            </div>
            <div class="form-error">${escapeHtml(AUTH_STATE.error)}</div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Wachtwoord instellen</button>
            </div>
          </form>
        </div>
      </div>
    `;
    return;
  }

  if (AUTH_STATE.mode === 'signup'){
    root.innerHTML = `
      <div class="gate-screen">
        <div class="gate-header">
          <div class="logo-badge" style="margin:0 auto;">🗂️</div>
          <h1>Account aanmaken</h1>
          <p class="gate-sub">Registreer met je e-mail en een wachtwoord.</p>
        </div>
        <div class="modal-box" style="text-align:left; max-width:360px;">
          ${AUTH_STATE.signupSent ? `
            <p>Bijna klaar! Check je mailbox en klik op de bevestigingslink om je account te activeren.</p>
            <div class="form-actions"><button type="button" class="btn" onclick="backToLogin()">Terug naar inloggen</button></div>
          ` : `
            <form onsubmit="submitSignupForm(event)">
              <div class="form-field">
                <label class="form-label">E-mail</label>
                <input class="form-input" type="email" name="email" required autocomplete="email" />
              </div>
              <div class="form-field" style="margin-top:12px;">
                <label class="form-label">Wachtwoord</label>
                <input class="form-input" type="password" name="password" required minlength="6" autocomplete="new-password" />
              </div>
              <div class="form-error">${escapeHtml(AUTH_STATE.error)}</div>
              <div class="form-actions" style="justify-content:space-between; align-items:center;">
                <button type="button" class="btn btn-ghost btn-sm" onclick="backToLogin()">Al een account?</button>
                <button type="submit" class="btn btn-primary">Registreren</button>
              </div>
            </form>
          `}
        </div>
      </div>
    `;
    return;
  }

  if (AUTH_STATE.mode === 'forgot'){
    root.innerHTML = `
      <div class="gate-screen">
        <div class="gate-header">
          <div class="logo-badge" style="margin:0 auto;">🗂️</div>
          <h1>Wachtwoord vergeten</h1>
          <p class="gate-sub">Vul je e-mailadres in, dan sturen we een reset-link.</p>
        </div>
        <div class="modal-box" style="text-align:left; max-width:360px;">
          ${AUTH_STATE.forgotSent ? `
            <p>Als dit e-mailadres bestaat, is er een reset-link naartoe gestuurd. Check je mailbox.</p>
            <div class="form-actions"><button type="button" class="btn" onclick="backToLogin()">Terug naar inloggen</button></div>
          ` : `
            <form onsubmit="submitForgotPasswordForm(event)">
              <div class="form-field">
                <label class="form-label">E-mail</label>
                <input class="form-input" type="email" name="email" required autocomplete="email" />
              </div>
              <div class="form-error">${escapeHtml(AUTH_STATE.error)}</div>
              <div class="form-actions" style="justify-content:space-between;">
                <button type="button" class="btn btn-ghost btn-sm" onclick="backToLogin()">Terug</button>
                <button type="submit" class="btn btn-primary">Verstuur reset-link</button>
              </div>
            </form>
          `}
        </div>
      </div>
    `;
    return;
  }

  root.innerHTML = `
    <div class="gate-screen">
      <div class="gate-header">
        <div class="logo-badge" style="margin:0 auto;">🗂️</div>
        <h1>Office Lore</h1>
        <p class="gate-sub">Log in om verder te gaan.</p>
      </div>
      <div class="modal-box" style="text-align:left; max-width:360px;">
        <form onsubmit="submitLoginForm(event)">
          <div class="form-field">
            <label class="form-label">E-mail</label>
            <input class="form-input" type="email" name="email" required autocomplete="email" />
          </div>
          <div class="form-field" style="margin-top:12px;">
            <label class="form-label">Wachtwoord</label>
            <input class="form-input" type="password" name="password" required autocomplete="current-password" />
          </div>
          <div class="form-error">${escapeHtml(AUTH_STATE.error)}</div>
          <div class="form-actions" style="justify-content:space-between; align-items:center;">
            <button type="button" class="btn btn-ghost btn-sm" onclick="goToForgotPassword()">Wachtwoord vergeten?</button>
            <button type="submit" class="btn btn-primary">Inloggen</button>
          </div>
        </form>
        <p style="text-align:center; margin-top:14px; font-size:12.5px; font-weight:700; color:#8a7a6b;">
          Nog geen account? <a href="#" onclick="goToSignup(); return false;" style="color:var(--ink);">Registreren</a>
        </p>
      </div>
    </div>
  `;
}

/* ---------- 7. RENDER: nav ---------- */
function renderNav(){
  const mount = document.getElementById('main-nav');
  mount.innerHTML = NAV_ITEMS.map(item => `
    <button class="nav-btn ${item.id === STATE.activePage ? 'active' : ''}" data-page="${item.id}">
      <span class="emoji">${item.emoji}</span>${item.label}
    </button>
  `).join('');

  mount.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.activePage = btn.dataset.page;
      renderNav();
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

/* ---------- 8. RENDER: active page ---------- */
function renderPage(){
  refreshAbtLordState(); // altijd actueel: The Abt Lord + The Fallen Abt
  const root = document.getElementById('page-root');
  const mod = MODULES[STATE.activePage];
  if (!mod){
    root.innerHTML = emptyState('Deze pagina bestaat nog niet.');
    return;
  }
  saveNavState(); // onthoudt de huidige pagina (+ Beer Club-subtab) voor de volgende keer
  root.innerHTML = `
    <div class="page active">
      <div class="page-header">
        <h2>${mod.emoji || (NAV_ITEMS.find(n => n.id === STATE.activePage) || {}).emoji || '📄'} ${mod.title}</h2>
        <div class="sub">${mod.subtitle}</div>
      </div>
      ${mod.render(APP_DATA)}
    </div>
  `;
}

/* ---------- 9. RENDER: hele app (gate-screen of normale shell) ----------
   Zolang STATE.activeUser null is (bij eerste load, of na "Switch
   User") tonen we enkel het "Who enters the Lore?"-gate-scherm en
   blijven nav + profielmenu leeg/verborgen. */
function renderApp(){
  const mainNav = document.getElementById('main-nav');
  const switcherMount = document.getElementById('user-switcher');
  if (!STATE.activeUser){
    mainNav.innerHTML = '';
    switcherMount.innerHTML = '';
    renderGateScreen();
    return;
  }
  renderUserSwitcher();
  renderNav();
  renderPage();
}

/* ---------- 10. INIT ---------- */
initAuth();
</script>
</body>
</html>
